name: Finance STPRAVO Employee Settlement Reconcile Production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact current canonical SHA containing reconciliation tooling'
        required: true
        type: string
      confirm_reconcile:
        description: 'Type APPLY_FINANCE_STPRAVO_RECONCILE to authorize the single STPRAVO production correction'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: erpv2-controlled-deploy
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802

jobs:
  reconcile:
    if: ${{ inputs.confirm_reconcile == 'APPLY_FINANCE_STPRAVO_RECONCILE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact canonical source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')" = "$SOURCE_SHA"
          php -l scripts/finance_stpravo_employee_settlement_reconcile.php
          php -l tests/finance_stpravo_employee_settlement_reconcile_contract_test.php
          php tests/finance_stpravo_employee_settlement_reconcile_contract_test.php

      - name: Require successful exact canonical ERP PLANEX CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" > /tmp/ci-runs.json
          SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json, os
          rows=[r for r in json.load(open('/tmp/ci-runs.json')).get('workflow_runs',[]) if r.get('head_sha')==os.environ['SOURCE_SHA'] and r.get('event')=='push']
          if not rows: raise SystemExit('exact canonical ERP PLANEX CI run missing')
          run=max(rows,key=lambda r:r.get('run_number',0))
          if run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit(f"exact canonical ERP PLANEX CI not successful: {run.get('id')} {run.get('status')} {run.get('conclusion')}")
          print(f"FINANCE_STPRAVO_CANONICAL_CI_PASS run={run.get('id')}")
          PY

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"state":"pending","context":"erpv2/finance-stpravo-reconcile","description":"STPRAVO finance reconciliation in progress"}' > /tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/status.json >/dev/null

      - name: Configure isolated SSH transport
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/finance_stpravo_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/finance_stpravo_key" "$HOME/.ssh/known_hosts"
          SSH_CONTROL_DIR="/tmp/finance_stpravo_mux_${GITHUB_RUN_ID}"
          install -d -m 700 "$SSH_CONTROL_DIR"
          SSH_CONTROL_PATH="$SSH_CONTROL_DIR/%C"
          test "${#SSH_CONTROL_PATH}" -lt 90
          printf 'SSH_CONTROL_DIR=%s\nSSH_CONTROL_PATH=%s\n' "$SSH_CONTROL_DIR" "$SSH_CONTROL_PATH" >> "$GITHUB_ENV"

      - name: Verify deployed runtime compatibility and upload exact tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_stpravo_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          SCP=(scp -P "$SSH_PORT" -i "$HOME/.ssh/finance_stpravo_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          DEPLOYED="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          [[ "$DEPLOYED" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$DEPLOYED^{commit}"
          git merge-base --is-ancestor "$DEPLOYED" "$SOURCE_SHA"
          git diff --quiet "$DEPLOYED" "$SOURCE_SHA" -- \
            bootstrap/app.php \
            app/Support/crypto_helper.php \
            app/Support/company_database.php \
            app/Service/ClosingDocumentService.php \
            app/Service/ClosingDocumentComplianceService.php \
            app/Service/FinanceAuditLogService.php
          printf 'DEPLOYED_BEFORE=%s\n' "$DEPLOYED" >> "$GITHUB_ENV"
          "${SCP[@]}" scripts/finance_stpravo_employee_settlement_reconcile.php \
            "$SSH_USER@$SSH_HOST:/tmp/finance_stpravo_reconcile_${GITHUB_RUN_ID}.php"
          echo 'FINANCE_STPRAVO_RUNTIME_COMPATIBILITY_PASS=YES'

      - name: Snapshot BEFORE
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_stpravo_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' FINANCE_STPRAVO_MODE=verify /usr/bin/php8.5 '/tmp/finance_stpravo_reconcile_${GITHUB_RUN_ID}.php'" | tee finance_stpravo_before.txt
          grep -q '^FINANCE_STPRAVO_VERIFY_OK$' finance_stpravo_before.txt
          grep -Eq '^FINANCE_STPRAVO_STATE=(NEEDS_RECONCILE|RECONCILED)$' finance_stpravo_before.txt

      - name: Apply OWNER-authorized single reconciliation
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_stpravo_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' FINANCE_STPRAVO_MODE=apply FINANCE_STPRAVO_CONFIRM='APPLY_FINANCE_STPRAVO_RECONCILE' /usr/bin/php8.5 '/tmp/finance_stpravo_reconcile_${GITHUB_RUN_ID}.php'" | tee finance_stpravo_apply.txt
          grep -q '^FINANCE_STPRAVO_RECONCILE_OK ' finance_stpravo_apply.txt
          grep -q '^FINANCE_STPRAVO_VERIFY_OK$' finance_stpravo_apply.txt

      - name: Snapshot AFTER and prove closing-documents scope
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_stpravo_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' FINANCE_STPRAVO_MODE=verify /usr/bin/php8.5 '/tmp/finance_stpravo_reconcile_${GITHUB_RUN_ID}.php'" | tee finance_stpravo_after.txt
          grep -q '^FINANCE_STPRAVO_STATE=RECONCILED$' finance_stpravo_after.txt
          grep -q '^FINANCE_STPRAVO_VERIFY_OK$' finance_stpravo_after.txt
          grep -q '"present":true' finance_stpravo_after.txt
          grep -q '"profile_code":"legal_entity"' finance_stpravo_after.txt
          grep -q '"normalized_inn":"9705228628"' finance_stpravo_after.txt

      - name: HTTP health and deploy marker unchanged
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
          CURRENT="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_stpravo_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$CURRENT" = "$DEPLOYED_BEFORE"
          echo 'FINANCE_STPRAVO_HTTP_PASS=YES'
          echo 'DEPLOY_MARKER_UNCHANGED=YES'

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance_stpravo_reconcile_${{ inputs.source_sha }}
          path: |
            finance_stpravo_before.txt
            finance_stpravo_apply.txt
            finance_stpravo_after.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish final reconciliation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; desc='STPRAVO finance reconciliation verified'; else state=failure; desc='STPRAVO finance reconciliation failed'; fi
          python3 - "$state" "$desc" > /tmp/status.json <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/finance-stpravo-reconcile','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/status.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -u
          if [ -f "$HOME/.ssh/finance_stpravo_key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_stpravo_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/finance_stpravo_reconcile_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/finance_stpravo_key"
          rm -rf "${SSH_CONTROL_DIR:-}"
