name: FEO Import Sync Configuration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact canonical SHA already deployed
        required: true
        type: string
      confirm_activation:
        description: Type CONFIGURE_FEO_IMPORT_SYNC
        required: true
        type: string

      mode:
        description: Check readiness or activate mirror (no business data writes)
        required: true
        type: choice
        options: [check, activate]
        default: check
      company_id:
        description: Exact company ID; 0 with check lists active company IDs
        required: true
        type: string
        default: '0'
      connection_mode:
        description: Shared tenant account or protected separate legacy credentials
        required: true
        type: choice
        options: [shared, separate]
        default: shared
      legacy_database:
        description: Exact legacy schema on the same MySQL server
        required: true
        type: string
        default: spugovxsim_frega
      transfer_mirror:
        description: Enable atomic mirroring for future FEO transfer blocks only
        required: true
        type: choice
        options: ['no', 'yes']
        default: 'no'
      confirm_transfer_mirror:
        description: Type ENABLE_FEO_TRANSFER_MIRROR when transfer_mirror is yes
        required: false
        type: string
permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: erpv2-controlled-deploy
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt

jobs:
  activate:
    if: ${{ inputs.confirm_activation == 'CONFIGURE_FEO_IMPORT_SYNC' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Validate exact canonical source and CI
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" > /tmp/ci.json
          python3 - <<'PY'
          import json,os
          rows=[r for r in json.load(open('/tmp/ci.json'))['workflow_runs'] if r['head_sha']==os.environ['SOURCE_SHA'] and r['head_branch']==os.environ['CANONICAL_BRANCH']]
          if not rows or max(rows,key=lambda r:r['run_number'])['conclusion']!='success': raise SystemExit('Exact canonical CI PASS required')
          PY
          php -l scripts/feo_legacy_sync_configure.php
          php tests/feo_legacy_sync_configuration_test.php
      - name: Configure isolated transport and require deployed SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/feo_import_sync_configuration"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/feo_import_sync_configuration" "$HOME/.ssh/known_hosts"
          marker="$(ssh -p "$PORT" -i "$HOME/.ssh/feo_import_sync_configuration" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "cat '$DEPLOY_MARKER'")"
          test "$marker" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status" > /tmp/deploy.json
          python3 - <<'PY'
          import json
          rows=[s for s in json.load(open('/tmp/deploy.json'))['statuses'] if s['context']=='erpv2/deploy']
          if not rows or rows[0]['state']!='success': raise SystemExit('Successful deployed SHA required')
          PY
      - name: Check or configure import mirror without business data writes
        shell: bash
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          MODE: ${{ inputs.mode }}
          COMPANY_ID: ${{ inputs.company_id }}
          LEGACY_DATABASE: ${{ inputs.legacy_database }}
          CONNECTION_MODE: ${{ inputs.connection_mode }}
          LEGACY_CONNECTION: ${{ secrets.FEO_LEGACY_SYNC_CONNECTION }}
          TRANSFER_MIRROR: ${{ inputs.transfer_mirror }}
          TRANSFER_CONFIRM: ${{ inputs.confirm_transfer_mirror }}
        run: |
          set -euo pipefail
          [[ "$MODE" = check || "$MODE" = activate ]]
          [[ "$COMPANY_ID" =~ ^[0-9]+$ ]]
          [[ "$LEGACY_DATABASE" =~ ^[A-Za-z0-9_]{1,64}$ ]]
          [[ "$CONNECTION_MODE" = shared || "$CONNECTION_MODE" = separate ]]
          [[ "$TRANSFER_MIRROR" = no || "$TRANSFER_MIRROR" = yes ]]
          if [ "$TRANSFER_MIRROR" = yes ]; then test "$TRANSFER_CONFIRM" = ENABLE_FEO_TRANSFER_MIRROR; fi
          if [ "$CONNECTION_MODE" = separate ]; then test -n "$LEGACY_CONNECTION"; fi
          if [ "$MODE" = activate ]; then test "$COMPANY_ID" -gt 0; fi
          remote="/tmp/feo_import_sync_configuration_${GITHUB_RUN_ID}.php"
          scp -P "$PORT" -i "$HOME/.ssh/feo_import_sync_configuration" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/feo_legacy_sync_configure.php "$USER@$HOST:$remote"
          printf '%s' "$LEGACY_CONNECTION" | ssh -p "$PORT" -i "$HOME/.ssh/feo_import_sync_configuration" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' FEO_SYNC_CONFIRM=CONFIGURE_FEO_IMPORT_SYNC FEO_SYNC_CONFIGURE_MODE='$MODE' FEO_SYNC_COMPANY_ID='$COMPANY_ID' FEO_SYNC_LEGACY_DATABASE='$LEGACY_DATABASE' FEO_SYNC_CONNECTION_MODE='$CONNECTION_MODE' FEO_SYNC_TRANSFER_MIRROR='$([ "$TRANSFER_MIRROR" = yes ] && echo 1 || echo 0)' FEO_SYNC_TRANSFER_CONFIRM='$TRANSFER_CONFIRM' /usr/bin/php8.5 '$remote'" | tee feo_import_sync_configuration.txt
          if [ "$COMPANY_ID" -gt 0 ]; then grep -q '^FEO_IMPORT_SYNC_CONFIGURATION_PASS$' feo_import_sync_configuration.txt; fi
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
      - name: Upload redacted activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feo_import_sync_configuration_${{ inputs.source_sha }}
          path: feo_import_sync_configuration.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish activation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" -f state="$state" -f context=erpv2/feo-import-sync -f description='FEO import synchronization configuration checked' >/dev/null
      - name: Cleanup transport
        if: always()
        shell: bash
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/feo_import_sync_configuration" ]; then
            ssh -p "$PORT" -i "$HOME/.ssh/feo_import_sync_configuration" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "rm -f '/tmp/feo_import_sync_configuration_${GITHUB_RUN_ID}.php'" || true
          fi
          rm -f "$HOME/.ssh/feo_import_sync_configuration"
