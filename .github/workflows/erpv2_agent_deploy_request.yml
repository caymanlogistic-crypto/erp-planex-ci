name: ERPv2 Agent Deploy Request

on:
  push:
    branches:
      - deploy/erpv2-agent

permissions:
  contents: read
  actions: write

concurrency:
  group: erpv2-agent-deploy-request
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  DEPLOY_REQUEST_BRANCH: deploy/erpv2-agent
  CONTROLLED_DEPLOY_WORKFLOW: erpv2_controlled_deploy.yml
  CANONICAL_CI_WORKFLOW: ci.yml

jobs:
  authorize-and-dispatch:
    if: ${{ github.ref_name == 'deploy/erpv2-agent' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout deploy request SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact canonical HEAD
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$REF_NAME" = "$DEPLOY_REQUEST_BRANCH"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}"
          canonical_sha="$(git rev-parse "refs/remotes/origin/${CANONICAL_BRANCH}")"
          test "$SOURCE_SHA" = "$canonical_sha"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'AGENT_DEPLOY_SOURCE_SHA=%s\nCANONICAL_HEAD_SHA=%s\n' "$SOURCE_SHA" "$canonical_sha"

      - name: Ensure exact canonical ERP PLANEX CI PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail

          read_state() {
            local event="$1"
            local runs_json
            runs_json="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL/repos/$REPOSITORY/actions/workflows/$CANONICAL_CI_WORKFLOW/runs?head_sha=$SOURCE_SHA&event=$event&per_page=20")"
            RUNS_JSON="$runs_json" SOURCE_SHA="$SOURCE_SHA" CANONICAL_BRANCH="$CANONICAL_BRANCH" EVENT="$event" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RUNS_JSON'])
          source = os.environ['SOURCE_SHA']
          branch = os.environ['CANONICAL_BRANCH']
          event = os.environ['EVENT']
          matches = [
              r for r in data.get('workflow_runs', [])
              if r.get('head_sha') == source
              and r.get('head_branch') == branch
              and r.get('event') == event
          ]
          if not matches:
              print('NONE')
          else:
              run = max(matches, key=lambda r: r.get('run_number', 0))
              if run.get('status') != 'completed':
                  print(f"WAIT:{run.get('id')}:{run.get('run_number')}:{event}")
              elif run.get('conclusion') == 'success':
                  print(f"PASS:{run.get('id')}:{run.get('run_number')}:{event}")
              else:
                  print(f"FAIL:{run.get('id')}:{run.get('run_number')}:{event}:{run.get('conclusion')}")
          PY
          }

          push_state="$(read_state push)"
          case "$push_state" in
            PASS:*) echo "ERP_PLANEX_CI_$push_state"; exit 0 ;;
            FAIL:*) echo "Canonical push CI failed: $push_state" >&2; exit 1 ;;
            WAIT:*) echo "Canonical push CI already running: $push_state" ;;
            NONE) echo 'No exact canonical push CI run found; requesting exact canonical CI via workflow_dispatch.' ;;
            *) echo "Unexpected push CI state: $push_state" >&2; exit 1 ;;
          esac

          dispatch_state="$(read_state workflow_dispatch)"
          case "$dispatch_state" in
            PASS:*) echo "ERP_PLANEX_CI_$dispatch_state"; exit 0 ;;
            FAIL:*) echo "Canonical dispatched CI failed: $dispatch_state" >&2; exit 1 ;;
            WAIT:*) echo "Canonical dispatched CI already running: $dispatch_state" ;;
            NONE)
              if [ "$push_state" = NONE ]; then
                payload="$(CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY'
          import json, os
          print(json.dumps({'ref': os.environ['CANONICAL_BRANCH']}))
          PY
                )"
                code="$(curl -sS -o /tmp/ci-dispatch-response.txt -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$API_URL/repos/$REPOSITORY/actions/workflows/$CANONICAL_CI_WORKFLOW/dispatches" \
                  -d "$payload")"
                test "$code" = 204
                echo 'AGENT_DEPLOY_CANONICAL_CI_DISPATCHED=YES'
              fi
              ;;
            *) echo "Unexpected dispatched CI state: $dispatch_state" >&2; exit 1 ;;
          esac

          for attempt in $(seq 1 90); do
            push_state="$(read_state push)"
            dispatch_state="$(read_state workflow_dispatch)"
            for state in "$push_state" "$dispatch_state"; do
              case "$state" in
                PASS:*) echo "ERP_PLANEX_CI_$state"; exit 0 ;;
                FAIL:*) echo "Canonical CI failed: $state" >&2; exit 1 ;;
              esac
            done
            echo "Waiting for exact canonical CI ($attempt/90): push=$push_state dispatch=$dispatch_state"
            sleep 10
          done
          echo 'Timed out waiting for exact canonical ERP PLANEX CI.' >&2
          exit 1

      - name: Reconfirm canonical HEAD immediately before dispatch
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}"
          test "$SOURCE_SHA" = "$(git rev-parse "refs/remotes/origin/${CANONICAL_BRANCH}")"

      - name: Dispatch controlled production deploy for exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          payload="$(SOURCE_SHA="$SOURCE_SHA" CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'ref': os.environ['CANONICAL_BRANCH'],
              'inputs': {
                  'source_sha': os.environ['SOURCE_SHA'],
                  'confirm_deploy': 'DEPLOY_ERPV2',
              },
          }))
          PY
          )"
          curl -fsS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/workflows/$CONTROLLED_DEPLOY_WORKFLOW/dispatches" \
            -d "$payload" | grep -qx '204'
          printf 'AGENT_DEPLOY_REQUEST_DISPATCHED=YES\nSOURCE_SHA=%s\nTARGET=/erpv2\n' "$SOURCE_SHA"
