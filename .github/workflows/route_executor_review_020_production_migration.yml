name: Route Executor Review 020 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact deployed canonical SHA
        required: true
        type: string
      confirm_migration:
        description: Type APPLY_ROUTE_EXECUTOR_REVIEW_020
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: erpv2-controlled-deploy
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802

jobs:
  migrate:
    if: ${{ inputs.confirm_migration == 'APPLY_ROUTE_EXECUTOR_REVIEW_020' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact canonical source and CI
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')" = "$SOURCE_SHA"
          php -l scripts/route_executor_review_recipients_020_migration.php
          test -s database/migrations/020_route_executor_review_email_recipients.sql
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" > /tmp/route-executor-review-020-ci.json
          SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json, os
          rows = [r for r in json.load(open('/tmp/route-executor-review-020-ci.json')).get('workflow_runs', [])
                  if r.get('head_sha') == os.environ['SOURCE_SHA'] and r.get('event') == 'push']
          if not rows or max(rows, key=lambda r: r.get('run_number', 0)).get('conclusion') != 'success':
              raise SystemExit('Exact canonical ERP PLANEX CI is not green')
          print('ROUTE_EXECUTOR_REVIEW_020_CI_PASS=YES')
          PY

      - name: Configure isolated SSH transport
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/route_executor_review_020_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/route_executor_review_020_key" "$HOME/.ssh/known_hosts"

      - name: Verify deployed marker and transfer guarded script
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/route_executor_review_020_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -P "$SSH_PORT" -i "$HOME/.ssh/route_executor_review_020_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          test "$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")" = "$SOURCE_SHA"
          "${SCP[@]}" scripts/route_executor_review_recipients_020_migration.php \
            "$SSH_USER@$SSH_HOST:/tmp/route_executor_review_020_${GITHUB_RUN_ID}.php"

      - name: Inspect, apply and verify central 020
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          migration_hash="$(sha256sum database/migrations/020_route_executor_review_email_recipients.sql | awk '{print $1}')"
          remote=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/route_executor_review_020_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          base="PLANEX_ROOT='$LIVE_ROOT' PLANEX_SOURCE_SHA='$SOURCE_SHA' PLANEX_DEPLOY_MARKER='$DEPLOY_MARKER' PLANEX_MIGRATION_SHA256='$migration_hash'"
          script="/tmp/route_executor_review_020_${GITHUB_RUN_ID}.php"
          "${remote[@]}" "$base /usr/bin/php8.5 '$script'" | tee before.txt
          grep -q '^ROUTE_EXECUTOR_REVIEW_020_READ_ONLY_OK$' before.txt
          "${remote[@]}" "$base ROUTE_EXECUTOR_REVIEW_020_MODE=apply ROUTE_EXECUTOR_REVIEW_020_CONFIRM=APPLY_ROUTE_EXECUTOR_REVIEW_020 /usr/bin/php8.5 '$script'" | tee apply.txt
          grep -q '^ROUTE_EXECUTOR_REVIEW_020_APPLY_OK$' apply.txt
          "${remote[@]}" "$base /usr/bin/php8.5 '$script'" | tee after.txt
          grep -q '^ROUTE_EXECUTOR_REVIEW_020_READ_ONLY_OK$' after.txt
          test "$("${remote[@]}" "cat '$DEPLOY_MARKER'")" = "$SOURCE_SHA"
          echo 'ROUTE_EXECUTOR_REVIEW_020_PRODUCTION_PASS=YES'

      - name: Save migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-executor-review-020-${{ github.run_id }}
          path: |
            before.txt
            apply.txt
            after.txt
          if-no-files-found: ignore

      - name: Remove temporary SSH material
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          if [ -f "$HOME/.ssh/route_executor_review_020_key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/route_executor_review_020_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/route_executor_review_020_${GITHUB_RUN_ID}.php'" || true
          fi
          rm -f "$HOME/.ssh/route_executor_review_020_key"
