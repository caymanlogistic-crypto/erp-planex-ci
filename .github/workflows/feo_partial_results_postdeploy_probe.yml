name: FEO Partial Results Postdeploy Probe

on:
  push:
    branches:
      - diagnostic/feo-partial-results-postdeploy-20260825

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect toolbar search handler
        run: |
          set -euo pipefail
          echo '=== toolbar-search refs ==='
          grep -n -C 8 'toolbar-search' public/assets/js/app.js || true
          echo '=== table row hide refs ==='
          grep -n -C 6 "classList.*is-hidden\|is-hidden.*classList" public/assets/js/app.js | tail -n 160 || true
