name: FEO Partial Results Postdeploy Probe

on:
  push:
    branches:
      - diagnostic/feo-partial-results-postdeploy-20260825

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect FEO table layout CSS
        run: |
          set -euo pipefail
          echo '=== table-card rules ==='
          grep -R -n -C 5 'table-card--standard\|\.table-card[[:space:]]*{' public/assets/css app/View | head -n 260 || true
          echo '=== table scroll/table rules ==='
          grep -R -n -C 4 '\.table-scroll\|\.table tbody\|\.table td\|\.table tr' public/assets/css | head -n 320 || true
