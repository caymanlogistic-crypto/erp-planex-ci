name: FEO Partial Results Postdeploy Probe

on:
  push:
    branches:
      - diagnostic/feo-partial-results-postdeploy-20260825

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Verify deployed FEO warning flow and partial rows
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: 344a9d16e2f50dde4ed2f3011a7bfbe6fa4ff617
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "EXPECTED_SHA='$EXPECTED_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp/public_html/erpv2
          VIEW="$ROOT/app/View/pages/company_feo_requests.php"
          MARKER=/home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
          test "$(cat "$MARKER")" = "$EXPECTED_SHA"
          /usr/bin/php8.5 -l "$VIEW" >/dev/null
          grep -Fq '.feo-table-card{display:block;min-width:0}' "$VIEW"
          grep -Fq 'class="table-card table-card--standard feo-table-card"' "$VIEW"
          grep -Fq 'data-feo-search-message' "$VIEW"
          grep -Fq 'data-feo-scroll' "$VIEW"
          echo 'DEPLOYED_BLOCK_FLOW=PASS'

          PLANEX_ROOT="$ROOT" /usr/bin/php8.5 <<'PHP'
          <?php
          declare(strict_types=1);
          $root=(string)getenv('PLANEX_ROOT');
          $config=require $root.'/bootstrap/app.php';
          require_once $root.'/app/Core/Database.php';
          require_once $root.'/app/Support/crypto_helper.php';
          require_once $root.'/app/Support/company_database.php';
          require_once $root.'/app/Service/FeoRequestService.php';
          $centralDb=new App\Core\Database($config['database']);
          $stmt=$centralDb->connection()->prepare('SELECT * FROM companies WHERE id=? LIMIT 1');
          $stmt->execute([25]);
          $company=$stmt->fetch(PDO::FETCH_ASSOC);
          if(!$company) throw new RuntimeException('Target company not found');
          $service=new App\Service\FeoRequestService($config,$centralDb);
          $pdo=$service->localPdo($company);
          if(!$service->moduleReady($pdo)) throw new RuntimeException('FEO module not ready');
          $result=$service->listRequestsBatch($pdo,'176748 176754 111111 222222','',0,80);
          $rowIds=array_map(static fn(array $r):string=>(string)($r['zayavka_id']??''),$result['rows']??[]);
          sort($rowIds,SORT_STRING);
          $missing=array_map('strval',$result['missing_ids']??[]);
          sort($missing,SORT_STRING);
          $expectedRows=['176748','176754']; sort($expectedRows,SORT_STRING);
          $expectedMissing=['111111','222222']; sort($expectedMissing,SORT_STRING);
          if($rowIds!==$expectedRows) throw new RuntimeException('Unexpected partial rows: '.implode(',',$rowIds));
          if($missing!==$expectedMissing) throw new RuntimeException('Unexpected missing IDs: '.implode(',',$missing));
          if((int)($result['total']??-1)!==2) throw new RuntimeException('Unexpected total');
          echo 'ROWS='.implode(',',$rowIds).PHP_EOL;
          echo 'MISSING='.implode(',',$missing).PHP_EOL;
          echo 'PARTIAL_SERVICE_ROWS=PASS'.PHP_EOL;
          PHP

          echo "DEPLOYED_SHA=$(cat "$MARKER")"
          echo 'FEO_WARNING_FLOW_POSTDEPLOY=PASS'
          REMOTE
