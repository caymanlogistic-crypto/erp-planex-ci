name: MAX Messaging Acceptance Agent Request

on:
  push:
    branches:
      - qa/max-messaging-acceptance-agent

permissions:
  actions: write
  contents: read

concurrency:
  group: max-messaging-acceptance-agent-request
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  REQUEST_BRANCH: qa/max-messaging-acceptance-agent

jobs:
  authorize-and-dispatch:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout acceptance request SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact canonical HEAD
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$REF_NAME" = "$REQUEST_BRANCH"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}"
          canonical_sha="$(git rev-parse "refs/remotes/origin/${CANONICAL_BRANCH}")"
          test "$SOURCE_SHA" = "$canonical_sha"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact canonical CI and production prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" \
              > /tmp/ci-runs.json
            state="$(SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json,os
          source=os.environ['SOURCE_SHA']
          rows=[r for r in json.load(open('/tmp/ci-runs.json')).get('workflow_runs',[]) if r.get('head_sha')==source and r.get('event')=='push']
          if not rows:
              print('WAIT')
          else:
              run=max(rows,key=lambda r:r.get('run_number',0))
              if run.get('status')!='completed': print('WAIT')
              elif run.get('conclusion')=='success': print(f"PASS:{run.get('id')}:{run.get('run_number')}")
              else: print(f"FAIL:{run.get('id')}:{run.get('run_number')}:{run.get('conclusion')}")
          PY
            )"
            case "$state" in
              PASS:*) echo "MAX_ACCEPTANCE_CANONICAL_CI_$state"; break ;;
              FAIL:*) echo "Canonical CI failed: $state" >&2; exit 1 ;;
              WAIT) sleep 10 ;;
              *) echo "Unexpected CI state: $state" >&2; exit 1 ;;
            esac
            if [ "$attempt" -eq 72 ]; then echo 'Timed out waiting for exact canonical CI.' >&2; exit 1; fi
          done
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/commits/$SOURCE_SHA/status" > /tmp/status.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/status.json')).get('statuses',[])
          for context in ('erpv2/migration133','erpv2/deploy'):
              row=next((r for r in rows if r.get('context')==context),None)
              if not row or row.get('state')!='success':
                  raise SystemExit(f'missing successful prerequisite status: {context}')
              print(f"MAX_ACCEPTANCE_PREREQUISITE_PASS={context}")
          PY

      - name: Reconfirm canonical HEAD immediately before dispatch
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}"
          test "$SOURCE_SHA" = "$(git rev-parse "refs/remotes/origin/${CANONICAL_BRANCH}")"

      - name: Dispatch guarded MAX production acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$SOURCE_SHA" CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY' > /tmp/max-acceptance-dispatch.json
          import json,os
          print(json.dumps({'ref':os.environ['CANONICAL_BRANCH'],'inputs':{'source_sha':os.environ['SOURCE_SHA']}}))
          PY
          code="$(curl -fsS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/workflows/max_messaging_production_acceptance.yml/dispatches" \
            --data-binary @/tmp/max-acceptance-dispatch.json)"
          test "$code" = 204
          printf 'MAX_ACCEPTANCE_DISPATCHED=YES\nSOURCE_SHA=%s\n' "$SOURCE_SHA"
