name: Document Generator 127 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing document generator migration 127 tooling'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_DOCUMENT_GENERATOR_127 to authorize production migration 127'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: document-generator-127-production-migration
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2

jobs:
  migrate-127:
    if: ${{ inputs.confirm_migration == 'APPLY_DOCUMENT_GENERATOR_127' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Validate exact source and tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          php -l scripts/document_generator_apply_127.php
          php -l scripts/document_generator_verify_127.php
          php tests/document_generator_127_production_migration_contract_test.php
          php tests/agent_db_migration_request_contract_test.php
          test -s database/migrations-local/127_create_document_generator.sql
          test -s database/migrations/012_add_company_bank_requisites.sql

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - > /tmp/payload.json <<'PY'
          import json
          print(json.dumps({'state':'pending','context':'erpv2/migration127','description':'Document generator migration 127 in progress'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Upload isolated migration tooling
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/document_generator_verify_127.php "$SSH_USER@$SSH_HOST:/tmp/docgen_verify127_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/document_generator_apply_127.php "$SSH_USER@$SSH_HOST:/tmp/docgen_apply127_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            database/migrations-local/127_create_document_generator.sql "$SSH_USER@$SSH_HOST:/tmp/docgen_127_${GITHUB_RUN_ID}.sql"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            database/migrations/012_add_company_bank_requisites.sql "$SSH_USER@$SSH_HOST:/tmp/docgen_control012_${GITHUB_RUN_ID}.sql"

      - name: Snapshot before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/docgen_verify127_${GITHUB_RUN_ID}.php'" | tee docgen127_before.txt
          grep -q 'DOCGEN_127_READ_ONLY_OK' docgen127_before.txt

      - name: Apply control-plane 012 and tenant migration 127
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TENANT_MIGRATION_PATH='/tmp/docgen_127_${GITHUB_RUN_ID}.sql' PLANEX_CONTROL_MIGRATION_PATH='/tmp/docgen_control012_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/docgen_apply127_${GITHUB_RUN_ID}.php'" | tee docgen127_migration.txt
          grep -q 'DOCGEN_127_OK' docgen127_migration.txt

      - name: Snapshot after and verify invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/docgen_verify127_${GITHUB_RUN_ID}.php'" | tee docgen127_after.txt
          grep -q 'DOCGEN_127_READ_ONLY_OK' docgen127_after.txt
          python3 - "$(sed -n 's/^DOCGEN_127_SNAPSHOT=//p' docgen127_before.txt)" "$(sed -n 's/^DOCGEN_127_SNAPSHOT=//p' docgen127_after.txt)" <<'PY'
          import json, sys
          before, after = map(json.loads, sys.argv[1:3])
          bc, ac = before['central'], after['central']
          if bc['db'] != ac['db'] or bc['companies'] != ac['companies']:
              raise SystemExit('control-plane identity/company count changed')
          for key in ('bank_account','bank_name','bank_bik','bank_corr_account'):
              if ac[key] != 1:
                  raise SystemExit(f'control-plane bank column missing after migration: {key}')
          b = {x['company_id']: x for x in before['tenants']}
          a = {x['company_id']: x for x in after['tenants']}
          if set(b) != set(a):
              raise SystemExit('active tenant set changed during migration')
          stable = ('contractors','drivers','vehicle_units','vehicle_sets','crews','feo_requests')
          table_flags = ('document_templates_table','document_template_versions_table','generated_documents_table','generated_document_requests_table')
          table_counts = ('document_templates','document_template_versions','generated_documents','generated_document_requests')
          for cid, row in a.items():
              old = b[cid]
              if old['migration_126'] != 1 or row['migration_126'] != 1:
                  raise SystemExit(f'company {cid}: migration 126 prerequisite missing')
              if row['migration_127'] != 1:
                  raise SystemExit(f'company {cid}: migration 127 journal missing')
              for key in stable:
                  if row[key] != old[key]:
                      raise SystemExit(f'company {cid}: business row count changed for {key}')
              for key in table_flags:
                  if row[key] != 1:
                      raise SystemExit(f'company {cid}: document generator schema missing for {key}')
              if old['migration_127'] == 1:
                  for key in table_counts:
                      if row[key] != old[key]:
                          raise SystemExit(f'company {cid}: idempotent rerun changed {key}')
              else:
                  for key in table_flags:
                      if old[key] != 0:
                          raise SystemExit(f'company {cid}: unjournaled document generator schema existed before migration')
                  for key in table_counts:
                      if old[key] != 0 or row[key] != 0:
                          raise SystemExit(f'company {cid}: migration unexpectedly created business rows in {key}')
          print('DOCGEN_127_INVARIANTS_OK')
          PY

      - name: HTTP acceptance
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document_generator_127_production_migration_${{ inputs.source_sha }}
          path: |
            docgen127_before.txt
            docgen127_migration.txt
            docgen127_after.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Document generator migration 127 verified'; else state=failure; desc='Document generator migration 127 failed'; fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json, sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/migration127','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/docgen_verify127_${GITHUB_RUN_ID}.php' '/tmp/docgen_apply127_${GITHUB_RUN_ID}.php' '/tmp/docgen_127_${GITHUB_RUN_ID}.sql' '/tmp/docgen_control012_${GITHUB_RUN_ID}.sql'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/key"
