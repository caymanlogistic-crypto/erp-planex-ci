name: FEO Request Costs Production Visual QA

on:
  push:
    branches:
      - qa/feo-request-costs-production-20260828

permissions:
  contents: read
  statuses: read

env:
  SOURCE_SHA: d5afd3a76e410eee9707e3b593102396822cd694

jobs:
  production-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact canonical and successful deploy status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          git fetch origin chatgpt/production-stabilization-20260802 --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/commits/$SOURCE_SHA/status" > /tmp/status.json
          python3 - /tmp/status.json <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          rows=[x for x in data.get('statuses',[]) if x.get('context')=='erpv2/deploy']
          if not rows or rows[0].get('state')!='success':
              raise SystemExit('exact source SHA does not have erpv2/deploy success')
          print('EXACT_DEPLOY_STATUS=PASS')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Create temporary read-only QA session
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          REMOTE="/tmp/feo_cost_qa_session_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes .github/feo-request-costs/qa_session.php "$SSH_USER@$SSH_HOST:$REMOTE"
          OUT=$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT=\"\$HOME/planexp/public_html/erpv2\" /usr/bin/php8.5 '$REMOTE' create")
          JSON=${OUT#QA_SESSION=}
          python3 - "$JSON" "$GITHUB_ENV" <<'PY'
          import json,sys
          obj=json.loads(sys.argv[1])
          sid=obj['sid']; cookie=obj['cookie']
          print(f'::add-mask::{sid}')
          with open(sys.argv[2],'a') as f:
              f.write(f'QA_SESSION_ID={sid}\nQA_COOKIE_NAME={cookie}\n')
          PY
      - name: Prepare QA script for async system UI
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf 'QA started for %s\n' "$SOURCE_SHA" > artifacts/qa-started.txt
          python3 - <<'PY'
          p='.github/feo-request-costs/production_visual.js'
          s=open(p,encoding='utf-8').read()
          s=s.replace("page.locator('#feo-cost-detail-modal [data-close-modal=\"feo-cost-detail-modal\"]').click();", "page.locator('#feo-cost-detail-modal [data-close-modal=\"feo-cost-detail-modal\"]').first().click();")
          s=s.replace("page.locator('#feo-cost-confirm-modal [data-close-modal=\"feo-cost-confirm-modal\"]').click();", "page.locator('#feo-cost-confirm-modal [data-close-modal=\"feo-cost-confirm-modal\"]').first().click();")
          s=s.replace("assert(confirmText.includes('42 560')&&confirmText.includes('30 000'),'confirmation must show old/new weight');", "const confirmCompact=confirmText.replace(/\\s/g,'');assert(confirmCompact.includes('42560')&&confirmCompact.includes('30000'),'confirmation must show old/new weight');")
          s=s.replace("old_total_mass_kg:42560,old_total_cost:1468320,composition_changed:true", "old_request_count:3,old_total_mass_kg:42560,old_total_cost:1468320,composition_changed:true")
          needle="assert(confirmText.includes('111111'),'confirmation must show added request');"
          replacement="assert(/Заявок:\\s*3\\s*→\\s*3/.test(confirmText),'confirmation must show request count old→new');\n  "+needle
          s=s.replace(needle,replacement)
          s=s.replace("sourceSha:'544c1db382df5b9e1e5ca23d1a6a09a82550eb4a'", "sourceSha:process.env.SOURCE_SHA")
          old="await page.waitForSelector('#feo-cost-detail-modal.is-open');\n  assert((await page.locator('[data-cost-detail-title]').innerText()).includes('#999999'),'detail modal failed from search double-click');"
          new="await page.waitForSelector('#feo-cost-detail-modal.is-open');\n  await page.locator('[data-cost-detail-title]').filter({hasText:'#999999'}).waitFor({state:'visible'});"
          s=s.replace(old,new)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Browser QA on real production page
        run: node .github/feo-request-costs/production_visual.js
      - name: Cleanup temporary QA session and prove old SID is unusable
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -u -o pipefail
          mkdir -p artifacts
          REMOTE="/tmp/feo_cost_qa_session_${GITHUB_RUN_ID}.php"
          STATUS=0
          if [ -z "${QA_SESSION_ID:-}" ] || [ -z "${QA_COOKIE_NAME:-}" ]; then
            echo 'QA_SESSION_CLEANUP_FAIL=session env missing' | tee artifacts/qa-session-cleanup.txt
            STATUS=1
          elif [ ! -f "$HOME/.ssh/key" ]; then
            echo 'QA_SESSION_CLEANUP_FAIL=ssh key missing' | tee artifacts/qa-session-cleanup.txt
            STATUS=1
          else
            if OUT=$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "PLANEX_ROOT=\"\$HOME/planexp/public_html/erpv2\" /usr/bin/php8.5 '$REMOTE' delete '$QA_SESSION_ID'"); then
              printf '%s\n' "$OUT" | tee artifacts/qa-session-cleanup.txt
              [ "$OUT" = 'QA_SESSION_DELETED' ] || STATUS=1
            else
              echo 'QA_SESSION_CLEANUP_FAIL=delete command failed' | tee artifacts/qa-session-cleanup.txt
              STATUS=1
            fi

            HTTP=$(curl -sS -D artifacts/qa-session-old-sid-headers.txt -o /dev/null -w '%{http_code}' \
              -H "Cookie: ${QA_COOKIE_NAME}=${QA_SESSION_ID}" \
              'https://plan-ex.ru/erpv2/company/feo/requests/costs' || true)
            printf 'QA_SESSION_OLD_SID_HTTP=%s\n' "$HTTP" | tee -a artifacts/qa-session-cleanup.txt
            if [ "$HTTP" = '200' ]; then
              echo 'QA_SESSION_CLEANUP_FAIL=old SID still authenticated' | tee -a artifacts/qa-session-cleanup.txt
              STATUS=1
            elif grep -Eqi '^location: .*\/erpv2\/login' artifacts/qa-session-old-sid-headers.txt; then
              echo 'QA_SESSION_OLD_SID_REJECTED' | tee -a artifacts/qa-session-cleanup.txt
            else
              echo 'QA_SESSION_CLEANUP_FAIL=old SID did not redirect to login' | tee -a artifacts/qa-session-cleanup.txt
              STATUS=1
            fi

            if OUT2=$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "PLANEX_ROOT=\"\$HOME/planexp/public_html/erpv2\" /usr/bin/php8.5 '$REMOTE' delete '$QA_SESSION_ID'"); then
              [ "$OUT2" = 'QA_SESSION_DELETED' ] || STATUS=1
              echo 'QA_SESSION_DELETED_FINAL' | tee -a artifacts/qa-session-cleanup.txt
            else
              echo 'QA_SESSION_CLEANUP_FAIL=final delete failed' | tee -a artifacts/qa-session-cleanup.txt
              STATUS=1
            fi

            if ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE' && test ! -e '$REMOTE'"; then
              echo 'QA_SESSION_HELPER_REMOVED' | tee -a artifacts/qa-session-cleanup.txt
            else
              echo 'QA_SESSION_CLEANUP_FAIL=remote helper removal failed' | tee -a artifacts/qa-session-cleanup.txt
              STATUS=1
            fi
          fi
          rm -f "$HOME/.ssh/key"
          if [ -e "$HOME/.ssh/key" ]; then
            echo 'QA_SESSION_CLEANUP_FAIL=local key remains' | tee -a artifacts/qa-session-cleanup.txt
            STATUS=1
          fi
          if [ "$STATUS" -eq 0 ]; then
            echo 'QA_SESSION_CLEANUP=PASS' | tee -a artifacts/qa-session-cleanup.txt
          fi
          exit "$STATUS"
      - name: Upload real production screenshots and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feo-request-costs-production-visual-${{ env.SOURCE_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
