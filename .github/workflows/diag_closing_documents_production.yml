name: DIAG Closing Documents Production

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Execute closing report on production tenant read-only
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE' | tee closing_diag.txt
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          echo "DEPLOYED_SHA=$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          cat > /tmp/closing_report_probe.php <<'PHP'
          <?php
          putenv('PLANEX_ROOT=/home/s/spugovxsim/planexp/public_html/erpv2');
          require '/home/s/spugovxsim/planexp/public_html/erpv2/app/Service/ClosingDocumentService.php';
          require '/home/s/spugovxsim/planexp/public_html/erpv2/scripts/finance_closing_verify_077.php';
          try {
              $rows = \App\Service\ClosingDocumentService::reportRows($pdo, false);
              $problems = \App\Service\ClosingDocumentService::reportRows($pdo, true);
              $options = \App\Service\ClosingDocumentService::counterpartyOptions($pdo);
              echo 'REPORT_ROWS=' . count($rows) . PHP_EOL;
              echo 'PROBLEM_ROWS=' . count($problems) . PHP_EOL;
              echo 'COUNTERPARTY_OPTIONS=' . count($options) . PHP_EOL;
              echo "CLOSING_REPORT_PROBE=PASS\n";
          } catch (Throwable $e) {
              echo 'CLOSING_REPORT_PROBE=FAIL' . PHP_EOL;
              echo 'EXCEPTION_CLASS=' . get_class($e) . PHP_EOL;
              echo 'EXCEPTION_MESSAGE=' . $e->getMessage() . PHP_EOL;
              echo 'EXCEPTION_FILE=' . $e->getFile() . ':' . $e->getLine() . PHP_EOL;
              exit(9);
          }
          PHP
          /usr/bin/php8.5 -l /tmp/closing_report_probe.php
          /usr/bin/php8.5 /tmp/closing_report_probe.php
          rm -f /tmp/closing_report_probe.php
          REMOTE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closing_documents_production_diag
          path: closing_diag.txt
          retention-days: 3
