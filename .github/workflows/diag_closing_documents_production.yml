name: DIAG Closing Documents Production

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Verify live SHA and full closing controller render READ ONLY
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: 78feb21ec78f901753c70c9c614ad28ab93c7b7f
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' /usr/bin/php8.5 -d display_errors=1 -r 'chdir(\"/home/s/spugovxsim/planexp/public_html/erpv2\"); \$marker=trim(file_get_contents(\"/home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt\")); echo \"DEPLOYED_SHA=\".\$marker.PHP_EOL; if(\$marker!==getenv(\"EXPECTED_SHA\")){fwrite(STDERR,\"deploy marker not ready\\n\"); exit(8);} \$config=require \"bootstrap/app.php\"; require \"app/Support/entrypoint_dependencies.php\"; require \"app/Http/Controllers/Company/ClosingDocumentsController.php\"; \$_SESSION=[\"user_id\"=>1,\"role_code\"=>\"company_owner\",\"company_id\"=>25]; \$_SERVER[\"REQUEST_METHOD\"]=\"GET\"; \$_SERVER[\"REQUEST_URI\"]=\"/erpv2/company/finance/closing-documents\"; \$db=new \\App\\Core\\Database(\$config[\"database\"]); ob_start(); (new \\App\\Http\\Controllers\\Company\\ClosingDocumentsController(\$config,\$db))->index(); \$html=ob_get_clean(); if(strpos(\$html,\"Закрывающие документы\")===false){fwrite(STDERR,\"live render marker missing\\n\"); exit(9);} echo \"LIVE_CLOSING_DOCUMENTS_FULL_RENDER=PASS\\n\";'" | tee closing_diag.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closing_documents_production_diag
          path: closing_diag.txt
          retention-days: 3
