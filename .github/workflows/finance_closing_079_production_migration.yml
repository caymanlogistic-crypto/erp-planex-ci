name: Finance Closing 079 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing migration 079 tooling'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_FINANCE_079 to authorize production migration 079'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: finance-closing-079-production-migration
  cancel-in-progress: false
env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
jobs:
  migrate-079:
    if: ${{ inputs.confirm_migration == 'APPLY_FINANCE_079' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Validate exact source and tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          php -l scripts/finance_closing_apply_079.php
          php -l scripts/finance_closing_verify_079.php
          php -l app/Service/ClosingDocumentService.php
          test -s database/migrations-local/079_finance_closing_document_exception_purpose.sql
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Upload isolated migration tooling
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/finance_closing_verify_079.php "$SSH_USER@$SSH_HOST:/tmp/verify079_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/finance_closing_apply_079.php "$SSH_USER@$SSH_HOST:/tmp/apply079_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes database/migrations-local/079_finance_closing_document_exception_purpose.sql "$SSH_USER@$SSH_HOST:/tmp/079_${GITHUB_RUN_ID}.sql"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes app/Service/ClosingDocumentService.php "$SSH_USER@$SSH_HOST:/tmp/ClosingDocumentService079_${GITHUB_RUN_ID}.php"
      - name: Snapshot before migration
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/verify079_${GITHUB_RUN_ID}.php'" | tee finance_closing_079_before.txt
          grep -q 'FINANCE_CLOSING_079_READ_ONLY_OK' finance_closing_079_before.txt
      - name: Apply only migration 079
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' PLANEX_MIGRATION_PATH='/tmp/079_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/apply079_${GITHUB_RUN_ID}.php'" | tee finance_closing_079_migration.txt
          grep -q 'FINANCE_CLOSING_079_OK' finance_closing_079_migration.txt
      - name: Snapshot after and verify invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/verify079_${GITHUB_RUN_ID}.php'" | tee finance_closing_079_after.txt
          python3 - "$(sed -n 's/^FINANCE_CLOSING_079_SNAPSHOT=//p' finance_closing_079_before.txt)" "$(sed -n 's/^FINANCE_CLOSING_079_SNAPSHOT=//p' finance_closing_079_after.txt)" <<'PY'
          import json,sys
          b,a=map(json.loads,sys.argv[1:3])
          for k in ('bank_transactions','documents','finance_employee_movements','closing_document_links','exceptions_rows'):
              if b[k]!=a[k]: raise SystemExit(f'business invariant changed: {k}')
          if a['purpose_column']!=1 or a['composite_index']<2 or a['old_inn_index']!=0 or a['migration_079_applied']!=1:
              raise SystemExit('079 schema missing')
          print('FINANCE_CLOSING_079_INVARIANTS_OK')
          PY
      - name: Candidate service real-tenant read-only preflight after migration
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "RUN_ID='$GITHUB_RUN_ID' PLANEX_ROOT='$LIVE_ROOT' bash -se" <<'REMOTE' | tee finance_closing_079_preflight.txt
          set -euo pipefail
          PROBE="/tmp/closing079_probe_${RUN_ID}.php"
          cat > "$PROBE" <<'PHP'
          <?php
          $root=(string)getenv('PLANEX_ROOT');$runId=(string)getenv('RUN_ID');
          require '/tmp/ClosingDocumentService079_'.$runId.'.php';require $root.'/scripts/finance_closing_verify_077.php';
          $rows=\App\Service\ClosingDocumentService::reportRows($pdo,false);$problems=\App\Service\ClosingDocumentService::problemCount($pdo);
          echo 'CLOSING_079_REAL_TENANT_SERVICE_PREFLIGHT=PASS rows='.count($rows).' problems='.$problems.PHP_EOL;
          PHP
          RUN_ID="$RUN_ID" PLANEX_ROOT="$PLANEX_ROOT" /usr/bin/php8.5 -d display_errors=1 "$PROBE"
          rm -f "$PROBE"
          REMOTE
          grep -q 'CLOSING_079_REAL_TENANT_SERVICE_PREFLIGHT=PASS' finance_closing_079_preflight.txt
      - name: HTTP acceptance
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance_closing_079_${{ inputs.source_sha }}
          path: finance_closing_079_*.txt
          retention-days: 30
      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '/tmp/verify079_${GITHUB_RUN_ID}.php' '/tmp/apply079_${GITHUB_RUN_ID}.php' '/tmp/079_${GITHUB_RUN_ID}.sql' '/tmp/ClosingDocumentService079_${GITHUB_RUN_ID}.php' '/tmp/closing079_probe_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
