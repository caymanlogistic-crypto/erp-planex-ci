name: Waste Runtime Probe Patch TMP

on:
  push:
    branches:
      - chatgpt/waste-trips-runtime-final-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add canonical view formatter bootstrap and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/waste_trip_production_runtime_probe.php')
          s = p.read_text(encoding='utf-8')
          needle = "require_once $root . '/app/Support/http_runtime.php';\n"
          replacement = needle + "require_once $root . '/app/View/components/view_formatters.php';\n"
          if s.count(needle) != 1:
              raise SystemExit('unexpected http_runtime include count')
          if "view_formatters.php" in s:
              raise SystemExit('view_formatters already included')
          p.write_text(s.replace(needle, replacement), encoding='utf-8')
          PY
          php -l tests/waste_trip_production_runtime_probe.php
          git rm .github/workflows/waste_runtime_probe_patch_tmp.yml
          git config user.name planexerp
          git config user.email info@plan-ex.ru
          git add tests/waste_trip_production_runtime_probe.php
          git commit -m 'test: load canonical view formatters in runtime probe'
          git push origin HEAD:chatgpt/waste-trips-runtime-final-20260901
