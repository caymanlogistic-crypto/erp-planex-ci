name: Finance Direct Predeploy Guard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-direct-predeploy-guard
  cancel-in-progress: true

env:
  LIVE_PARENT: /home/s/spugovxsim/planexp/public_html
  LIVE_SUBDIR: erpv2

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: php -l scripts/finance_direct_verify.php
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/finance_direct_pre_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/finance_direct_pre_key" "$HOME/.ssh/known_hosts"
      - name: Upload verifier
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/finance_direct_pre_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/finance_direct_verify.php "$SSH_USER@$SSH_HOST:/tmp/finance_direct_pre_${GITHUB_RUN_ID}.php"
      - name: Resolve standalone verifier PHP
        id: php
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          phpbin="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_direct_pre_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -e
          candidates="$(command -v php 2>/dev/null || true) $(which -a php 2>/dev/null || true)"
          for pattern in /usr/local/bin/php* /usr/local/php*/bin/php /opt/php*/bin/php /opt/*/php*/bin/php /usr/bin/php*; do
            for p in $pattern; do [ -x "$p" ] && candidates="$candidates $p"; done
          done
          for p in $candidates; do
            [ -x "$p" ] || continue
            case "$p" in *php-config*|*phpize*) continue ;; esac
            "$p" -l "/tmp/finance_direct_pre_${GITHUB_RUN_ID}.php" >/dev/null 2>&1 || continue
            "$p" -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);' >/dev/null 2>&1 || continue
            echo "$p"; exit 0
          done
          exit 1
          REMOTE
          )"
          test -n "$phpbin"
          echo "phpbin=$phpbin" >> "$GITHUB_OUTPUT"
      - name: Production read-only snapshot twice
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          PHPBIN: ${{ steps.php.outputs.phpbin }}
        run: |
          set -euo pipefail
          LIVE_ROOT="$LIVE_PARENT/$LIVE_SUBDIR"
          for n in 1 2; do
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_direct_pre_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "PLANEX_ROOT='$LIVE_ROOT' '$PHPBIN' '/tmp/finance_direct_pre_${GITHUB_RUN_ID}.php'" | tee "finance_direct_pre_${n}.txt"
            grep -q 'FINANCE_DIRECT_READ_ONLY_OK' "finance_direct_pre_${n}.txt"
          done
          fp1="$(sed -n 's/^FINANCE_DIRECT_READ_ONLY_FINGERPRINT=//p' finance_direct_pre_1.txt)"
          fp2="$(sed -n 's/^FINANCE_DIRECT_READ_ONLY_FINGERPRINT=//p' finance_direct_pre_2.txt)"
          test -n "$fp1" && test "$fp1" = "$fp2"
          echo "FINANCE_DIRECT_PREDEPLOY_STABLE_FINGERPRINT=$fp1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance_direct_predeploy_${{ github.sha }}
          path: finance_direct_pre_*.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/finance_direct_pre_key" ] && [ -n "$SSH_HOST" ] && [ -n "$SSH_PORT" ] && [ -n "$SSH_USER" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_direct_pre_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/finance_direct_pre_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/finance_direct_pre_key" 2>/dev/null || true
