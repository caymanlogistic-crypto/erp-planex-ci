name: Document Generator Behavioral Regression

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/Service/ContractorService.php'
      - 'app/Service/DocumentGenerator*.php'
      - 'app/Service/DocumentNumberSequenceService.php'
      - 'app/Service/DocumentTemplateService.php'
      - 'app/Service/FeoRequestInteractionService.php'
      - 'app/Http/Controllers/Company/DocumentGeneratorController.php'
      - 'app/View/layouts/main.php'
      - 'app/View/pages/company_document_generator.php'
      - 'app/View/pages/company_document_generator_templates.php'
      - 'app/View/partials/legal_entity_create_form.php'
      - 'database/migrations-local/129_document_generator_auto_number_and_bank_inn.sql'
      - 'scripts/document_generator_apply_129.php'
      - 'scripts/document_generator_verify_129.php'
      - 'scripts/document_generator_template_v2.php'
      - 'scripts/document_generator_template_v3.php'
      - 'resources/document-templates/**'
      - 'tests/document_generator_navigation_test.php'
      - 'tests/document_generator_regression_test.php'
      - 'tests/document_generator_regression_v2_test.php'
      - 'tests/document_generator_regression_v3_test.php'
      - 'tests/document_generator_regression_v4_test.php'
      - 'tests/document_generator_concurrency_test.php'
      - 'tests/document_generator_129_production_migration_contract_test.php'
      - 'tests/document_generator_template_v2_production_contract_test.php'
      - 'tests/document_generator_template_v3_production_contract_test.php'
      - 'tests/document_generator_builtin_seed_resilience_test.php'
      - 'tests/document_generator_deploy_artifact_test.php'
      - '.github/agent_db_migration_request.json'
      - '.github/workflows/document_generator_regression.yml'
      - '.github/workflows/document_generator_google_vehicle_regression.yml'
      - '.github/workflows/document_generator_129_production_migration.yml'
      - '.github/workflows/document_generator_template_v2_production.yml'
      - '.github/workflows/document_generator_template_v3_production.yml'
      - '.github/workflows/document_generator_template_v3_agent_request.yml'
      - '.github/workflows/erpv2_controlled_deploy.yml'
  push:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/Service/ContractorService.php'
      - 'app/Service/DocumentGenerator*.php'
      - 'app/Service/DocumentNumberSequenceService.php'
      - 'app/Service/DocumentTemplateService.php'
      - 'app/Service/FeoRequestInteractionService.php'
      - 'app/Http/Controllers/Company/DocumentGeneratorController.php'
      - 'app/View/layouts/main.php'
      - 'app/View/pages/company_document_generator.php'
      - 'app/View/pages/company_document_generator_templates.php'
      - 'app/View/partials/legal_entity_create_form.php'
      - 'database/migrations-local/129_document_generator_auto_number_and_bank_inn.sql'
      - 'scripts/document_generator_apply_129.php'
      - 'scripts/document_generator_verify_129.php'
      - 'scripts/document_generator_template_v2.php'
      - 'scripts/document_generator_template_v3.php'
      - 'resources/document-templates/**'
      - 'tests/document_generator_navigation_test.php'
      - 'tests/document_generator_regression_test.php'
      - 'tests/document_generator_regression_v2_test.php'
      - 'tests/document_generator_regression_v3_test.php'
      - 'tests/document_generator_regression_v4_test.php'
      - 'tests/document_generator_concurrency_test.php'
      - 'tests/document_generator_129_production_migration_contract_test.php'
      - 'tests/document_generator_template_v2_production_contract_test.php'
      - 'tests/document_generator_template_v3_production_contract_test.php'
      - 'tests/document_generator_builtin_seed_resilience_test.php'
      - 'tests/document_generator_deploy_artifact_test.php'
      - '.github/agent_db_migration_request.json'
      - '.github/workflows/document_generator_regression.yml'
      - '.github/workflows/document_generator_google_vehicle_regression.yml'
      - '.github/workflows/document_generator_129_production_migration.yml'
      - '.github/workflows/document_generator_template_v2_production.yml'
      - '.github/workflows/document_generator_template_v3_production.yml'
      - '.github/workflows/document_generator_template_v3_agent_request.yml'
      - '.github/workflows/erpv2_controlled_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-generator-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure PHP DOCX runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'; then
            sudo apt-get update
            sudo apt-get install -y php-zip
          fi
          php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'
          php -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);'

      - name: Start isolated MySQL test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          GRANT ALL PRIVILEGES ON *.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL

      - name: Preserve canonical template inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/document-generator
          php -r '
            foreach (["contract_vehicle_lease_crew_v1.docx", "contract_vehicle_lease_crew_v2.docx", "waybill_driver_assignment_v1.docx"] as $name) {
              $parts = glob("resources/document-templates/{$name}.b64.part*") ?: [];
              sort($parts, SORT_STRING);
              if ($parts === []) { fwrite(STDERR, "missing parts: {$name}\n"); exit(1); }
              $bytes = "";
              $encodedBytes = 0;
              foreach ($parts as $part) {
                $encoded = preg_replace("/\\s+/", "", (string) file_get_contents($part)) ?? "";
                $encodedBytes += strlen($encoded);
                $decoded = base64_decode($encoded, true);
                if (!is_string($decoded) || $decoded === "") { fwrite(STDERR, "part decode failed: {$part}\n"); exit(1); }
                $bytes .= $decoded;
              }
              if ($bytes === "") { fwrite(STDERR, "empty materialization: {$name}\n"); exit(1); }
              $target = "artifacts/document-generator/input_{$name}";
              file_put_contents($target, $bytes);
              printf("CANONICAL_INPUT=%s encoded=%d bytes=%d sha256=%s\n", $name, $encodedBytes, strlen($bytes), hash("sha256", $bytes));
            }
          '
          test "$(sha256sum artifacts/document-generator/input_contract_vehicle_lease_crew_v1.docx | awk '{print $1}')" = "0e3e7a3ca4d81face23fa070bcabffacc86636d08affdda91faa3c725d4e8adc"
          test "$(sha256sum artifacts/document-generator/input_contract_vehicle_lease_crew_v2.docx | awk '{print $1}')" = "7b79a9ac558af1633b1ed2d6414bef1efe0222c67a543d1b4a8e802e6267a1fa"
          test "$(sha256sum artifacts/document-generator/input_waybill_driver_assignment_v1.docx | awk '{print $1}')" = "5a45e855c6fb47dbc96e6d8b9185d7032b5ca86a9baefbb78fdc6419749f73ab"
          for f in artifacts/document-generator/input_*.docx; do
            echo "ZIP_DIAGNOSTIC=$f"
            unzip -t "$f"
          done

      - name: Run document generator behavioral regression
        env:
          PLANEX_DOCGEN_REQUIRE_RUNTIME: '1'
          PLANEX_DOCGEN_ARTIFACT_DIR: artifacts/document-generator
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tests/document_generator_navigation_test.php \
            tests/document_generator_regression_test.php \
            tests/document_generator_regression_v4_test.php \
            tests/document_generator_concurrency_test.php \
            tests/document_generator_129_production_migration_contract_test.php \
            tests/document_generator_template_v2_production_contract_test.php \
            tests/document_generator_template_v3_production_contract_test.php \
            tests/document_generator_builtin_seed_resilience_test.php \
            tests/document_generator_deploy_artifact_test.php \
            scripts/document_generator_apply_129.php \
            scripts/document_generator_verify_129.php \
            scripts/document_generator_template_v2.php \
            scripts/document_generator_template_v3.php
          do
            php -l "$file"
          done
          php tests/document_generator_navigation_test.php
          php tests/document_generator_regression_test.php | tee /tmp/document-generator-regression.log
          php tests/document_generator_concurrency_test.php | tee /tmp/document-generator-concurrency.log
          php tests/document_generator_129_production_migration_contract_test.php | tee /tmp/document-generator-migration-contract.log
          php tests/document_generator_template_v2_production_contract_test.php | tee /tmp/document-generator-template-v2-contract.log
          php tests/document_generator_template_v3_production_contract_test.php | tee /tmp/document-generator-template-v3-contract.log
          php tests/document_generator_builtin_seed_resilience_test.php | tee /tmp/document-generator-seed.log
          for marker in \
            DOCUMENT_GENERATOR_CANONICAL_WIRING=PASS \
            DOCUMENT_GENERATOR_FEO_PARSER=PASS \
            DOCUMENT_GENERATOR_CANONICAL_TEMPLATE_SHA=PASS \
            DOCUMENT_GENERATOR_DOCX_SECURITY=PASS \
            DOCUMENT_GENERATOR_ACCESS_ISOLATION=PASS \
            DOCUMENT_GENERATOR_DATA_VALIDATION=PASS \
            DOCUMENT_GENERATOR_AUTO_NUMBERING=PASS \
            DOCUMENT_GENERATOR_CONTRACT_DOCX=PASS \
            DOCUMENT_GENERATOR_WAYBILL_DOCX=PASS \
            DOCUMENT_GENERATOR_HISTORY_SNAPSHOT=PASS \
            DOCUMENT_GENERATOR_REGRESSION=PASS
          do
            grep -Fqx "$marker" /tmp/document-generator-regression.log
          done
          grep -Fqx 'DOCUMENT_GENERATOR_CONCURRENCY=PASS' /tmp/document-generator-concurrency.log
          grep -Fqx 'DOCUMENT_GENERATOR_UNIQUE=PASS' /tmp/document-generator-concurrency.log
          grep -Fqx 'DOCUMENT_GENERATOR_129_PRODUCTION_MIGRATION_CONTRACT=PASS' /tmp/document-generator-migration-contract.log
          grep -Fqx 'DOCUMENT_GENERATOR_TEMPLATE_V2_PRODUCTION_CONTRACT=PASS' /tmp/document-generator-template-v2-contract.log
          grep -Fqx 'DOCUMENT_GENERATOR_TEMPLATE_V3_PRODUCTION_CONTRACT=PASS' /tmp/document-generator-template-v3-contract.log
          grep -Fqx 'DOCUMENT_GENERATOR_BUILTIN_SEED_RESILIENCE=PASS' /tmp/document-generator-seed.log

      - name: Verify production-like deploy artifact contract
        shell: bash
        run: |
          set -euo pipefail
          php tests/document_generator_deploy_artifact_test.php | tee /tmp/document-generator-deploy-artifact.log
          grep -Fqx 'DOCUMENT_GENERATOR_DEPLOY_ARTIFACT=PASS' /tmp/document-generator-deploy-artifact.log

      - name: Upload generated DOCX acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-generator-regression-${{ github.sha }}
          path: artifacts/document-generator/
          if-no-files-found: error
          retention-days: 14
