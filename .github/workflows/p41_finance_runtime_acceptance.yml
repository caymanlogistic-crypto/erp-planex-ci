name: P41 Finance Runtime Acceptance
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact deployed 40-character SHA expected on /erpv2'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_P41_MIGRATION to authorize production migration 063'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: ${{ inputs.confirm_migration == 'APPLY_P41_MIGRATION' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Configure SSH and verify deployed SHA
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p41"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p41" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/p41" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$got" = "$SHA"
      - name: Apply tenant migration 063
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          live=/home/s/spugovxsim/planexp/public_html/erpv2
          ssh -p "$PORT" -i "$HOME/.ssh/p41" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "cd '$live' && /usr/bin/php8.5 scripts/p41_apply_finance_matching_migration.php" | tee P41_MIGRATION.txt
          grep -q 'P41_FINANCE_MIGRATION_OK' P41_MIGRATION.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            cred="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/p41" --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Read-only finance Playwright acceptance
        run: node .github/p41/P41_finance_runtime.js | tee P41_RUNTIME.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P41_finance_runtime_${{ inputs.source_sha }}
          path: |
            P41_MIGRATION.txt
            P41_RUNTIME.txt
          if-no-files-found: warn
