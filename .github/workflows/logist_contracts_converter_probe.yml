name: Logist Contracts Converter Temporary Probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  SERVER_ROOT: /home/s/spugovxsim/planexp
  ARCHIVE_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/7.1.8.1/deb/x86_64/LibreOffice_7.1.8.1_Linux_x86-64_deb.tar.gz
  ARCHIVE_SHA256: 4468b0f4edd40e74c086c7d264475136fabc0760ee702cf8ea1662a4ca94201d

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact canonical and prepare pinned converter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')"
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 -o "$RUNNER_TEMP/lo.tar.gz" "$ARCHIVE_URL"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/lo.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lo-pkg" "$RUNNER_TEMP/lo-root"
          tar -xzf "$RUNNER_TEMP/lo.tar.gz" -C "$RUNNER_TEMP/lo-pkg"
          while IFS= read -r -d '' deb; do dpkg-deb -x "$deb" "$RUNNER_TEMP/lo-root"; done < <(find "$RUNNER_TEMP/lo-pkg" -name '*.deb' -print0)
          mkdir -p "$RUNNER_TEMP/lo-deps"
          while read -r digest relative; do
            package="$RUNNER_TEMP/lo-deps/$(basename "$relative")"
            curl -fL --retry 3 --connect-timeout 20 --max-time 120 -o "$package" "https://archive.debian.org/debian/$relative"
            echo "$digest  $package" | sha256sum -c -
            dpkg-deb -x "$package" "$RUNNER_TEMP/lo-root"
          done <<'PACKAGES'
          de3c486b8b9f837bac9a6cc8edf936a3623ffd2bf571ca9856421615591f84f1 pool/main/c/cups/libcups2_1.7.5-11+deb8u2_amd64.deb
          5902cf8264fe4630832bf88704fadf9f48c57cc64a3aee8db03aa123d89492ca pool/main/d/dbus/libdbus-1-3_1.8.22-0+deb8u1_amd64.deb
          3668c1178ac649879338192759e79879e0f5797764b448dcac6aed4b24ef495b pool/main/libx/libxinerama/libxinerama1_1.1.3-1+b1_amd64.deb
          PACKAGES
          test -x "$RUNNER_TEMP/lo-root/opt/libreoffice7.1/program/soffice"
          "$RUNNER_TEMP/lo-root/opt/libreoffice7.1/program/soffice" --version
          python3 - <<'PY'
          import base64,glob,os
          parts=sorted(glob.glob('resources/document-templates/contract_vehicle_lease_crew_v9.docx.b64.part*'))
          if len(parts)<2: raise SystemExit('Built-in contract parts missing')
          with open(os.environ['RUNNER_TEMP']+'/sample.docx','wb') as out:
              for part in parts: out.write(base64.b64decode(b''.join(open(part,'rb').read().split()),validate=True))
          PY
          tar -C "$RUNNER_TEMP/lo-root" -czf "$RUNNER_TEMP/converter-probe.tar.gz" opt/libreoffice7.1 usr/lib/x86_64-linux-gnu
      - name: Configure isolated SSH credentials
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/logist_converter_probe_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/logist_converter_probe_key" "$HOME/.ssh/known_hosts"
      - name: Smoke test inside bounded temporary server directory
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          probe="$SERVER_ROOT/deploy/logist_pdf_probe_${GITHUB_RUN_ID}"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/logist_converter_probe_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "mkdir -m 700 '$probe'"
          echo 'PROBE_STAGE=remote-dir-created'
          cleanup() {
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/logist_converter_probe_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "case '$probe' in '$SERVER_ROOT'/deploy/logist_pdf_probe_[0-9]*) rm -rf -- '$probe' ;; *) exit 1 ;; esac" || true
          }
          trap cleanup EXIT
          scp -P "$SSH_PORT" -i "$HOME/.ssh/logist_converter_probe_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/converter-probe.tar.gz" "$RUNNER_TEMP/sample.docx" "$SSH_USER@$SSH_HOST:$probe/"
          echo 'PROBE_STAGE=uploaded'
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/logist_converter_probe_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PROBE='$probe' bash -se" <<'REMOTE'
          set -euo pipefail
          echo 'PROBE_STAGE=remote-start'
          test "$PROBE" = "/home/s/spugovxsim/planexp/deploy/logist_pdf_probe_${PROBE##*_}"
          tar -xzf "$PROBE/converter-probe.tar.gz" -C "$PROBE"
          echo 'PROBE_STAGE=remote-extracted'
          binary="$PROBE/opt/libreoffice7.1/program/soffice"
          export LD_LIBRARY_PATH="$PROBE/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ls -ld "$PROBE" "$PROBE/opt/libreoffice7.1/program" "$binary"
          readlink -f "$binary" || true
          test -x "$binary"
          echo 'PROBE_STAGE=binary-executable'
          if ! "$binary" --version; then
            ldd "$PROBE/opt/libreoffice7.1/program/soffice.bin" || true
            exit 1
          fi
          echo 'PROBE_STAGE=version-passed'
          mkdir -m 700 "$PROBE/home"
          HOME="$PROBE/home" timeout 120 "$binary" "-env:UserInstallation=file://$PROBE/profile" --headless --convert-to pdf:writer_pdf_Export --outdir "$PROBE" "$PROBE/sample.docx"
          echo 'PROBE_STAGE=converted'
          test -s "$PROBE/sample.pdf"
          test "$(head -c 5 "$PROBE/sample.pdf")" = '%PDF-'
          printf 'LOGIST_CONVERTER_TEMP_PROBE=PASS pdf_bytes=%s\n' "$(stat -c %s "$PROBE/sample.pdf")"
          REMOTE
      - name: Remove task key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/logist_converter_probe_key"
