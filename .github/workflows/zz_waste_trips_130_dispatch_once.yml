name: Waste Trips Scheduler Focused Probe Once

on:
  push:
    branches:
      - ops/waste-trips-130-dispatch-once
    paths:
      - .github/workflows/zz_waste_trips_130_dispatch_once.yml

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Inspect live crone jobs and frequency safely
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'SH'
          set -u
          C=/home/s/spugovxsim/public_html/crone
          echo 'SAFE_SOURCE_BEGIN'
          for f in "$C/Slitex2DB.php" "$C/dumpDB.php"; do
            [ -f "$f" ] || continue
            echo "FILE=$(basename "$f")"
            php -l "$f" 2>&1 || true
            awk '
              BEGIN{IGNORECASE=1}
              /(password|passwd|username|dbname|database[[:space:]]*=|token|secret|api[_-]?key|authorization|host[[:space:]]*=)/ {next}
              /(require|include|curl|file_get_contents|exec|shell_exec|system|passthru|date\(|sleep\(|flock|log|echo|SELECT|INSERT|UPDATE|DELETE|PDO|mysqli|REQUEST_METHOD|REMOTE_ADDR)/ {print NR ":" $0}
            ' "$f" | head -120 || true
          done
          echo 'SAFE_SOURCE_END'
          echo 'LOG_TAIL_BEGIN'
          tail -60 "$C/cron_sync.log" 2>/dev/null | grep -Eiv '(password|passwd|token|secret|authorization|api[_-]?key)' || true
          echo 'LOG_TAIL_END'
          echo 'LOG_MTIME='$(stat -c %Y "$C/cron_sync.log" 2>/dev/null || echo 0)
          echo 'NOW_EPOCH='$(date +%s)
          SH
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
