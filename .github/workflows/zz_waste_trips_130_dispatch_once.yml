name: Waste Trips 130 Dispatch Once

on:
  push:
    branches:
      - ops/waste-trips-130-dispatch-once
    paths:
      - .github/workflows/zz_waste_trips_130_dispatch_once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact canonical Waste Trips 130 migration
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: 6b735d8b0e2deb267ceace592c3174b481c30c4a
          CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
        shell: bash
        run: |
          set -euo pipefail
          canonical="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API_URL/repos/$REPOSITORY/branches/$CANONICAL_BRANCH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$canonical" = "$SOURCE_SHA"
          runs="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API_URL/repos/$REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
          RUNS_JSON="$runs" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RUNS_JSON'])
          required={'ERP PLANEX CI','Waste Trips Regression','ERPv2 Controlled Deploy'}
          ok={k:False for k in required}
          for r in data.get('workflow_runs',[]):
              if r.get('name') in ok and r.get('status')=='completed' and r.get('conclusion')=='success':
                  ok[r['name']]=True
          missing=[k for k,v in ok.items() if not v]
          if missing: raise SystemExit('missing required successful run(s): '+', '.join(missing))
          print('DISPATCH_PRECONDITIONS_OK')
          PY
          python3 - > /tmp/payload.json <<'PY'
          import json
          print(json.dumps({'ref':'chatgpt/production-stabilization-20260802','inputs':{'source_sha':'6b735d8b0e2deb267ceace592c3174b481c30c4a','confirm_migration':'APPLY_WASTE_TRIPS_130'}}))
          PY
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API_URL/repos/$REPOSITORY/actions/workflows/waste_trips_130_production_migration.yml/dispatches" --data-binary @/tmp/payload.json)"
          test "$code" = 204
          echo 'WASTE_TRIPS_130_DISPATCHED=YES'
