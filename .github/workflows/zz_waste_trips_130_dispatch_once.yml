name: Waste Trips Existing Scheduler Probe Once

on:
  push:
    branches:
      - ops/waste-trips-130-dispatch-once
    paths:
      - .github/workflows/zz_waste_trips_130_dispatch_once.yml

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Inspect existing user scheduler contract without secret values
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'SH'
          set -u
          H=/home/s/spugovxsim
          C="$H/public_html/crone"
          echo 'CRONE_FILES_BEGIN'
          find "$C" -maxdepth 3 -type f -printf '%P|%s|%TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null | sort | head -200
          echo 'CRONE_FILES_END'
          echo 'CRONE_DIRS_BEGIN'
          find "$C" -maxdepth 3 -type d -printf '%P\n' 2>/dev/null | sort | head -100
          echo 'CRONE_DIRS_END'
          echo 'CRONE_PHP_META_BEGIN'
          while IFS= read -r f; do
            rel="${f#$H/}"
            printf 'FILE=%s\n' "$rel"
            php -l "$f" 2>&1 | sed 's#'$H'#~#g' || true
            grep -En "(require|include|curl|file_get_contents|exec|shell_exec|system|passthru|cron|schedule|http|https)" "$f" 2>/dev/null \
              | sed -E 's#(["'"'][^"'"']*(password|passwd|secret|token|key)[^"'"']*["'"'])#"***"#Ig' \
              | sed 's#'$H'#~#g' | head -80 || true
          done < <(find "$C" -maxdepth 3 -type f -name '*.php' 2>/dev/null | sort)
          echo 'CRONE_PHP_META_END'
          echo 'CRONE_REFERENCES_BEGIN'
          grep -RIl --exclude='*.log' --exclude='*.sql' --exclude='.env*' --exclude-dir=vendor --exclude-dir=node_modules -E '(public_html/)?crone(/|$)|cron_sync' "$H" 2>/dev/null \
            | sed "s#^$H#~#" | sort | head -100 || true
          echo 'CRONE_REFERENCES_END'
          echo 'LEGACY_CRON_MTIMES_BEGIN'
          find "$H/public_html/fregat/feo/max" -maxdepth 1 -type f -name 'cron_*.php' -printf '%f|%TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null | sort
          echo 'LEGACY_CRON_MTIMES_END'
          SH
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
