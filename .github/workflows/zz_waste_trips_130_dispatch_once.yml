name: Waste Trips Existing Scheduler Contract Probe Once

on:
  push:
    branches:
      - ops/waste-trips-130-dispatch-once
    paths:
      - .github/workflows/zz_waste_trips_130_dispatch_once.yml

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Inspect existing scheduler contract safely
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'SH'
          set -u
          H=/home/s/spugovxsim
          C="$H/public_html/crone"
          echo 'CRONE_JOB_META_BEGIN'
          for f in "$C/Slitex2DB.php" "$C/dumpDB.php"; do
            [ -f "$f" ] || continue
            echo "FILE=$(basename "$f")"
            php -l "$f" 2>&1 || true
            echo 'SAFE_LINES_BEGIN'
            grep -En '(require|include|curl|file_get_contents|exec|shell_exec|system|passthru|date\(|sleep\(|flock|log|echo|SELECT|INSERT|UPDATE|DELETE|PDO|mysqli)' "$f" 2>/dev/null \
              | grep -Eiv '(password|passwd|username|user[[:space:]]*=|host[[:space:]]*=|dbname|database[[:space:]]*=|token|secret|api[_-]?key|authorization)' \
              | head -120 || true
            echo 'SAFE_LINES_END'
          done
          echo 'CRON_LOG_TAIL_BEGIN'
          tail -40 "$C/cron_sync.log" 2>/dev/null | grep -Eiv '(password|passwd|token|secret|authorization|api[_-]?key)' || true
          echo 'CRON_LOG_TAIL_END'
          echo 'CRON_LOG_STAT_BEGIN'
          stat -c 'mtime_epoch=%Y size=%s' "$C/cron_sync.log" 2>/dev/null || true
          echo 'CRON_LOG_STAT_END'
          echo 'JOB_REFERENCES_BEGIN'
          grep -RIl --exclude='*.log' --exclude='*.sql' --exclude='.env*' --exclude-dir=vendor --exclude-dir=node_modules -E 'Slitex2DB\.php|dumpDB\.php|public_html/crone' "$H" 2>/dev/null \
            | sed "s#^$H#~#" | sort | head -100 || true
          echo 'JOB_REFERENCES_END'
          echo 'HIDDEN_SCHEDULER_PATHS_BEGIN'
          find "$H" -maxdepth 4 \( -type d -o -type f \) \( -path '*/.*cron*' -o -path '*/.*schedul*' -o -path '*/cron*' -o -path '*/schedule*' \) 2>/dev/null \
            | sed "s#^$H#~#" | sort | head -120 || true
          echo 'HIDDEN_SCHEDULER_PATHS_END'
          SH
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
