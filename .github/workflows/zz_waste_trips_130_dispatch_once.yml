name: Waste Trips Scheduler Probe Once

on:
  push:
    branches:
      - ops/waste-trips-130-dispatch-once
    paths:
      - .github/workflows/zz_waste_trips_130_dispatch_once.yml

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Inspect available scheduler mechanisms without secrets
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'SH'
          set -u
          HOME_ROOT=/home/s/spugovxsim
          echo "WHOAMI=$(whoami)"
          for cmd in crontab systemctl at php flock curl wget; do
            if command -v "$cmd" >/dev/null 2>&1; then echo "CMD_${cmd}=YES"; else echo "CMD_${cmd}=NO"; fi
          done
          echo "CRONTAB_LIST_BEGIN"
          crontab -l 2>&1 || true
          echo "CRONTAB_LIST_END"
          echo "SCHEDULER_PATHS_BEGIN"
          find "$HOME_ROOT" -maxdepth 5 \( -type d -o -type f \) \
            \( -iname '*cron*' -o -iname '*schedul*' -o -iname '*timer*' -o -iname '*task*' \) \
            2>/dev/null | sed "s#^$HOME_ROOT#~#" | sort | head -200
          echo "SCHEDULER_PATHS_END"
          echo "PHP_JOB_FILES_BEGIN"
          find "$HOME_ROOT" -maxdepth 6 -type f \( -iname 'cron*.php' -o -iname '*cron*.php' -o -iname '*schedule*.php' -o -iname '*worker*.php' \) \
            2>/dev/null | sed "s#^$HOME_ROOT#~#" | sort | head -200
          echo "PHP_JOB_FILES_END"
          echo "USER_SYSTEMD_BEGIN"
          find "$HOME_ROOT/.config/systemd/user" -maxdepth 2 -type f 2>/dev/null | sed "s#^$HOME_ROOT#~#" | sort | head -100 || true
          echo "USER_SYSTEMD_END"
          SH
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key"
