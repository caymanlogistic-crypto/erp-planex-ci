name: Finance Obligations Regression

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/Service/FinanceObligationService.php'
      - 'app/Service/FinanceBankInvoiceSettlementService.php'
      - 'app/Service/FinanceCarrierBankAutoSettlementService.php'
      - 'app/Service/FinanceInvoice*'
      - 'app/Service/FinancePaymentCalendarService.php'
      - 'app/Http/Controllers/Company/InvoiceActions/**'
      - 'app/Http/Controllers/Company/BankFinanceActions/settlementForm.php'
      - 'app/Http/Controllers/Company/BankFinanceActions/settlementSubmit.php'
      - 'app/Http/Controllers/Company/BankFinanceActions/applyRules.php'
      - 'app/Http/Controllers/Company/BankFinanceActions/indexAutoFilters.php'
      - 'app/Http/Routes/company_finance_invoices.php'
      - 'app/Http/Routes/company_bank_finance.php'
      - 'app/View/partials/company_invoice_create_form.php'
      - 'app/View/partials/company_invoice_modal_view.php'
      - 'app/View/partials/company_bank_invoice_settlement_form.php'
      - 'database/migrations-local/071_*'
      - 'database/migrations-local/072_*'
      - 'scripts/p91_*'
      - 'tests/finance_obligations*'
      - 'tests/finance_invoice_prepayment_behavioral_test.php'
      - 'tests/finance_invoice_form_policy_test.php'
      - 'tests/finance_bank_invoice_settlement_*'
      - 'tests/finance_invoice_payment_timeline_behavioral_test.php'
      - '.github/workflows/finance_obligations_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-obligations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_obligations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Architecture regressions
        run: |
          set -euo pipefail
          php tests/finance_obligations_architecture_test.php
          php tests/finance_invoice_form_policy_test.php
          php tests/finance_bank_invoice_settlement_architecture_test.php
      - name: Migration execution
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot erp_obligations_test <<'SQL'
          CREATE TABLE finance_invoices(id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,direction VARCHAR(20) NOT NULL,status VARCHAR(30) NOT NULL DEFAULT 'draft',planned_payment_date DATE NULL,cancelled_at DATETIME NULL,updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP) ENGINE=InnoDB;
          CREATE TABLE finance_invoice_links(id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,invoice_id INT UNSIGNED NOT NULL,linear_route_id INT UNSIGNED NULL,linear_route_payment_id INT UNSIGNED NULL,amount DECIMAL(12,2) NULL,side VARCHAR(20) NULL) ENGINE=InnoDB;
          CREATE TABLE finance_operations(id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY) ENGINE=InnoDB;
          CREATE TABLE finance_operation_allocations(id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,operation_id INT UNSIGNED NOT NULL,invoice_id INT UNSIGNED NULL,linear_route_id INT UNSIGNED NULL,linear_route_payment_id INT UNSIGNED NULL,amount DECIMAL(12,2) NOT NULL,allocation_date DATE NOT NULL,cancelled_at DATETIME NULL) ENGINE=InnoDB;
          INSERT INTO finance_invoices(direction,status,planned_payment_date) VALUES ('OUTGOING','draft','2026-08-20'),('INCOMING','draft','2026-08-21');
          SQL
          mysql -h127.0.0.1 -uroot -proot erp_obligations_test < database/migrations-local/071_finance_obligations.sql
          mysql -h127.0.0.1 -uroot -proot erp_obligations_test < database/migrations-local/072_invoice_obligation_cleanup.sql
      - name: Obligation behavioral regression
        run: php tests/finance_obligations_behavioral_test.php
      - name: Bank invoice settlement behavioral regression
        run: php tests/finance_bank_invoice_settlement_behavioral_test.php
      - name: Invoice payment timeline behavioral regression
        run: php tests/finance_invoice_payment_timeline_behavioral_test.php
      - name: Late invoice inherits direct prepayment behavioral regression
        run: php tests/finance_invoice_prepayment_behavioral_test.php
