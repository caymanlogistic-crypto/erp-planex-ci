name: FEO One-time Hotfix Patcher

on:
  push:
    branches:
      - chatgpt/feo-runtime-hotfix-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact FEO hotfix patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {actual}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'app/Http/Controllers/Company/FeoRequestsController.php',
              "        ob_start();\n        require base_path('app/View/pages/company_feo_requests.php');\n        $content = ob_get_clean();\n        require base_path('app/View/layouts/main.php');",
              "        $config = $this->config;\n        $db = $this->db;\n\n        ob_start();\n        require base_path('app/View/pages/company_feo_requests.php');\n        $content = ob_get_clean();\n        require base_path('app/View/layouts/main.php');"
          )

          p = Path('app/Http/Routes/company_feo_requests.php')
          text = p.read_text(encoding='utf-8')
          marker = "\nif (PHP_SAPI !== 'cli') {"
          if text.count(marker) != 1:
              raise SystemExit('route navigation hack marker mismatch')
          p.write_text(text.split(marker, 1)[0].rstrip() + "\n", encoding='utf-8')

          replace_exact(
              'app/View/layouts/main.php',
              "$bankStatementSettingsActive = str_starts_with($requestPath, '/company/bank-statement-settings');",
              "$bankStatementSettingsActive = str_starts_with($requestPath, '/company/bank-statement-settings');\n$feoRequestsActive = str_starts_with($requestPath, '/company/feo/requests');"
          )
          replace_exact(
              'app/View/layouts/main.php',
              "    '/company/route-executors',\n",
              "    '/company/route-executors',\n    '/company/feo/requests',\n"
          )
          replace_exact(
              'app/View/layouts/main.php',
              "$tripsOpen = ($roleCode !== 'superadmin') && $tripsActive;",
              "$tripsOpen = ($roleCode !== 'superadmin') && $tripsActive;\n$feoRequestsOpen = ($roleCode !== 'superadmin') && $feoRequestsActive;"
          )

          nav_marker = "                <a class=\"nav-item<?= $routeExecutorsActive ? ' is-active' : '' ?>\" href=\"<?= app_url('/company/route-executors') ?>\">"
          feo_lines = [
              "                <div class=\"nav-item is-parent<?= $feoRequestsOpen ? ' is-open is-active' : '' ?>\">",
              "                    <svg class=\"nav-icon\" viewBox=\"0 0 16 16\" fill=\"none\">",
              "                        <path d=\"M3 2.5H10L13 5.5V13.5H3V2.5Z\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>",
              "                        <path d=\"M10 2.5V5.5H13\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>",
              "                        <path d=\"M5.5 8H10.5M5.5 10.5H10.5\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"/>",
              "                    </svg>",
              "                    <span class=\"nav-label\">Заявки ФЭО</span>",
              "                    <svg class=\"nav-chevron\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M5 3L9 7L5 11\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>",
              "                </div>",
              "                <div class=\"nav-sub<?= $feoRequestsOpen ? ' is-open' : '' ?>\">",
              "                    <a class=\"nav-sub-item<?= $feoRequestsActive ? ' is-active' : '' ?>\" href=\"<?= app_url('/company/feo/requests') ?>\">",
              "                        <span>Все заявки</span>",
              "                    </a>",
              "                </div>",
              "",
          ]
          feo_block = "\n".join(feo_lines)
          p = Path('app/View/layouts/main.php')
          text = p.read_text(encoding='utf-8')
          if text.count(nav_marker) != 2:
              raise SystemExit(f'main.php route executor insertion points={text.count(nav_marker)}')
          p.write_text(text.replace(nav_marker, feo_block + nav_marker), encoding='utf-8')

          breadcrumb_marker = "    // /company/finance/bank-accounts and its nested matching-rules workflow\n"
          breadcrumb_lines = [
              "    // /company/feo/requests",
              "    if ($page === 'feo' && ($parts[2] ?? '') === 'requests') {",
              "        $crumbs[] = ['label' => 'Заявки ФЭО', 'url' => null];",
              "        $crumbs[] = ['label' => 'Все заявки', 'url' => app_url('/company/feo/requests')];",
              "        return $crumbs;",
              "    }",
              "",
              "",
          ]
          replace_exact('app/View/components/breadcrumbs.php', breadcrumb_marker, "\n".join(breadcrumb_lines) + breadcrumb_marker)

          test = Path('tests/feo_requests_contract_test.php')
          t = test.read_text(encoding='utf-8')
          old = "foreach (['/company/feo/requests','import/analyze','import/commit','import/rollback','ЗАЯВКИ ФЭО','Все заявки'] as $needle) {\n    $ok('route/menu contains ' . $needle, str_contains($route, $needle));\n}\n"
          new = "foreach (['/company/feo/requests','import/analyze','import/commit','import/rollback'] as $needle) {\n    $ok('route contains ' . $needle, str_contains($route, $needle));\n}\n$ok('route has no output-buffer navigation hack', !str_contains($route, \"ob_start(static function\"));\n\n$layout = file_get_contents($root . '/app/View/layouts/main.php') ?: '';\n$ok('native FEO sidebar parent exists', str_contains($layout, '>Заявки ФЭО</span>'));\n$ok('native FEO sidebar child exists', str_contains($layout, '>Все заявки</span>'));\n$ok('FEO sidebar rendered in both owner and logist blocks', substr_count($layout, \"app_url('/company/feo/requests')\") >= 2);\n$ok('FEO workspace uses wide layout', str_contains($layout, \"'/company/feo/requests'\"));\n\n$controller = file_get_contents($root . '/app/Http/Controllers/Company/FeoRequestsController.php') ?: '';\n$ok('controller passes config to layout scope', str_contains($controller, '$config = $this->config;'));\n$ok('controller passes db to layout scope', str_contains($controller, '$db = $this->db;'));\n"
          if t.count(old) != 1:
              raise SystemExit('contract route assertion block mismatch')
          test.write_text(t.replace(old, new), encoding='utf-8')

          Path('.github/workflows/feo_runtime_diagnostic_tmp.yml').unlink()
          PY
      - name: Validate hotfix before commit
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/Company/FeoRequestsController.php
          php -l app/Http/Routes/company_feo_requests.php
          php -l app/View/layouts/main.php
          php -l app/View/components/breadcrumbs.php
          php tests/feo_requests_contract_test.php
          git diff --check
          test ! -e .github/workflows/feo_runtime_diagnostic_tmp.yml
      - name: Commit one-time patch
        run: |
          set -euo pipefail
          git config user.name planexerp
          git config user.email info@plan-ex.ru
          git add app/Http/Controllers/Company/FeoRequestsController.php app/Http/Routes/company_feo_requests.php app/View/layouts/main.php app/View/components/breadcrumbs.php tests/feo_requests_contract_test.php .github/workflows/feo_runtime_diagnostic_tmp.yml
          git commit -m 'CRITICAL: fix FEO runtime render and native navigation'
          git push origin HEAD:chatgpt/feo-runtime-hotfix-20260825
