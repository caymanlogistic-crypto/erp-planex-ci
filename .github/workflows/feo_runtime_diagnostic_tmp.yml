name: FEO Runtime Diagnostic Temporary

on:
  push:
    branches:
      - chatgpt/feo-runtime-hotfix-20260825

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Build read-only render probe
        run: |
          cat > /tmp/feo_render_probe.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = '/home/s/spugovxsim/planexp/public_html/erpv2';
          chdir($root);
          $_SERVER['REQUEST_URI'] = '/erpv2/company/feo/requests';
          $_SERVER['REQUEST_METHOD'] = 'GET';
          $_SERVER['HTTPS'] = 'on';
          $_SESSION = [
              'user_id' => 999999999,
              'role_code' => 'company_owner',
              'user_name' => 'FEO Runtime Probe',
          ];
          $config = require $root . '/bootstrap/app.php';
          require_once $root . '/app/Support/entrypoint_dependencies.php';
          require_once $root . '/app/Service/FeoXlsxParser.php';
          require_once $root . '/app/Service/FeoRequestService.php';
          require_once $root . '/app/Http/Controllers/Company/FeoRequestsController.php';
          $db = new \App\Core\Database($config['database']);
          $company = $db->fetch("SELECT id,name,status,db_identifier FROM companies WHERE status='active' AND db_identifier IS NOT NULL AND db_identifier<>'' ORDER BY id LIMIT 1");
          if (!$company) { throw new RuntimeException('No active tenant company for probe'); }
          $_SESSION['company_id'] = (int)$company['id'];
          $_SESSION['company_name'] = (string)$company['name'];
          echo 'PROBE_COMPANY_ID=' . (int)$company['id'] . PHP_EOL;
          echo 'PROBE_COMPANY_NAME=' . (string)$company['name'] . PHP_EOL;
          $controller = new \App\Http\Controllers\Company\FeoRequestsController($config, $db);
          ob_start();
          try {
              $controller->index();
              $html = ob_get_clean();
              echo 'FEO_RENDER_OK=YES' . PHP_EOL;
              echo 'FEO_RENDER_BYTES=' . strlen((string)$html) . PHP_EOL;
              echo 'FEO_RENDER_HAS_TITLE=' . (str_contains((string)$html, 'Все заявки ФЭО') ? 'YES' : 'NO') . PHP_EOL;
          } catch (Throwable $e) {
              while (ob_get_level() > 0) { @ob_end_clean(); }
              echo 'FEO_RENDER_OK=NO' . PHP_EOL;
              echo 'ERROR_CLASS=' . get_class($e) . PHP_EOL;
              echo 'ERROR_MESSAGE=' . $e->getMessage() . PHP_EOL;
              echo 'ERROR_FILE=' . $e->getFile() . ':' . $e->getLine() . PHP_EOL;
              echo $e->getTraceAsString() . PHP_EOL;
              exit(2);
          }
          PHP
      - name: Run production diagnostics
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/feo_render_probe.php "$SSH_USER@$SSH_HOST:/tmp/feo_render_probe_${GITHUB_RUN_ID}.php"
          {
            echo '=== marker ==='
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt"
            echo '=== php modules ==='
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/usr/bin/php8.5 -m | grep -Ei 'zip|simplexml|xml|pdo|mysql|mbstring'"
            echo '=== render probe ==='
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/usr/bin/php8.5 '/tmp/feo_render_probe_${GITHUB_RUN_ID}.php'" || true
          } | tee feo_diag.txt
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '/tmp/feo_render_probe_${GITHUB_RUN_ID}.php'" || true
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: feo-runtime-diagnostic
          path: feo_diag.txt
          retention-days: 1
      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success; [ "$JOB_STATUS" = success ] || state=failure
          desc='FEO production render probe captured'
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"feo/runtime-diagnostic\",\"description\":\"$desc\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null
