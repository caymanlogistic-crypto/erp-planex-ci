name: ERPv2 Controlled Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character commit SHA to deploy to /erpv2'
        required: true
        type: string
      confirm_deploy:
        description: 'Type DEPLOY_ERPV2 to authorize the deploy'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: erpv2-controlled-deploy
  cancel-in-progress: false

env:
  TARGET: /erpv2
  SERVER_ROOT: /home/s/spugovxsim/planexp
  RESULT_DIR: erpv2_controlled_deploy_result

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY_ERPV2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout workflow source only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preserve read-only control helper
        shell: bash
        run: |
          set -euo pipefail
          cp .github/p21/P21_readonly_db_fingerprint.php /tmp/P21_readonly_db_fingerprint.php
          php -l /tmp/P21_readonly_db_fingerprint.php >/dev/null

      - name: Resolve and validate exact source SHA
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          test "$CONFIRM_DEPLOY" = 'DEPLOY_ERPV2'
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'SOURCE_SHA=%s\nTARGET=%s\nDEPLOY_MODE=manual_exact_sha\n' "$SOURCE_SHA" "$TARGET"
          printf 'source_sha=%s\ndeploy_mode=manual_exact_sha\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish deploy pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"erpv2/deploy\",\"description\":\"ERPv2 controlled deploy in progress\"}" >/dev/null

      - name: Build artifact strictly from source SHA
        id: artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          artifact="erpv2_${SOURCE_SHA}.tar.gz"
          git archive --format=tar --output=erpv2_source.tar "$SOURCE_SHA" -- app bootstrap config database public scripts tools tests
          gzip -n erpv2_source.tar
          mv erpv2_source.tar.gz "$artifact"
          tar -tzf "$artifact" > erpv2_artifact_listing.txt
          if grep -E '(^|/)(\.git|\.env([^/]*)?|storage|uploads|logs|tmp|screenshots|node_modules|vendor)(/|$)|(^|/)(cookies?|reports)(/|$)' erpv2_artifact_listing.txt; then
            echo 'Forbidden runtime or secret path in deployment artifact.' >&2
            exit 1
          fi
          sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          printf 'artifact=%s\nsha256=%s\n' "$artifact" "$sha256" >> "$GITHUB_OUTPUT"

      - name: Configure isolated SSH credentials
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/erpv2_controlled_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/erpv2_controlled_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Snapshot server state and create backup
        id: before
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/erpv2_controlled_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            /tmp/P21_readonly_db_fingerprint.php "$SSH_USER@$SSH_HOST:/tmp/P21_readonly_db_fingerprint_${GITHUB_RUN_ID}.php"
          out="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_controlled_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          OLD="$ROOT/public_html/erp"
          DEPLOY="$ROOT/deploy"
          BACKUPS="$ROOT/deploy_backups"
          test -x "$DEPLOY/P07_deploy_erpv2.sh"
          current="$(cat "$DEPLOY/P07_erpv2_deployed_commit.txt")"
          oldfp="$(cd "$OLD" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          dbfp="$(php "/tmp/P21_readonly_db_fingerprint_${GITHUB_RUN_ID}.php")"
          envfp="$(sha256sum "$LIVE/.env" | awk '{print $1}')"
          runtime_dirs=''
          for d in storage uploads logs; do
            if [ -d "$LIVE/$d" ]; then runtime_dirs="${runtime_dirs}${d},"; fi
          done
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$BACKUPS/P21_${ts}_${current}"
          mkdir -p "$backup"
          tar -C "$LIVE" -czf "$backup/erpv2_current.tar.gz" .
          test -s "$backup/erpv2_current.tar.gz"
          printf 'current=%s\noldfp=%s\ndbfp=%s\nenvfp=%s\nruntime_dirs=%s\nbackup=%s\n' "$current" "$oldfp" "$dbfp" "$envfp" "$runtime_dirs" "$backup"
          REMOTE
          )"
          printf '%s\n' "$out"
          while IFS='=' read -r key value; do
            case "$key" in current|oldfp|dbfp|envfp|runtime_dirs|backup) printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT" ;; esac
          done <<< "$out"
          printf 'CURRENT_SERVER_SHA=%s\n' "$(printf '%s\n' "$out" | sed -n 's/^current=//p')"
          printf 'TARGET=%s\n' "$TARGET"

      - name: Upload exact artifact and deploy through P07 engine
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha256 }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          remote="$SERVER_ROOT/deploy/P21_artifact_${SOURCE_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/erpv2_controlled_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_controlled_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "$SERVER_ROOT/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$SOURCE_SHA'"
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_controlled_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$SERVER_ROOT/deploy/P07_erpv2_deployed_commit.txt'")"
          test "$marker" = "$SOURCE_SHA"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_controlled_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$remote'"

      - name: Verify marker HTTP DB old ERP and runtime preservation
        id: after
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          OLD_FP_BEFORE: ${{ steps.before.outputs.oldfp }}
          DB_FP_BEFORE: ${{ steps.before.outputs.dbfp }}
          ENV_FP_BEFORE: ${{ steps.before.outputs.envfp }}
          RUNTIME_DIRS_BEFORE: ${{ steps.before.outputs.runtime_dirs }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          out="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_controlled_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' SOURCE_SHA='$SOURCE_SHA' RUNTIME_DIRS_BEFORE='$RUNTIME_DIRS_BEFORE' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          OLD="$ROOT/public_html/erp"
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          oldfp="$(cd "$OLD" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          dbfp="$(php "/tmp/P21_readonly_db_fingerprint_${GITHUB_RUN_ID}.php")"
          envfp="$(sha256sum "$LIVE/.env" | awk '{print $1}')"
          test "$marker" = "$SOURCE_SHA"
          IFS=',' read -r -a dirs <<< "$RUNTIME_DIRS_BEFORE"
          for d in "${dirs[@]}"; do
            [ -z "$d" ] || test -d "$LIVE/$d"
          done
          printf 'marker=%s\noldfp=%s\ndbfp=%s\nenvfp=%s\n' "$marker" "$oldfp" "$dbfp" "$envfp"
          REMOTE
          )"
          printf '%s\n' "$out"
          marker="$(printf '%s\n' "$out" | sed -n 's/^marker=//p')"
          oldfp="$(printf '%s\n' "$out" | sed -n 's/^oldfp=//p')"
          dbfp="$(printf '%s\n' "$out" | sed -n 's/^dbfp=//p')"
          envfp="$(printf '%s\n' "$out" | sed -n 's/^envfp=//p')"
          test "$marker" = "$SOURCE_SHA"
          test "$oldfp" = "$OLD_FP_BEFORE"
          test "$dbfp" = "$DB_FP_BEFORE"
          test "$envfp" = "$ENV_FP_BEFORE"
          http="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          test "$http" = 200
          printf 'marker=%s\noldfp=%s\ndbfp=%s\nenvfp=%s\nhttp=%s\n' "$marker" "$oldfp" "$dbfp" "$envfp" "$http" >> "$GITHUB_OUTPUT"

      - name: Write controlled deploy evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          DEPLOY_MODE: ${{ steps.source.outputs.deploy_mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          cat > "$RESULT_DIR/ERPV2_CONTROLLED_DEPLOY.json" <<EOF
          {
            "workflow": "ERPv2 Controlled Deploy",
            "deploy_mode": "$DEPLOY_MODE",
            "source_sha": "$SOURCE_SHA",
            "target": "/erpv2",
            "previous_server_sha": "${{ steps.before.outputs.current }}",
            "final_server_sha": "${{ steps.after.outputs.marker }}",
            "backup": "${{ steps.before.outputs.backup }}",
            "artifact_sha256": "${{ steps.artifact.outputs.sha256 }}",
            "http_login": "${{ steps.after.outputs.http }}",
            "database_fingerprint_before": "${{ steps.before.outputs.dbfp }}",
            "database_fingerprint_after": "${{ steps.after.outputs.dbfp }}",
            "old_erp_fingerprint_before": "${{ steps.before.outputs.oldfp }}",
            "old_erp_fingerprint_after": "${{ steps.after.outputs.oldfp }}",
            "env_fingerprint_before": "${{ steps.before.outputs.envfp }}",
            "env_fingerprint_after": "${{ steps.after.outputs.envfp }}",
            "runtime_dirs_preserved": "${{ steps.before.outputs.runtime_dirs }}",
            "migrations_run": false
          }
          EOF
          cp erpv2_artifact_listing.txt "$RESULT_DIR/" 2>/dev/null || true

      - name: Upload controlled deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erpv2_controlled_deploy_${{ steps.source.outputs.source_sha }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish final deploy status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='ERPv2 controlled deploy failed'
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='ERPv2 controlled deploy verified'
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"erpv2/deploy\",\"description\":\"$description\"}" >/dev/null

      - name: Cleanup temporary SSH material
        if: always()
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/erpv2_controlled_deploy_key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_controlled_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/P21_readonly_db_fingerprint_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/erpv2_controlled_deploy_key" /tmp/P21_readonly_db_fingerprint.php 2>/dev/null || true
