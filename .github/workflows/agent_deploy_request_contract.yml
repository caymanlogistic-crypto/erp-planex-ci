name: Agent Deploy Request Contract

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/erpv2_agent_deploy_request.yml'
      - '.github/workflows/erpv2_controlled_deploy.yml'
      - '.github/workflows/erpv2_web_runtime_diagnostic.yml'
      - '.github/workflows/erpv2_access_compare.yml'
      - '.github/workflows/agent_deploy_request_contract.yml'
      - '.github/p07/**'
      - 'tests/agent_deploy_request_contract_test.php'
      - 'tests/p07_deploy_engine_contract_test.php'
      - 'tests/erpv2_web_runtime_diagnostic_contract_test.php'
      - 'tests/erpv2_access_compare_contract_test.php'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Canonical P07 bash syntax
        shell: bash
        env:
          P07_SUFFIX: deploy_erpv2.sh
        run: |
          set -euo pipefail
          p07=".github/p07/P07_${P07_SUFFIX}"
          bash -n "$p07"
      - run: php -l tests/agent_deploy_request_contract_test.php
      - run: php tests/agent_deploy_request_contract_test.php
      - run: php -l tests/p07_deploy_engine_contract_test.php
      - run: php tests/p07_deploy_engine_contract_test.php
      - run: php -l tests/erpv2_web_runtime_diagnostic_contract_test.php
      - run: php tests/erpv2_web_runtime_diagnostic_contract_test.php
      - run: php -l tests/erpv2_access_compare_contract_test.php
      - run: php tests/erpv2_access_compare_contract_test.php
