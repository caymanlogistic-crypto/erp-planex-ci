name: Production Calendar Regression

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/Service/ProductionCalendarService.php'
      - 'app/Http/Controllers/Company/ProductionCalendarController.php'
      - 'app/Http/Routes/company_production_calendar.php'
      - 'app/View/pages/company_production_calendar.php'
      - 'app/Support/runtime_ui_hotfixes.php'
      - 'app/Support/entrypoint_dependencies.php'
      - 'public/index.php'
      - 'scripts/p90_*'
      - 'tests/production_calendar_*'
      - '.github/workflows/production_calendar_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-calendar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_production_calendar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Architecture regression
        run: php tests/production_calendar_architecture_test.php
      - name: Behavioral regression
        env:
          PRODUCTION_CALENDAR_DB_HOST: 127.0.0.1
          PRODUCTION_CALENDAR_DB_PORT: 3306
          PRODUCTION_CALENDAR_DB_NAME: erp_production_calendar_test
          PRODUCTION_CALENDAR_DB_USER: root
          PRODUCTION_CALENDAR_DB_PASSWORD: root
        run: php tests/production_calendar_behavioral_test.php
