name: ERPv2 Agent CI Request

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

concurrency:
  group: erpv2-agent-ci-request
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  TARGET_WORKFLOW: ci.yml

jobs:
  authorize-and-dispatch:
    if: >-
      github.event.issue.pull_request != null &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/agent-ci ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Parse exact request
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          requested_sha="$(COMMENT_BODY="$COMMENT_BODY" python3 - <<'PY'
          import os,re
          text=os.environ['COMMENT_BODY'].strip()
          m=re.fullmatch(r'/agent-ci ([0-9a-f]{40})', text)
          if not m:
              raise SystemExit('Expected exact /agent-ci <40-char lowercase SHA>')
          print(m.group(1))
          PY
          )"
          printf 'requested_sha=%s\n' "$requested_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_BRANCH }}
          fetch-depth: 1

      - name: Validate request bridge contract
        run: php tests/agent_ci_request_contract_test.php

      - name: Validate exact canonical HEAD
        env:
          REQUESTED_SHA: ${{ steps.request.outputs.requested_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Reconfirm canonical and dispatch main CI
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ steps.request.outputs.requested_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}"
          test "$REQUESTED_SHA" = "$(git rev-parse "refs/remotes/origin/${CANONICAL_BRANCH}")"
          payload="$(CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':os.environ['CANONICAL_BRANCH']}))
          PY
          )"
          code="$(curl -fsS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -d "$payload")"
          test "$code" = 204
          printf 'AGENT_CI_DISPATCHED=YES\nSOURCE_SHA=%s\nTARGET_WORKFLOW=%s\n' "$REQUESTED_SHA" "$TARGET_WORKFLOW"
