name: Trip Documents 140 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing Trip documents migration 140 tooling'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_DOCUMENT_COLLECTION_140 to authorize tenant migration 140'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: erpv2-controlled-deploy
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802

jobs:
  migrate-140:
    if: ${{ inputs.confirm_migration == 'APPLY_DOCUMENT_COLLECTION_140' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate exact canonical source and tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')" = "$SOURCE_SHA"
          php -l scripts/trip_document_migration_140.php
          php -l tests/trip_document_140_production_migration_contract_test.php
          php tests/trip_document_140_production_migration_contract_test.php
          php tests/agent_db_migration_request_contract_test.php
          test -s database/migrations-local/140_create_trip_document_collection.sql

      - name: Require successful exact canonical ERP PLANEX CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" > /tmp/ci-runs.json
          SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json,os
          rows=[r for r in json.load(open('/tmp/ci-runs.json')).get('workflow_runs',[]) if r.get('head_sha')==os.environ['SOURCE_SHA'] and r.get('event')=='push']
          if not rows: raise SystemExit('exact canonical ERP PLANEX CI run missing')
          run=max(rows,key=lambda r:r.get('run_number',0))
          if run.get('status')!='completed' or run.get('conclusion')!='success': raise SystemExit(f"exact canonical ERP PLANEX CI not successful: {run.get('id')} {run.get('status')} {run.get('conclusion')}")
          print(f"DOCUMENT_140_CANONICAL_CI_PASS run={run.get('id')}")
          PY

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - > /tmp/payload.json <<'PY'
          import json
          print(json.dumps({'state':'pending','context':'erpv2/migration140','description':'Trip documents tenant migration 140 in progress'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Configure isolated SSH transport
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/document_140_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/document_140_key" "$HOME/.ssh/known_hosts"
          SSH_CONTROL_DIR="/tmp/document140_mux_${GITHUB_RUN_ID}"
          install -d -m 700 "$SSH_CONTROL_DIR"
          SSH_CONTROL_PATH="$SSH_CONTROL_DIR/%C"
          test "${#SSH_CONTROL_PATH}" -lt 90
          printf 'SSH_CONTROL_DIR=%s\nSSH_CONTROL_PATH=%s\n' "$SSH_CONTROL_DIR" "$SSH_CONTROL_PATH" >> "$GITHUB_ENV"

      - name: Require deployed marker as successful canonical ancestor and upload tooling
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/document_140_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          SCP=(scp -P "$SSH_PORT" -i "$HOME/.ssh/document_140_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          DEPLOYED="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          [[ "$DEPLOYED" =~ ^[0-9a-f]{40}$ ]]
          # The guarded migration also permits already deployed exact canonical code.
          git merge-base --is-ancestor "$DEPLOYED" "$SOURCE_SHA"
          test "$DEPLOYED" = "$SOURCE_SHA" # Scheduler must execute this reviewed worker, never an older release.
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API_URL/repos/$REPOSITORY/commits/$DEPLOYED/status" > /tmp/deployed-status.json
          DEPLOYED="$DEPLOYED" python3 - <<'PY'
          import json,os
          rows=[s for s in json.load(open('/tmp/deployed-status.json')).get('statuses',[]) if s.get('context')=='erpv2/deploy']
          if not rows or rows[0].get('state')!='success': raise SystemExit('deployed marker lacks successful erpv2/deploy status')
          print('DOCUMENT_140_DEPLOYED_ANCESTOR_PASS='+os.environ['DEPLOYED'])
          PY
          printf 'DEPLOYED_BEFORE=%s\n' "$DEPLOYED" >> "$GITHUB_ENV"
          "${SCP[@]}" scripts/trip_document_migration_140.php "$SSH_USER@$SSH_HOST:/tmp/trip_document140_${GITHUB_RUN_ID}.php"
          "${SCP[@]}" database/migrations-local/140_create_trip_document_collection.sql "$SSH_USER@$SSH_HOST:/tmp/document_140_${GITHUB_RUN_ID}.sql"

      - name: Snapshot BEFORE
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/document_140_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TENANT_MIGRATION_PATH='/tmp/document_140_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/trip_document140_${GITHUB_RUN_ID}.php'" | tee document_140_before.txt
          grep -q '^DOCUMENT_140_READ_ONLY_OK$' document_140_before.txt
          python3 - <<'PY'
          import json,re
          m=re.search(r'^DOCUMENT_140_SNAPSHOT=(.+)$',open('document_140_before.txt').read(),re.M)
          if not m or not json.loads(m.group(1))['tenants']: raise SystemExit('Document 140 before snapshot missing')
          print('DOCUMENT_140_BEFORE_PASS=YES')
          PY

      - name: Apply tenant migration 140
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/document_140_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TENANT_MIGRATION_PATH='/tmp/document_140_${GITHUB_RUN_ID}.sql' DOCUMENT_COLLECTION_MIGRATION_MODE=apply DOCUMENT_COLLECTION_MIGRATION_CONFIRM=APPLY_DOCUMENT_COLLECTION_140 /usr/bin/php8.5 '/tmp/trip_document140_${GITHUB_RUN_ID}.php'" | tee document_140_apply.txt
          grep -q '^DOCUMENT_140_APPLY_OK$' document_140_apply.txt

      - name: Snapshot AFTER and verify invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/document_140_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TENANT_MIGRATION_PATH='/tmp/document_140_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/trip_document140_${GITHUB_RUN_ID}.php'" | tee document_140_after.txt
          grep -q '^DOCUMENT_140_READ_ONLY_OK$' document_140_after.txt
          python3 - <<'PY'
          import hashlib,json,re
          def snap(path):
              m=re.search(r'^DOCUMENT_140_SNAPSHOT=(.+)$',open(path).read(),re.M)
              if not m: raise SystemExit(path+' snapshot missing')
              return {t['company_id']:t for t in json.loads(m.group(1))['tenants']}
          before,after=snap('document_140_before.txt'),snap('document_140_after.txt')
          expected=hashlib.sha256(open('database/migrations-local/140_create_trip_document_collection.sql','rb').read()).hexdigest()
          if set(before)!=set(after): raise SystemExit('Tenant set changed')
          for cid,row in after.items():
              if row['trip_sha256']!=before[cid]['trip_sha256'] or row['trip_rows']!=before[cid]['trip_rows']: raise SystemExit('Trip business data changed')
              if row['migration_140']!=1 or row['checksum']!=expected: raise SystemExit('Migration journal mismatch')
              for table,detail in row['tables'].items():
                  if not detail['present']: raise SystemExit('Missing event table')
                  if detail['rows']!=before[cid]['tables'][table]['rows']: raise SystemExit('Migration unexpectedly wrote event data')
          print('DOCUMENT_140_INVARIANTS_PASS=YES')
          print('DOCUMENT_140_BUSINESS_DATA_MUTATION=0')
          PY

      - name: HTTP acceptance before deploy and marker unchanged
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
          CURRENT="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/document_140_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$CURRENT" = "$DEPLOYED_BEFORE"
          echo 'DOCUMENT_140_PREDEPLOY_HTTP_PASS=YES'
          echo 'DOCUMENT_140_DEPLOY_MARKER_UNCHANGED=YES'

      - name: Verify hosting-panel document worker scheduler
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/document_140_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "cd '$LIVE_ROOT' && APP_PUBLIC_URL=https://plan-ex.ru/erpv2 /usr/bin/php8.5 scripts/trip_document_worker.php --company=25 --check" | tee document_140_scheduler.txt
          grep -Fqx 'DOCUMENT_WORKER_READY=YES' document_140_scheduler.txt
          # SpaceWeb owns cron in its hosting panel; SSH crontab cannot access its spool.
          # This gate observes a NEW scheduler tick and never runs the worker itself.
          echo 'DOCUMENT_SCHEDULER_MANAGED_BY=hosting-panel' | tee -a document_140_scheduler.txt
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "set -e; test -d '$LIVE_ROOT/logs'; started=\$(date +%s); for attempt in \$(seq 1 18); do stamp=\$(stat -c %Y '$LIVE_ROOT/storage/runtime/trip_documents_25.json' 2>/dev/null || echo 0); if [ \"\$stamp\" -gt \"\$started\" ]; then echo DOCUMENT_SCHEDULER_TICK=PASS; exit 0; fi; sleep 5; done; echo DOCUMENT_SCHEDULER_TICK=FAIL; echo 'Configure the one-minute trip_document_worker.php --company=25 task in the hosting panel'; exit 1" | tee -a document_140_scheduler.txt
          grep -Fqx 'DOCUMENT_SCHEDULER_TICK=PASS' document_140_scheduler.txt

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip_document_140_production_migration_${{ inputs.source_sha }}
          path: |
            document_140_before.txt
            document_140_apply.txt
            document_140_after.txt
            document_140_scheduler.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish final migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Trip documents migration 140 verified'; else state=failure; desc='Trip documents migration 140 failed'; fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/migration140','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          if [ -f "$HOME/.ssh/document_140_key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/document_140_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/trip_document140_${GITHUB_RUN_ID}.php' '/tmp/document_140_${GITHUB_RUN_ID}.sql'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/document_140_key"
          rm -rf "${SSH_CONTROL_DIR:-}"
