name: FEO Map Runtime Diagnostic

on:
  push:
    branches:
      - agent/feo-map-runtime-diagnostic-20260830

permissions:
  contents: read

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Inspect P07 runtime path contract without exposing env values
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/planexp"
          ERP="$ROOT/public_html/erpv2"
          ENV_FILE="$ERP/.env"
          DEPLOY="$ROOT/deploy"
          if [ -L "$ENV_FILE" ]; then
            echo 'ERPV2_ENV_IS_SYMLINK=1'
            printf 'ERPV2_ENV_LINK_TARGET=%s\n' "$(readlink "$ENV_FILE")"
          else
            echo 'ERPV2_ENV_IS_SYMLINK=0'
          fi
          if [ -f "$ENV_FILE" ] && grep -Eq '^YANDEX_MAPS_API_KEY=.+$' "$ENV_FILE"; then echo 'PRODUCTION_YANDEX_MAPS_API_KEY_PRESENT=1'; else echo 'PRODUCTION_YANDEX_MAPS_API_KEY_PRESENT=0'; fi
          printf 'DEPLOY_MARKER=%s\n' "$(cat "$DEPLOY/P07_erpv2_deployed_commit.txt" 2>/dev/null || true)"
          echo 'P07_SCRIPT_BEGIN'
          sed -n '1,145p' "$DEPLOY/P07_deploy_erpv2.sh"
          echo 'P07_SCRIPT_END'
          echo 'RUNTIME_CANDIDATES_BEGIN'
          find "$ROOT" -maxdepth 3 -type f -name '.env' -printf '%p\n' 2>/dev/null | sort
          find "$ROOT" -maxdepth 3 -type l -name '.env' -printf '%p -> %l\n' 2>/dev/null | sort
          echo 'RUNTIME_CANDIDATES_END'
          REMOTE
      - name: Cleanup local SSH material
        if: always()
        run: rm -f "$HOME/.ssh/key"
