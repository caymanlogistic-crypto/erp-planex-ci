name: FEO Map Runtime Diagnostic

on:
  push:
    branches:
      - agent/feo-map-runtime-diagnostic-20260830

permissions:
  contents: read

jobs:
  runtime-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Recover prior env symlink target from immutable backup metadata
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/planexp"
          ERP="$ROOT/public_html/erpv2"
          echo 'CURRENT_RUNTIME_LINKS_BEGIN'
          for p in .env storage tmp logs; do
            if [ -L "$ERP/$p" ]; then printf '%s -> %s\n' "$p" "$(readlink "$ERP/$p")"; else printf '%s -> NOT_SYMLINK\n' "$p"; fi
          done
          echo 'CURRENT_RUNTIME_LINKS_END'
          echo 'P21_BACKUPS_BEGIN'
          find "$ROOT/deploy_backups" -maxdepth 2 -type f -name 'erpv2_current.tar.gz' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -8 | cut -d' ' -f2-
          echo 'P21_BACKUPS_END'
          echo 'ENV_LINK_HISTORY_BEGIN'
          find "$ROOT/deploy_backups" -maxdepth 2 -type f -name 'erpv2_current.tar.gz' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -8 | cut -d' ' -f2- | while IFS= read -r arc; do
            printf 'ARCHIVE=%s\n' "$arc"
            tar -tvzf "$arc" ./.env 2>/dev/null || true
          done
          echo 'ENV_LINK_HISTORY_END'
          REMOTE
      - name: Cleanup local SSH material
        if: always()
        run: rm -f "$HOME/.ssh/key"
