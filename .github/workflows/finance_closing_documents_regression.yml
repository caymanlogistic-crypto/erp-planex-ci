name: Finance Closing Documents Regression

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/Service/ClosingDocumentService.php'
      - 'app/Service/NavigationCounterService.php'
      - 'app/Http/Controllers/Company/ClosingDocumentsController.php'
      - 'app/Http/Routes/company_bank_finance.php'
      - 'app/View/pages/company_finance_closing_documents.php'
      - 'app/View/pages/company_finance_closing_document_modal.php'
      - 'app/View/pages/company_finance_closing_document_exceptions.php'
      - 'app/View/layouts/main.php'
      - 'app/Support/entrypoint_dependencies.php'
      - 'database/migrations-local/077_finance_closing_documents.sql'
      - 'database/migrations-local/078_finance_closing_document_exceptions.sql'
      - 'tests/finance_closing_documents_contract_test.php'
      - 'tests/closing_documents_runtime_dependency_test.php'
      - '.github/workflows/finance_closing_documents_regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closing-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l app/Service/ClosingDocumentService.php
          php -l app/Service/NavigationCounterService.php
          php -l app/Http/Controllers/Company/ClosingDocumentsController.php
          php -l app/Http/Routes/company_bank_finance.php
          php -l app/View/pages/company_finance_closing_documents.php
          php -l app/View/pages/company_finance_closing_document_modal.php
          php -l app/View/pages/company_finance_closing_document_exceptions.php
          php -l tests/finance_closing_documents_contract_test.php
          php -l tests/closing_documents_runtime_dependency_test.php
          php -l scripts/finance_closing_apply_078.php
          php -l scripts/finance_closing_verify_078.php
      - name: Runtime view contracts
        run: php tests/closing_documents_runtime_dependency_test.php
      - name: Start disposable MySQL
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          GRANT ALL PRIVILEGES ON *.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
      - name: Closing documents domain contract
        env:
          PLANEX_TEST_MYSQL_HOST: 127.0.0.1
          PLANEX_TEST_MYSQL_USER: planex_ci
          PLANEX_TEST_MYSQL_PASSWORD: planex_ci
        run: php tests/finance_closing_documents_contract_test.php
      - name: Existing finance regressions
        run: |
          php tests/finance_manual_facts_regression_test.php
          php tests/finance_invoice_ui_contract_test.php
          php tests/finance_employee_personal_expense_event_regression_test.php
      - name: Configure production-runtime SSH for read-only candidate preflight
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/closing_preflight_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/closing_preflight_key" "$HOME/.ssh/known_hosts"
      - name: Upload candidate closing runtime to temporary server area
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          for f in app/Service/ClosingDocumentService.php app/Http/Controllers/Company/ClosingDocumentsController.php app/View/pages/company_finance_closing_documents.php app/View/pages/company_finance_closing_document_modal.php app/View/pages/company_finance_closing_document_exceptions.php; do
            flat="$(echo "$f" | tr '/' '_')"
            scp -P "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$f" "$SSH_USER@$SSH_HOST:/tmp/${GITHUB_RUN_ID}_${flat}"
          done
      - name: Full candidate controller main modal and exceptions render on production config READ ONLY
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html"/erpv2
          TMP="/tmp/closing_candidate_${RUN_ID}"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          cp -a "$LIVE/." "$TMP/"
          for path in \
            app/Service/ClosingDocumentService.php \
            app/Http/Controllers/Company/ClosingDocumentsController.php \
            app/View/pages/company_finance_closing_documents.php \
            app/View/pages/company_finance_closing_document_modal.php \
            app/View/pages/company_finance_closing_document_exceptions.php; do
            rm -f "$TMP/$path"
            flat="$(echo "$path" | tr '/' '_')"
            mv "/tmp/${RUN_ID}_${flat}" "$TMP/$path"
          done
          CANDIDATE_ROOT="$TMP" /usr/bin/php8.5 -d display_errors=1 -r '
            chdir(getenv("CANDIDATE_ROOT")); $config=require "bootstrap/app.php"; require "app/Support/entrypoint_dependencies.php"; require "app/Http/Controllers/Company/ClosingDocumentsController.php";
            $_SESSION=["user_id"=>1,"role_code"=>"company_owner","company_id"=>25]; $_SERVER["REQUEST_METHOD"]="GET"; $_SERVER["REQUEST_URI"]="/erpv2/company/finance/closing-documents"; $db=new \App\Core\Database($config["database"]); $controller=new \App\Http\Controllers\Company\ClosingDocumentsController($config,$db);
            ob_start(); $controller->index(); $main=ob_get_clean();
            foreach(["data-closing-search","data-closing-problem-only","dblclick","closing-document-modal"] as $token){if(strpos($main,$token)===false) exit(7);} if(strpos($main,"<th>Действия</th>")!==false) exit(8);
            ob_start(); $controller->exceptions(); $rules=ob_get_clean(); if(strpos($rules,"data-recipient-search")===false||strpos($rules,"data-exception-search")===false) exit(9);
            $companyId=25; $central=$db->connection(); $stmt=$central->prepare("SELECT * FROM companies WHERE id=? LIMIT 1"); $stmt->execute([$companyId]); $company=$stmt->fetch(PDO::FETCH_ASSOC); $tenant=(new \App\Core\Database(companyDatabaseConfig($config,$company)))->connection(); $report=\App\Service\ClosingDocumentService::reportRows($tenant,false);
            if($report){$id=(int)$report[0]["id"]; ob_start(); $controller->modalView($id); $modal=ob_get_clean(); foreach(["Требуемый комплект","Загрузить новый документ"] as $token){if(strpos($modal,$token)===false) exit(10);}}
            echo "CLOSING_DOCUMENTS_INVOICE_UX_PRODUCTION_CONFIG_PREFLIGHT=PASS\n";'
          rm -rf "$TMP"
          REMOTE
      - name: Cleanup preflight SSH
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -rf '/tmp/closing_candidate_${GITHUB_RUN_ID}'; rm -f /tmp/${GITHUB_RUN_ID}_app_*" 2>/dev/null || true
          rm -f "$HOME/.ssh/closing_preflight_key" 2>/dev/null || true
