name: Finance Closing Documents Regression

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/Service/ClosingDocumentService.php'
      - 'app/Service/NavigationCounterService.php'
      - 'app/Http/Controllers/Company/ClosingDocumentsController.php'
      - 'app/Http/Routes/company_bank_finance.php'
      - 'app/View/pages/company_finance_closing_documents.php'
      - 'app/View/pages/company_finance_closing_document_modal.php'
      - 'app/View/pages/company_finance_closing_document_exceptions.php'
      - 'app/View/pages/company_finance_closing_document_exception_form.php'
      - 'app/View/layouts/main.php'
      - 'app/Support/entrypoint_dependencies.php'
      - 'database/migrations-local/077_finance_closing_documents.sql'
      - 'database/migrations-local/078_finance_closing_document_exceptions.sql'
      - 'database/migrations-local/079_finance_closing_document_exception_purpose.sql'
      - 'scripts/finance_closing_apply_079.php'
      - 'scripts/finance_closing_verify_079.php'
      - 'tests/finance_closing_documents_contract_test.php'
      - 'tests/closing_documents_runtime_dependency_test.php'
      - 'tests/closing_documents_invoice_ux_contract_test.php'
      - '.github/workflows/finance_closing_documents_regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closing-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l app/Service/ClosingDocumentService.php
          php -l app/Service/NavigationCounterService.php
          php -l app/Http/Controllers/Company/ClosingDocumentsController.php
          php -l app/Http/Routes/company_bank_finance.php
          php -l app/View/pages/company_finance_closing_documents.php
          php -l app/View/pages/company_finance_closing_document_modal.php
          php -l app/View/pages/company_finance_closing_document_exceptions.php
          php -l app/View/pages/company_finance_closing_document_exception_form.php
          php -l tests/finance_closing_documents_contract_test.php
          php -l tests/closing_documents_runtime_dependency_test.php
          php -l tests/closing_documents_invoice_ux_contract_test.php
          php -l scripts/finance_closing_apply_079.php
          php -l scripts/finance_closing_verify_079.php
      - name: Runtime and UX contracts
        run: |
          php tests/closing_documents_runtime_dependency_test.php
          php tests/closing_documents_invoice_ux_contract_test.php
      - name: Start disposable MySQL
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          GRANT ALL PRIVILEGES ON *.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
      - name: Closing documents domain contract including migration 079
        env:
          PLANEX_TEST_MYSQL_HOST: 127.0.0.1
          PLANEX_TEST_MYSQL_USER: planex_ci
          PLANEX_TEST_MYSQL_PASSWORD: planex_ci
        run: php tests/finance_closing_documents_contract_test.php
      - name: Existing finance regressions
        run: |
          php tests/finance_manual_facts_regression_test.php
          php tests/finance_invoice_ui_contract_test.php
          php tests/finance_employee_personal_expense_event_regression_test.php
      - name: Configure production-runtime SSH for read-only candidate preflight
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/closing_preflight_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/closing_preflight_key" "$HOME/.ssh/known_hosts"
      - name: Upload candidate PHP to temporary server area
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          for f in app/Service/ClosingDocumentService.php app/Http/Controllers/Company/ClosingDocumentsController.php app/View/pages/company_finance_closing_documents.php app/View/pages/company_finance_closing_document_modal.php app/View/pages/company_finance_closing_document_exceptions.php app/View/pages/company_finance_closing_document_exception_form.php; do
            flat="$(echo "$f" | tr '/' '_')"
            scp -P "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$f" "$SSH_USER@$SSH_HOST:/tmp/${GITHUB_RUN_ID}_${flat}"
          done
      - name: Production PHP runtime syntax and view preflight READ ONLY
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html"/erpv2
          for f in /tmp/${RUN_ID}_app_*.php; do /usr/bin/php8.5 -l "$f"; done
          TMP="/tmp/closing_candidate_${RUN_ID}"
          rm -rf "$TMP"; mkdir -p "$TMP"; cp -a "$LIVE/." "$TMP/"
          for path in app/Service/ClosingDocumentService.php app/Http/Controllers/Company/ClosingDocumentsController.php app/View/pages/company_finance_closing_documents.php app/View/pages/company_finance_closing_document_modal.php app/View/pages/company_finance_closing_document_exceptions.php app/View/pages/company_finance_closing_document_exception_form.php; do
            flat="$(echo "$path" | tr '/' '_')"; rm -f "$TMP/$path"; mv "/tmp/${RUN_ID}_${flat}" "$TMP/$path"
          done
          CANDIDATE_ROOT="$TMP" /usr/bin/php8.5 -d display_errors=1 -r '
            chdir(getenv("CANDIDATE_ROOT")); $config=require "bootstrap/app.php"; require "app/Support/entrypoint_dependencies.php";
            $schemaReady=true;$dbError=null;$successFlash=null;$errorFlash=null;$rows=[];
            ob_start();require "app/View/pages/company_finance_closing_documents.php";$main=ob_get_clean();if(strpos($main,"data-closing-search")===false||strpos($main,"data-closing-problem-only")===false)exit(7);
            $exceptions=[["id"=>1,"inn"=>"7702070139","purpose_contains"=>"комиссия","comment"=>"банк"]];
            ob_start();require "app/View/pages/company_finance_closing_document_exceptions.php";$rules=ob_get_clean();foreach(["+ Исключение","Поиск по исключениям","Назначение содержит","dblclick"] as $t){if(strpos($rules,$t)===false)exit(8);}
            $rule=["id"=>1,"inn"=>"7702070139","purpose_contains"=>"комиссия","comment"=>"банк"];
            ob_start();require "app/View/pages/company_finance_closing_document_exception_form.php";$form=ob_get_clean();foreach(["purpose_contains","Если оставить пустым","Сохранить"] as $t){if(strpos($form,$t)===false)exit(9);}
            echo "CLOSING_079_PRODUCTION_PHP_VIEW_PREFLIGHT=PASS\n";'
          rm -rf "$TMP"
          REMOTE
      - name: Cleanup preflight SSH
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -rf '/tmp/closing_candidate_${GITHUB_RUN_ID}'; rm -f /tmp/${GITHUB_RUN_ID}_app_*" 2>/dev/null || true
          rm -f "$HOME/.ssh/closing_preflight_key" 2>/dev/null || true
