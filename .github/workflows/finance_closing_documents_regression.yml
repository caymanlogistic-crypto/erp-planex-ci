name: Finance Closing Documents Regression

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/Service/ClosingDocumentService.php'
      - 'app/Service/NavigationCounterService.php'
      - 'app/Http/Controllers/Company/ClosingDocumentsController.php'
      - 'app/Http/Routes/company_bank_finance.php'
      - 'app/View/pages/company_finance_closing_documents.php'
      - 'app/View/layouts/main.php'
      - 'app/Support/entrypoint_dependencies.php'
      - 'database/migrations-local/077_finance_closing_documents.sql'
      - 'tests/finance_closing_documents_contract_test.php'
      - 'tests/closing_documents_runtime_dependency_test.php'
      - '.github/workflows/finance_closing_documents_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closing-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l app/Service/ClosingDocumentService.php
          php -l app/Service/NavigationCounterService.php
          php -l app/Http/Controllers/Company/ClosingDocumentsController.php
          php -l app/Http/Routes/company_bank_finance.php
          php -l app/View/pages/company_finance_closing_documents.php
          php -l app/View/layouts/main.php
          php -l app/Support/entrypoint_dependencies.php
          php -l tests/finance_closing_documents_contract_test.php
          php -l tests/closing_documents_runtime_dependency_test.php

      - name: Runtime dependency contract
        run: php tests/closing_documents_runtime_dependency_test.php

      - name: Start disposable MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          GRANT ALL PRIVILEGES ON *.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL

      - name: Closing documents contract
        env:
          PLANEX_TEST_MYSQL_HOST: 127.0.0.1
          PLANEX_TEST_MYSQL_USER: planex_ci
          PLANEX_TEST_MYSQL_PASSWORD: planex_ci
        run: php tests/finance_closing_documents_contract_test.php

      - name: Existing bank and finance regressions
        run: |
          php tests/finance_manual_facts_regression_test.php
          php tests/finance_invoice_ui_contract_test.php
          php tests/finance_employee_personal_expense_event_regression_test.php

      - name: Configure production-runtime SSH for read-only preflight
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/closing_preflight_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/closing_preflight_key" "$HOME/.ssh/known_hosts"

      - name: Production-config candidate controller render preflight READ ONLY
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          remote_controller="/tmp/ClosingDocumentsController_candidate_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            app/Http/Controllers/Company/ClosingDocumentsController.php "$SSH_USER@$SSH_HOST:$remote_controller"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "ROOT='/home/s/spugovxsim/planexp'; LIVE_ROOT=\"\$ROOT/public_html\"/erpv2; CANDIDATE_CONTROLLER='$remote_controller' LIVE_ROOT=\"\$LIVE_ROOT\" /usr/bin/php8.5 -d display_errors=1 -r 'chdir(getenv(\"LIVE_ROOT\")); \$config=require \"bootstrap/app.php\"; require \"app/Support/entrypoint_dependencies.php\"; require getenv(\"CANDIDATE_CONTROLLER\"); \$_SESSION=[\"user_id\"=>1,\"role_code\"=>\"company_owner\",\"company_id\"=>25]; \$_SERVER[\"REQUEST_METHOD\"]=\"GET\"; \$_SERVER[\"REQUEST_URI\"]=\"/erpv2/company/finance/closing-documents\"; \$db=new \\App\\Core\\Database(\$config[\"database\"]); ob_start(); (new \\App\\Http\\Controllers\\Company\\ClosingDocumentsController(\$config,\$db))->index(); \$html=ob_get_clean(); if(strpos(\$html,\"Закрывающие документы\")===false){fwrite(STDERR,\"closing controller full render marker missing\\n\"); exit(7);} echo \"closing_documents_production_config_render_preflight: PASS\\n\";'"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/closing_preflight_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$remote_controller'" || true

      - name: Cleanup preflight SSH
        if: always()
        run: rm -f "$HOME/.ssh/closing_preflight_key" 2>/dev/null || true
