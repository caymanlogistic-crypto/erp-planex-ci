name: Waste Trips Customer Payment Production QA

on:
  push:
    branches:
      - qa/waste-trips-customer-payment-prod-20260912

permissions:
  contents: read
  statuses: read

env:
  MIGRATION_SHA: abdbaa8c87f3e294edb42acf4265ba7f490e65a5
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802

jobs:
  production-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate QA lineage and production gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$MIGRATION_SHA" HEAD
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/commits/$MIGRATION_SHA/status" > /tmp/status.json
          MIGRATION_SHA="$MIGRATION_SHA" python3 - <<'PY'
          import json,os
          data=json.load(open('/tmp/status.json'))
          latest={}
          for row in data.get('statuses',[]): latest.setdefault(row.get('context'),row)
          if latest.get('erpv2/migration134',{}).get('state')!='success': raise SystemExit('erpv2/migration134 is not success')
          print('WASTE_QA_MIGRATION_GATE=PASS')
          print('WASTE_QA_MIGRATION_SHA='+os.environ['MIGRATION_SHA'])
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
          node --check .github/waste-trips-customer-payment-qa/production_acceptance.js

      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/waste_payment_qa_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/waste_payment_qa_key" "$HOME/.ssh/known_hosts"

      - name: Verify deployed marker and create temporary owner QA session
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_payment_qa_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -P "$SSH_PORT" -i "$HOME/.ssh/waste_payment_qa_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          LIVE_SHA="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          [[ "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch -q --no-tags origin "$LIVE_SHA"
          git merge-base --is-ancestor "$MIGRATION_SHA" "$LIVE_SHA"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/commits/$LIVE_SHA/status" > /tmp/live-status.json
          LIVE_SHA="$LIVE_SHA" python3 - <<'PY'
          import json,os
          data=json.load(open('/tmp/live-status.json'))
          latest={}
          for row in data.get('statuses',[]): latest.setdefault(row.get('context'),row)
          if latest.get('erpv2/deploy',{}).get('state')!='success': raise SystemExit('erpv2/deploy is not success on live SHA')
          print('WASTE_QA_LIVE_DEPLOY_GATE=PASS')
          print('WASTE_QA_LIVE_SHA='+os.environ['LIVE_SHA'])
          PY
          echo "QA_LIVE_SHA=$LIVE_SHA" >> "$GITHUB_ENV"
          REMOTE="/tmp/waste_payment_roles_qa_${GITHUB_RUN_ID}.php"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "rm -f '/tmp/waste_payment_qa_session_34704666296.php' '/tmp/waste_payment_qa_session_34704801187.php' '$REMOTE'"
          "${SCP[@]}" .github/roles-access/qa_session.php "$SSH_USER@$SSH_HOST:$REMOTE"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "/usr/bin/php8.5 -l '$REMOTE' >/dev/null"
          set +e
          OUT="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '$REMOTE' create-editable-waste-owner" 2>qa-session-create.err)"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "ROLES_QA_SESSION_CREATE_RC=$RC"
            sed -E 's#/home/[^ ]+#/home/[redacted]#g' qa-session-create.err | tail -20
            exit "$RC"
          fi
          case "$OUT" in ROLES_QA_SESSION=*) ;; *) echo 'ROLES_QA_SESSION_OUTPUT_INVALID'; exit 1 ;; esac
          JSON="${OUT#ROLES_QA_SESSION=}"
          python3 - "$JSON" "$GITHUB_ENV" <<'PY'
          import json,sys
          obj=json.loads(sys.argv[1])
          print(f"::add-mask::{obj['sid']}")
          with open(sys.argv[2],'a') as f:
              f.write(f"QA_COOKIE_NAME={obj['cookie']}\n")
              f.write(f"QA_OWNER_SESSION_ID={obj['sid']}\n")
              f.write(f"QA_OWNER_COMPANY_ID={obj['company_id']}\n")
          if obj['mode'] != 'create-editable-waste-owner': raise SystemExit('unexpected QA owner session mode')
          PY
          echo 'WASTE_QA_OWNER_SESSION_CREATED=YES'

      - name: Read-only browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node .github/waste-trips-customer-payment-qa/production_acceptance.js | tee artifacts/waste-trips-customer-payment-console.txt
          grep -q '^WASTE_TRIPS_CUSTOMER_PAYMENT_PROD_QA=PASS$' artifacts/waste-trips-customer-payment-console.txt
          grep -q '^WASTE_TRIPS_PRODUCTION_READ_ONLY=YES$' artifacts/waste-trips-customer-payment-console.txt

      - name: Cleanup QA session and prove residue zero
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p artifacts
          STATUS=0
          REMOTE="/tmp/waste_payment_roles_qa_${GITHUB_RUN_ID}.php"
          if [ -f "$HOME/.ssh/waste_payment_qa_key" ]; then
            if [ -n "${QA_OWNER_SESSION_ID:-}" ] && [ -n "${QA_COOKIE_NAME:-}" ]; then
              OUT="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_payment_qa_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
                "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '$REMOTE' delete '$QA_OWNER_SESSION_ID'")" || STATUS=1
              [ "$OUT" = 'ROLES_QA_SESSION_DELETED' ] || STATUS=1
              HTTP="$(curl -sS -o /dev/null -w '%{http_code}' -H "Cookie: ${QA_COOKIE_NAME}=${QA_OWNER_SESSION_ID}" https://plan-ex.ru/erpv2/company/trips/departures || true)"
              [ "$HTTP" != '200' ] || STATUS=1
            fi
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_payment_qa_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST"               "rm -f '$REMOTE' '/tmp/waste_payment_qa_session_34704666296.php' '/tmp/waste_payment_qa_session_34704801187.php' && test ! -e '$REMOTE' && test ! -e '/tmp/waste_payment_qa_session_34704666296.php' && test ! -e '/tmp/waste_payment_qa_session_34704801187.php'" || STATUS=1
          else
            STATUS=1
          fi
          rm -f "$HOME/.ssh/waste_payment_qa_key"
          if [ "$STATUS" -eq 0 ]; then
            echo 'WASTE_TRIPS_QA_RESIDUE=0' | tee artifacts/waste-trips-qa-cleanup.txt
          else
            echo 'WASTE_TRIPS_QA_RESIDUE=FAIL' | tee artifacts/waste-trips-qa-cleanup.txt
          fi
          exit "$STATUS"

      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waste-trips-customer-payment-production-${{ env.MIGRATION_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
