name: ERPv2 Agent Release Bootstrap

on:
  workflow_run:
    workflows: ["FEO XLSX Contract"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: erpv2-agent-release-bootstrap
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  BOOTSTRAP_RUN_ID: '32979801695'

jobs:
  release:
    if: >-
      github.event.workflow_run.id == 32979801695 &&
      github.event.workflow_run.run_attempt >= 3 &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.triggering_actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact canonical
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_BRANCH }}
          fetch-depth: 1

      - name: Validate release bootstrap contract
        run: php tests/agent_release_bootstrap_contract_test.php

      - name: Run guarded migration and deploy bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: python3 tools/agent_release_bootstrap.py
