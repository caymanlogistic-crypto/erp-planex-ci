name: Waste Trips Regression

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/Http/Controllers/Company/WasteTripController.php'
      - 'app/Http/Routes/company_linear_trips.php'
      - 'app/Service/WasteTrip*.php'
      - 'app/Service/WasteTripCustomerPaymentService.php'
      - 'app/Service/WasteTripCarrierPaymentService.php'
      - 'app/Service/Finance*.php'
      - 'app/Service/WasteTripIncidentService.php'
      - 'app/Service/WasteTripLegacySourceService.php'
      - 'app/Service/WasteTripLegacySyncService.php'
      - 'app/Service/WasteTripSynchronizationService.php'
      - 'app/Service/WasteTripLegacyMappingService.php'
      - 'database/migrations-local/*waste_trip*.sql'
      - 'app/Service/UserSyncService.php'
      - 'app/View/pages/company_waste_trip*.php'
      - 'app/View/partials/company_waste_trip*.php'
      - 'database/migrations-local/130_waste_trip_legacy_linked_cutover.sql'
      - 'database/migrations-local/134_create_waste_trip_customer_payments.sql'
      - 'database/migrations-local/135_create_waste_trip_carrier_payments.sql'
      - 'scripts/waste_trip_sync.php'
      - 'scripts/waste_trip_legacy_readonly_probe.php'
      - 'scripts/waste_trips_*_130.php'
      - 'tests/waste_trip*.php'
      - '.github/workflows/waste_trips*.yml'
  push:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/Http/Controllers/Company/WasteTripController.php'
      - 'app/Http/Routes/company_linear_trips.php'
      - 'app/Service/WasteTrip*.php'
      - 'app/Service/WasteTripCustomerPaymentService.php'
      - 'app/Service/WasteTripCarrierPaymentService.php'
      - 'app/Service/Finance*.php'
      - 'app/Service/WasteTripIncidentService.php'
      - 'app/Service/WasteTripLegacySourceService.php'
      - 'app/Service/WasteTripLegacySyncService.php'
      - 'app/Service/WasteTripSynchronizationService.php'
      - 'app/Service/WasteTripLegacyMappingService.php'
      - 'database/migrations-local/*waste_trip*.sql'
      - 'app/Service/UserSyncService.php'
      - 'app/View/pages/company_waste_trip*.php'
      - 'app/View/partials/company_waste_trip*.php'
      - 'database/migrations-local/130_waste_trip_legacy_linked_cutover.sql'
      - 'database/migrations-local/134_create_waste_trip_customer_payments.sql'
      - 'database/migrations-local/135_create_waste_trip_carrier_payments.sql'
      - 'scripts/waste_trip_sync.php'
      - 'scripts/waste_trip_legacy_readonly_probe.php'
      - 'scripts/waste_trips_*_130.php'
      - 'tests/waste_trip*.php'
      - '.github/workflows/waste_trips*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waste-trips:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 1}
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            scripts/waste_trips_apply_137.php scripts/waste_trips_verify_137.php \
            tests/waste_trip_legacy_mapping_test.php tests/waste_trip_synchronization_mysql_test.php tests/waste_trips_137_migration_mysql_test.php tests/waste_trips_137_production_migration_contract_test.php \
            app/Http/Controllers/Company/WasteTripController.php \
            app/Http/Routes/company_linear_trips.php \
            app/Service/WasteTripService.php \
            app/Service/WasteTripActionConflictService.php \
            app/Service/WasteTripCustomerPaymentService.php \
            app/Service/WasteTripCarrierPaymentService.php \
            app/Service/WasteTripIncidentService.php \
            app/Service/WasteTripLegacySourceService.php \
            app/Service/WasteTripLegacySyncService.php \
            app/Service/WasteTripSynchronizationService.php \
            app/Service/WasteTripLegacyMappingService.php \
            app/Service/UserSyncService.php \
            app/View/pages/company_waste_trips.php \
            app/View/partials/company_waste_trip_modal_view.php \
            app/View/partials/company_waste_trip_modal_edit.php \
            app/View/partials/company_waste_trip_customer_payments.php \
            app/View/partials/company_waste_trip_carrier_payments.php \
            scripts/waste_trip_sync.php scripts/waste_trips_apply_130.php scripts/waste_trips_verify_130.php scripts/waste_trips_apply_134.php scripts/waste_trips_verify_134.php scripts/waste_trips_apply_135.php scripts/waste_trips_verify_135.php scripts/waste_trip_244_readonly_probe.php scripts/waste_trip_legacy_readonly_probe.php \
            tests/waste_trip_incident_service_test.php tests/waste_trip_action_conflict_test.php tests/waste_trip_customer_payment_regression_test.php tests/waste_trip_carrier_finance_regression_test.php tests/waste_trip_legacy_readonly_probe_contract_test.php tests/waste_trip_regression_test.php tests/waste_trip_manager_membership_regression_test.php tests/waste_trip_legacy_linked_contract_test.php tests/waste_trip_owner_layout_contract_test.php tests/waste_trip_scheduler_contract_test.php tests/waste_trips_runtime_diagnostic_contract_test.php tests/waste_trip_244_readonly_probe_contract_test.php tests/waste_trips_128_production_migration_contract_test.php tests/waste_trips_130_production_migration_contract_test.php tests/waste_trips_134_production_migration_contract_test.php tests/waste_trips_135_production_migration_contract_test.php
          do php -l "$f"; done
      - name: Static target contracts
        shell: bash
        run: |
          set -euo pipefail
          php tests/waste_trip_incident_service_test.php | tee /tmp/incident.out
          grep -Fqx 'WASTE_TRIP_INCIDENT_SERVICE=PASS' /tmp/incident.out
          php tests/waste_trip_action_conflict_test.php | tee /tmp/action-conflict.out
          grep -Fqx 'WASTE_TRIP_ACTION_CONFLICT=PASS' /tmp/action-conflict.out
          php tests/waste_trip_legacy_readonly_probe_contract_test.php | tee /tmp/legacy-probe.out
          grep -Fqx 'WASTE_TRIP_LEGACY_READ_ONLY_PROBE_CONTRACT=PASS' /tmp/legacy-probe.out
          php tests/waste_trip_legacy_linked_contract_test.php | tee /tmp/legacy.out
          grep -Fqx 'WASTE_TRIP_LEGACY_LINKED=PASS' /tmp/legacy.out
          php tests/waste_trip_owner_layout_contract_test.php | tee /tmp/owner.out
          grep -Fqx 'WASTE_TRIP_OWNER_LAYOUT=PASS' /tmp/owner.out
          php tests/waste_trip_scheduler_contract_test.php | tee /tmp/scheduler.out
          grep -Fqx 'WASTE_TRIP_SCHEDULER=PASS' /tmp/scheduler.out
          php tests/waste_trips_runtime_diagnostic_contract_test.php | tee /tmp/runtime-diagnostic.out
          grep -Fqx 'WASTE_TRIPS_RUNTIME_DIAGNOSTIC_CONTRACT=PASS' /tmp/runtime-diagnostic.out
          php tests/waste_trip_244_readonly_probe_contract_test.php | tee /tmp/read-only-244.out
          grep -Fqx 'WASTE_TRIP_244_READ_ONLY_PROBE_CONTRACT=PASS' /tmp/read-only-244.out
          php tests/waste_trips_130_production_migration_contract_test.php | tee /tmp/m130.out
          grep -Fqx 'WASTE_TRIPS_130_PRODUCTION_MIGRATION=PASS' /tmp/m130.out
          php tests/waste_trips_134_production_migration_contract_test.php | tee /tmp/m134.out
          grep -Fqx 'WASTE_TRIPS_134_PRODUCTION_MIGRATION_CONTRACT=PASS' /tmp/m134.out
          php tests/waste_trips_135_production_migration_contract_test.php | tee /tmp/m135.out
          grep -Fqx 'WASTE_TRIPS_135_PRODUCTION_MIGRATION_CONTRACT=PASS' /tmp/m135.out
          php tests/waste_trips_137_production_migration_contract_test.php
      - name: Start isolated MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          GRANT ALL PRIVILEGES ON *.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
      - name: Waste Trips MySQL regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/waste_trip_customer_payment_regression_test.php | tee /tmp/customer-payment.out
          grep -Fqx 'WASTE_TRIP_CUSTOMER_PAYMENT_STATIC=PASS' /tmp/customer-payment.out
          grep -Fqx 'WASTE_TRIP_CUSTOMER_PAYMENT_MYSQL=PASS' /tmp/customer-payment.out
          php tests/waste_trip_carrier_finance_regression_test.php | tee /tmp/carrier-finance.out
          grep -Fqx 'WASTE_TRIP_CARRIER_FINANCE_STATIC=PASS' /tmp/carrier-finance.out
          grep -Fqx 'WASTE_TRIP_CARRIER_FINANCE_MYSQL=PASS' /tmp/carrier-finance.out
          php tests/waste_trip_regression_test.php | tee /tmp/waste.out
          for marker in WASTE_TRIP_DOMAIN=PASS WASTE_TRIP_STATIC_SECURITY=PASS WASTE_TRIP_MYSQL=PASS WASTE_TRIP_CONCURRENCY=PASS; do grep -Fqx "$marker" /tmp/waste.out; done
          php tests/waste_trip_manager_membership_regression_test.php | tee /tmp/manager-membership.out
          grep -Fqx 'WASTE_TRIP_MANAGER_MEMBERSHIP_MYSQL=PASS' /tmp/manager-membership.out
          php tests/waste_trip_legacy_mapping_test.php | tee /tmp/mapping.out
          grep -Fqx 'WASTE_TRIP_LEGACY_MAPPING=PASS' /tmp/mapping.out
          php tests/waste_trip_synchronization_mysql_test.php | tee /tmp/synchronization.out
          grep -Fqx 'WASTE_TRIP_SYNCHRONIZATION_MYSQL=PASS' /tmp/synchronization.out
          php tests/waste_trips_137_migration_mysql_test.php | tee /tmp/m137-mysql.out
          grep -Fqx 'WASTE_TRIPS_137_MIGRATION_MYSQL=PASS' /tmp/m137-mysql.out
          php tests/waste_trips_138_production_migration_contract_test.php
          php tests/waste_trips_138_migration_mysql_test.php | tee /tmp/m138-mysql.out
          grep -Fqx 'WASTE_TRIPS_138_MIGRATION_MYSQL=PASS' /tmp/m138-mysql.out
