name: P48 Cash Ledger Runtime
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact deployed 40-character SHA expected on /erpv2'
        required: true
        type: string
      confirm_migrations:
        description: 'Type APPLY_P48_MIGRATIONS to authorize production migrations 073-075'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: ${{ inputs.confirm_migrations == 'APPLY_P48_MIGRATIONS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify exact deployed marker
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p48"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p48" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/p48" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$got" = "$SHA"
      - name: Apply tenant migrations 073, 074 and 075
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          live=/home/s/spugovxsim/planexp/public_html/erpv2
          ssh -p "$PORT" -i "$HOME/.ssh/p48" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "cd '$live' && /usr/bin/php8.5 scripts/p97_apply_finance_manual_facts_migration.php" | tee P97_MIGRATION.txt
          grep -q 'P97_FINANCE_MANUAL_FACTS_MIGRATION_OK' P97_MIGRATION.txt
          ssh -p "$PORT" -i "$HOME/.ssh/p48" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "cd '$live' && /usr/bin/php8.5 scripts/p98_apply_employee_personal_expense_event_migration.php" | tee P98_MIGRATION.txt
          grep -q 'P98_EMPLOYEE_PERSONAL_EXPENSE_EVENT_MIGRATION_OK' P98_MIGRATION.txt
          ssh -p "$PORT" -i "$HOME/.ssh/p48" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "cd '$live' && /usr/bin/php8.5 scripts/p99_apply_employee_invoice_payment_migration.php" | tee P99_MIGRATION.txt
          grep -q 'P99_EMPLOYEE_INVOICE_PAYMENT_MIGRATION_OK' P99_MIGRATION.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            printf '%s\n' "$KEY" > /tmp/p48_key
            chmod 600 /tmp/p48_key
            cred="$(python .github/p11/P11_decrypt_credentials.py --key /tmp/p48_key --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Fail-closed read-only cash and employee invoice acceptance
        shell: bash
        run: |
          set -euo pipefail
          node .github/p48/P48_cash_ledger_runtime.js 2>&1 | tee P48_RUNTIME.txt
          grep -q 'P48_CASH_LEDGER_RUNTIME_OK' P48_RUNTIME.txt
          grep -q 'P48_EMPLOYEE_PERSONAL_EXPENSE_UI_OK' P48_RUNTIME.txt
          grep -q 'P48_INVOICE_CENTRIC_CASH_UI_OK' P48_RUNTIME.txt
          grep -q 'P48_EMPLOYEE_INVOICE_PAYMENT_UI_OK' P48_RUNTIME.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P48_cash_ledger_runtime_${{ inputs.source_sha }}
          path: |
            P97_MIGRATION.txt
            P98_MIGRATION.txt
            P99_MIGRATION.txt
            P48_RUNTIME.txt
            P48_cash_lifecycle.png
            P48_invoice_cash.png
            P48_employee_invoice_payment.png
            P48_employee_personal_expense.png
          if-no-files-found: warn
