name: ERPv2 Web Runtime Diagnostic

on:
  push:
    branches:
      - qa/erpv2-web-runtime-diagnostic-20260902
      - chatgpt/waste-trips-legacy-create-runtime-fix-20260909

permissions:
  contents: read

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  SERVER_ROOT: /home/s/spugovxsim/planexp
  LIVE_DIR: public_html
  TASK_DIAGNOSTIC_BASE_SHA: a211573f385d1ac19bdebef0bc1e807fc8132187

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME" --depth=50
          git fetch origin "$CANONICAL_BRANCH" --depth=1
          canonical="$(git rev-parse FETCH_HEAD)"
          head="$(git rev-parse HEAD)"
          case "$GITHUB_REF_NAME" in
            qa/erpv2-web-runtime-diagnostic-20260902)
              test "$head" = "$canonical"
              ;;
            chatgpt/waste-trips-legacy-create-runtime-fix-20260909)
              test "$canonical" = "$TASK_DIAGNOSTIC_BASE_SHA"
              git merge-base --is-ancestor "$TASK_DIAGNOSTIC_BASE_SHA" "$head"
              ;;
            *) exit 1 ;;
          esac
          echo "EXACT_CANONICAL_SHA=$canonical"

      - name: Configure isolated SSH credentials
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/erpv2_runtime_diag_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/erpv2_runtime_diag_key" "$HOME/.ssh/known_hosts"

      - name: Probe web server PHP runtime and static routing
        id: probe
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          PROBE_NAME="_p07_runtime_${GITHUB_RUN_ID}.php"
          STATIC_NAME="_p07_static_${GITHUB_RUN_ID}.txt"
          REMOTE_PROBE="$SERVER_ROOT/${LIVE_DIR}/erpv2/public/$PROBE_NAME"
          REMOTE_STATIC="$SERVER_ROOT/${LIVE_DIR}/erpv2/public/$STATIC_NAME"
          printf '::add-mask::%s\n' "$TOKEN"
          cleanup() {
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_runtime_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '$REMOTE_PROBE' '$REMOTE_STATIC' && test ! -e '$REMOTE_PROBE' && test ! -e '$REMOTE_STATIC'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          LOCAL_PROBE="$(mktemp)"
          cat > "$LOCAL_PROBE" <<PHP
          <?php
          if (!hash_equals('${TOKEN}', (string)(\$_GET['token'] ?? ''))) { http_response_code(404); exit; }
          header('Content-Type: text/plain; charset=utf-8');
          echo 'PHP_VERSION=', PHP_VERSION, PHP_EOL;
          echo 'PHP_SAPI=', PHP_SAPI, PHP_EOL;
          echo 'OPCACHE_ENABLE=', ini_get('opcache.enable'), PHP_EOL;
          echo 'OPCACHE_VALIDATE_TIMESTAMPS=', ini_get('opcache.validate_timestamps'), PHP_EOL;
          echo 'OPCACHE_REVALIDATE_FREQ=', ini_get('opcache.revalidate_freq'), PHP_EOL;
          echo 'OPCACHE_RESET=', (function_exists('opcache_reset') && opcache_reset() ? '1' : '0'), PHP_EOL;
          echo 'WEB_ERROR_LOG=', ini_get('error_log'), PHP_EOL;
          echo 'WEB_LOG_ERRORS=', ini_get('log_errors'), PHP_EOL;
          echo 'WEB_INI_LOADED=', (php_ini_loaded_file() ?: ''), PHP_EOL;
          error_log('erpv2_waste_log_probe_${GITHUB_RUN_ID}');
          PHP
          LOCAL_STATIC="$(mktemp)"
          printf 'ERPV2_STATIC_DIAGNOSTIC=OK\n' > "$LOCAL_STATIC"
          chmod 0644 "$LOCAL_PROBE" "$LOCAL_STATIC"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/erpv2_runtime_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$LOCAL_PROBE" "$SSH_USER@$SSH_HOST:$REMOTE_PROBE"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/erpv2_runtime_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$LOCAL_STATIC" "$SSH_USER@$SSH_HOST:$REMOTE_STATIC"
          rm -f "$LOCAL_PROBE" "$LOCAL_STATIC"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_runtime_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "chmod 0644 '$REMOTE_PROBE' '$REMOTE_STATIC' && stat -c 'PROBE_MODE=%a PROBE_OWNER=%U:%G PROBE_PATH=%n' '$REMOTE_PROBE' '$REMOTE_STATIC'"

          STATIC_BODY="$(mktemp)"
          STATIC_HTTP="$(curl -sS -o "$STATIC_BODY" -w '%{http_code}' --max-time 30 "https://plan-ex.ru/erpv2/${STATIC_NAME}" || printf '000')"
          echo "STATIC_PROBE_HTTP=$STATIC_HTTP"
          head -c 120 "$STATIC_BODY" || true
          echo
          rm -f "$STATIC_BODY"

          ASSET_HTTP="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/assets/css/app.css || printf '000')"
          LEGACY_HTTP="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erp/ || printf '000')"
          ROOT_HTTP="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/ || printf '000')"
          echo "ERPV2_ASSET_HTTP=$ASSET_HTTP"
          echo "LEGACY_ERP_HTTP=$LEGACY_HTTP"
          echo "ROOT_SITE_HTTP=$ROOT_HTTP"

          PROBE_BODY="$(mktemp)"
          PROBE_HTTP="$(curl -sS -o "$PROBE_BODY" -w '%{http_code}' --max-time 30 "https://plan-ex.ru/erpv2/${PROBE_NAME}?token=${TOKEN}" || printf '000')"
          echo "WEB_PROBE_HTTP=$PROBE_HTTP"
          cat "$PROBE_BODY"
          WEB_VERSION="$(sed -n 's/^PHP_VERSION=//p' "$PROBE_BODY" | head -n1)"
          WEB_SAPI="$(sed -n 's/^PHP_SAPI=//p' "$PROBE_BODY" | head -n1)"
          OPCACHE_RESET="$(sed -n 's/^OPCACHE_RESET=//p' "$PROBE_BODY" | head -n1)"
          WEB_ERROR_LOG="$(sed -n 's/^WEB_ERROR_LOG=//p' "$PROBE_BODY" | head -n1)"
          WEB_INI_LOADED="$(sed -n 's/^WEB_INI_LOADED=//p' "$PROBE_BODY" | head -n1)"
          printf 'WEB_ERROR_LOG_PATH=%s\nWEB_INI_LOADED_PATH=%s\n' "$WEB_ERROR_LOG" "$WEB_INI_LOADED"
          rm -f "$PROBE_BODY"

          LOGIN_HTTP="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login || printf '000')"
          echo "LOGIN_HTTP_AFTER_WEB_OPCACHE_RESET=$LOGIN_HTTP"

          echo 'WASTE_WEB_ERROR_EVIDENCE_BEGIN'
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_runtime_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "SERVER_ROOT='$SERVER_ROOT' WEB_ERROR_LOG='$WEB_ERROR_LOG' MARKER='erpv2_waste_log_probe_${GITHUB_RUN_ID}' bash -se" <<'REMOTE'
          set -euo pipefail
          ACCOUNT_ROOT="$(dirname "$SERVER_ROOT")"
          chosen=''
          if [ -n "$WEB_ERROR_LOG" ] && [ "$WEB_ERROR_LOG" != 'syslog' ] && [ "${WEB_ERROR_LOG#/}" != "$WEB_ERROR_LOG" ] && [ -r "$WEB_ERROR_LOG" ]; then
            case "$WEB_ERROR_LOG" in "$ACCOUNT_ROOT"/*) chosen="$WEB_ERROR_LOG" ;; esac
          fi
          if [ -z "$chosen" ]; then
            while IFS= read -r candidate; do
              if [ -r "$candidate" ] && grep -Fq "$MARKER" "$candidate" 2>/dev/null; then chosen="$candidate"; break; fi
            done < <(find "$ACCOUNT_ROOT" -maxdepth 5 -type f -mmin -5 -size -20M -print 2>/dev/null | head -n 80)
          fi
          if [ -n "$chosen" ]; then
            printf 'WEB_ERROR_LOG_RESOLVED=%s\n' "$chosen"
            grep -F 'WT-260909-173446-777F2F' "$chosen" 2>/dev/null | tail -n 10 || true
            grep -F 'legacy_id=246' "$chosen" 2>/dev/null | grep 'waste_trip_write_failure' | tail -n 20 || true
          else
            echo 'WEB_ERROR_LOG_RESOLVED=NO'
          fi
          REMOTE
          echo 'WASTE_WEB_ERROR_EVIDENCE_END'

          if [ "$STATIC_HTTP" != 200 ] || [ "$ASSET_HTTP" != 200 ] || [ "$PROBE_HTTP" != 200 ] || [ "$LOGIN_HTTP" != 200 ]; then
            echo '::group::ERPv2 bounded web-server diagnostic'
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_runtime_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "SERVER_ROOT='$SERVER_ROOT' LIVE_DIR='$LIVE_DIR' PROBE_NAME='$PROBE_NAME' STATIC_NAME='$STATIC_NAME' bash -se" <<'REMOTE'
          set +e
          LIVE="$SERVER_ROOT/$LIVE_DIR/erpv2"
          ACCOUNT_ROOT="$(dirname "$SERVER_ROOT")"
          echo 'ERPV2_WEB_SERVER_DIAGNOSTIC_BEGIN'
          stat -c 'PATH_MODE=%a PATH_OWNER=%U:%G PATH_MTIME=%y PATH=%n' \
            "$SERVER_ROOT/$LIVE_DIR" "$LIVE" "$LIVE/.htaccess" "$LIVE/public" "$LIVE/public/index.php" "$LIVE/public/$PROBE_NAME" "$LIVE/public/$STATIC_NAME" 2>/dev/null || true
          for htaccess in "$SERVER_ROOT/$LIVE_DIR/.htaccess" "$LIVE/.htaccess" "$LIVE/public/.htaccess"; do
            if [ -r "$htaccess" ]; then
              printf 'HTACCESS=%s SHA256=%s\n' "$htaccess" "$(sha256sum "$htaccess" | awk '{print $1}')"
              grep -Ein 'php|handler|cgi|fcgi|rewrite|error|index|options|require|allow|deny' "$htaccess" 2>/dev/null | head -n 100 || true
            fi
          done
          echo 'PHP_WEB_CONFIG_BEGIN'
          for base in "$ACCOUNT_ROOT" "$SERVER_ROOT/$LIVE_DIR" "$LIVE" "$LIVE/public"; do
            for cfg in "$base/.user.ini" "$base/php.ini" "$base/.phpversion" "$base/.php-version"; do
              if [ -r "$cfg" ]; then
                printf 'PHP_WEB_CONFIG=%s MODE=%s SHA256=%s\n' "$cfg" "$(stat -c '%a' "$cfg" 2>/dev/null)" "$(sha256sum "$cfg" | awk '{print $1}')"
                grep -Ein 'php|version|handler|cgi|fcgi|auto_prepend|auto_append|error_log|opcache|session|extension|zend' "$cfg" 2>/dev/null | head -n 80 || true
              fi
            done
          done
          echo 'PHP_WEB_CONFIG_END'
          echo 'RECENT_SERVER_ERROR_EVIDENCE_BEGIN'
          find "$ACCOUNT_ROOT" -maxdepth 5 -type f \( -iname 'error_log' -o -iname '*error*.log' -o -iname '*php*.log' -o -iname '*apache*.log' -o -iname '*cgi*.log' \) -mmin -30 -print 2>/dev/null | head -n 12 | while IFS= read -r log_file; do
            printf 'ERROR_LOG_CANDIDATE=%s\n' "$log_file"
            tail -n 200 "$log_file" 2>/dev/null | grep -Ei 'erpv2|_p07_runtime|_p07_static|internal redirect|AH[0-9]+|premature|script headers|permission denied|primary script|php|cgi|fastcgi|fcgi' | tail -n 80 || true
          done
          echo 'RECENT_SERVER_ERROR_EVIDENCE_END'
          echo 'ERPV2_WEB_SERVER_DIAGNOSTIC_END'
          REMOTE
            echo '::endgroup::'
          fi

          printf 'probe_http=%s\nstatic_http=%s\nasset_http=%s\nlegacy_http=%s\nroot_http=%s\nweb_version=%s\nweb_sapi=%s\nopcache_reset=%s\nlogin_http=%s\n' \
            "$PROBE_HTTP" "$STATIC_HTTP" "$ASSET_HTTP" "$LEGACY_HTTP" "$ROOT_HTTP" "$WEB_VERSION" "$WEB_SAPI" "$OPCACHE_RESET" "$LOGIN_HTTP" >> "$GITHUB_OUTPUT"
          cleanup
          trap - EXIT

          test "$STATIC_HTTP" = 200
          test "$ASSET_HTTP" = 200
          test "$PROBE_HTTP" = 200
          test "$LOGIN_HTTP" = 200
          test -n "$WEB_VERSION"
          test -n "$WEB_SAPI"
          echo "ERPv2 observed web runtime: PHP $WEB_VERSION ($WEB_SAPI)"

      - name: Assert diagnostic cleanup and login health
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          LOGIN_HTTP: ${{ steps.probe.outputs.login_http }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/erpv2_runtime_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "test ! -e '$SERVER_ROOT/${LIVE_DIR}/erpv2/public/_p07_runtime_${GITHUB_RUN_ID}.php' && test ! -e '$SERVER_ROOT/${LIVE_DIR}/erpv2/public/_p07_static_${GITHUB_RUN_ID}.txt'"
          test "$LOGIN_HTTP" = 200
          echo 'ERPV2_WEB_RUNTIME_DIAGNOSTIC=PASS'

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/erpv2_runtime_diag_key"
