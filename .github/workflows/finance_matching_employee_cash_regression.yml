name: Finance Employee Direct Regression

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/Service/FinanceMatchingRuleEmployeeExecutionTrait.php'
      - 'app/Service/FinanceEmployee*'
      - 'app/Http/Controllers/Company/FinanceEmployeeDirectActions/**'
      - 'app/View/partials/company_finance_matching_rule_form.php'
      - 'app/View/partials/company_finance_employee_ledger_editor.php'
      - 'app/Http/Routes/company_finance_cash.php'
      - 'database/migrations-local/076_*'
      - 'tests/finance_matching_employee_cash_test.php'
      - 'tests/finance_employee_transfer_test.php'
      - 'tests/finance_employee_ledger_editing_regression_test.php'
      - 'tests/finance_matching_classification_test.php'
      - '.github/workflows/finance_matching_employee_cash_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-employee-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Existing matching semantics
        run: php tests/finance_matching_classification_test.php
      - name: Employee direct architecture
        run: php tests/finance_matching_employee_cash_test.php
      - name: Employee transfer compatibility
        run: php tests/finance_employee_transfer_test.php
      - name: Employee ledger editing lifecycle
        run: php tests/finance_employee_ledger_editing_regression_test.php
      - name: Tenant migration shape
        run: |
          set -euo pipefail
          test -f database/migrations-local/076_finance_employee_money_accounts.sql
          grep -q 'finance_employee_money_accounts' database/migrations-local/076_finance_employee_money_accounts.sql
          test ! -f database/migrations/20260818_finance_employee_money_accounts.sql
      - name: No active retired-account writes
        run: |
          set -euo pipefail
          ! grep -q 'FinanceCashController' app/Http/Routes/company_finance_cash.php
          grep -q 'Этот устаревший способ операции отключён' app/Http/Routes/company_finance_cash.php
          ! grep -q 'INSERT INTO finance_cash_resolutions' app/Service/FinanceEmployeeBankSettlementService.php
          ! grep -q 'INSERT INTO finance_cash_resolutions' app/Service/FinanceEmployeeDirectTransferService.php
          ! grep -q 'finance_cash_resolutions' app/Service/FinanceEmployeeDirectTransferEditService.php
          ! grep -q 'finance_cash_resolutions' app/Service/FinanceEmployeeClientReceiptEditService.php
