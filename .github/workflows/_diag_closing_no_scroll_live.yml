name: DIAG Closing No Scroll Live

on:
  push:
    branches:
      - diag/closing-no-scroll-live-20260823
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/_diag_closing_no_scroll_live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Wait exact live marker and verify no-scroll contract
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: ba71512df4dfa375bd483b883546d032393a27b1
        run: |
          set -euo pipefail
          for n in $(seq 1 72); do
            marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt" 2>/dev/null || true)"
            echo "live_marker=$marker"
            if [ "$marker" = "$EXPECTED_SHA" ]; then break; fi
            if [ "$n" -eq 72 ]; then echo 'Timed out waiting for deploy marker' >&2; exit 1; fi
            sleep 10
          done
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'set -euo pipefail
            f=/home/s/spugovxsim/planexp/public_html/erpv2/app/View/pages/company_finance_closing_documents.php
            grep -q "closing-documents-table" "$f"
            grep -q "table-layout:fixed" "$f"
            grep -q "min-width:0!important" "$f"
            grep -q "overflow-x:hidden" "$f"
            grep -q "<colgroup>" "$f"
            echo LIVE_CLOSING_NO_SCROLL_CONTRACT=PASS'
      - name: Live controller render
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/usr/bin/php8.5 -d display_errors=1 -r '
            chdir(\"/home/s/spugovxsim/planexp/public_html/erpv2\");
            \$config=require \"bootstrap/app.php\";
            require \"app/Support/entrypoint_dependencies.php\";
            require \"app/Http/Controllers/Company/ClosingDocumentsController.php\";
            \$_SESSION=[\"user_id\"=>1,\"role_code\"=>\"company_owner\",\"company_id\"=>25];
            \$_SERVER[\"REQUEST_METHOD\"]=\"GET\";
            \$_SERVER[\"REQUEST_URI\"]=\"/erpv2/company/finance/closing-documents\";
            \$db=new \\App\\Core\\Database(\$config[\"database\"]);
            ob_start(); (new \\App\\Http\\Controllers\\Company\\ClosingDocumentsController(\$config,\$db))->index(); \$html=ob_get_clean();
            if(strpos(\$html,\"closing-documents-table\")===false||strpos(\$html,\"table-layout:fixed\")===false) exit(9);
            echo \"LIVE_CLOSING_NO_SCROLL_RENDER=PASS\\n\";
          '"
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key" 2>/dev/null || true
