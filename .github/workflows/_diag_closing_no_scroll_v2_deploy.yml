name: DIAG Closing No Scroll V2 Deploy

on:
  push:
    branches:
      - diag/closing-no-scroll-v2-deploy
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/_diag_closing_no_scroll_v2_deploy.yml'

permissions:
  contents: read
  actions: write
  statuses: read

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 3877110e098a0cd6434a098e7a033a3572288482
      CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
      CONTROLLED_DEPLOY_WORKFLOW: erpv2_controlled_deploy.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact canonical HEAD
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${CANONICAL_BRANCH})" = "$TARGET_SHA"
      - name: Wait exact canonical push CI PASS
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            runs_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&event=push&per_page=20")"
            state="$(RUNS_JSON="$runs_json" TARGET_SHA="$TARGET_SHA" CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY'
import json, os
runs=json.loads(os.environ['RUNS_JSON']).get('workflow_runs',[])
sha=os.environ['TARGET_SHA']; branch=os.environ['CANONICAL_BRANCH']
m=[r for r in runs if r.get('head_sha')==sha and r.get('head_branch')==branch and r.get('event')=='push']
if not m: print('WAIT')
else:
 r=max(m,key=lambda x:x.get('run_number',0))
 if r.get('status')!='completed': print('WAIT')
 elif r.get('conclusion')=='success': print('PASS:'+str(r.get('id'))+':'+str(r.get('run_number')))
 else: print('FAIL:'+str(r.get('id'))+':'+str(r.get('conclusion')))
PY
)"
            echo "$state"
            case "$state" in PASS:*) break;; FAIL:*) exit 1;; esac
            test "$attempt" -lt 72 || exit 1
            sleep 10
          done
      - name: Dispatch guarded controlled deploy if no success status exists
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          statuses="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL/repos/$REPOSITORY/commits/$TARGET_SHA/status")"
          current="$(STATUSES="$statuses" python3 - <<'PY'
import json, os
s=json.loads(os.environ['STATUSES']).get('statuses',[])
for x in s:
 if x.get('context')=='erpv2/deploy':
  print(x.get('state','')); break
PY
)"
          echo "current_deploy_status=${current:-none}"
          if [ "$current" != success ] && [ "$current" != pending ]; then
            payload="$(TARGET_SHA="$TARGET_SHA" CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY'
import json, os
print(json.dumps({'ref':os.environ['CANONICAL_BRANCH'],'inputs':{'source_sha':os.environ['TARGET_SHA'],'confirm_deploy':'DEPLOY_ERPV2'}}))
PY
)"
            code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL/repos/$REPOSITORY/actions/workflows/$CONTROLLED_DEPLOY_WORKFLOW/dispatches" -d "$payload")"
            test "$code" = 204
          fi
      - name: Wait deploy success status
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            statuses="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL/repos/$REPOSITORY/commits/$TARGET_SHA/status")"
            current="$(STATUSES="$statuses" python3 - <<'PY'
import json, os
for x in json.loads(os.environ['STATUSES']).get('statuses',[]):
 if x.get('context')=='erpv2/deploy':
  print(x.get('state','')); break
PY
)"
            echo "deploy_status=${current:-none}"
            [ "$current" = success ] && break
            [ "$current" != failure ] && [ "$current" != error ] || exit 1
            test "$attempt" -lt 90 || exit 1
            sleep 10
          done
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Verify live marker and structural no-scroll contract
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt")"
          echo "live_marker=$marker"
          test "$marker" = "$TARGET_SHA"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'set -euo pipefail
            f=/home/s/spugovxsim/planexp/public_html/erpv2/app/View/pages/company_finance_closing_documents.php
            grep -q "closing-documents-table-frame" "$f"
            grep -q "white-space:normal!important" "$f"
            ! grep -q "class=\"table-scroll\"" "$f"
            echo LIVE_CLOSING_V2_STRUCTURAL_NO_SCROLL=PASS'
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key" 2>/dev/null || true
