name: DIAG Closing No Scroll V2 Deploy

on:
  push:
    branches:
      - diag/closing-no-scroll-v2-deploy

permissions:
  contents: read
  actions: write
  statuses: read

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 3877110e098a0cd6434a098e7a033a3572288482
      VERIFIED_PR_SHA: a379e90abea2e0cbee1ebdf0aa664e2d75df82f3
      CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
      ERP_CI_RUN: '32629036169'
      CLOSING_REGRESSION_RUN: '32629036222'
      CONTROLLED_DEPLOY_WORKFLOW: erpv2_controlled_deploy.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical head and tree equivalence to tested PR head
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}"
          git fetch --no-tags origin "$TARGET_SHA" "$VERIFIED_PR_SHA"
          test "$(git rev-parse refs/remotes/origin/${CANONICAL_BRANCH})" = "$TARGET_SHA"
          test "$(git rev-parse ${TARGET_SHA}^{tree})" = "$(git rev-parse ${VERIFIED_PR_SHA}^{tree})"
          git diff --quiet "$TARGET_SHA" "$VERIFIED_PR_SHA"
          echo TESTED_TREE_EQUALS_CANONICAL_TREE=PASS
      - name: Verify exact pre-merge CI runs are green
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run_id in "$ERP_CI_RUN" "$CLOSING_REGRESSION_RUN"; do
            json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL/repos/$REPOSITORY/actions/runs/$run_id")"
            RUN_JSON="$json" VERIFIED_PR_SHA="$VERIFIED_PR_SHA" python3 - <<'PY'
import json, os, sys
r=json.loads(os.environ['RUN_JSON'])
if r.get('head_sha') != os.environ['VERIFIED_PR_SHA'] or r.get('status') != 'completed' or r.get('conclusion') != 'success':
    print(r); sys.exit(1)
print(f"VERIFIED_RUN_PASS={r.get('name')}#{r.get('run_number')}")
PY
          done
      - name: Dispatch existing guarded controlled deploy
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$(TARGET_SHA="$TARGET_SHA" CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY'
import json, os
print(json.dumps({'ref':os.environ['CANONICAL_BRANCH'],'inputs':{'source_sha':os.environ['TARGET_SHA'],'confirm_deploy':'DEPLOY_ERPV2'}}))
PY
)"
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL/repos/$REPOSITORY/actions/workflows/$CONTROLLED_DEPLOY_WORKFLOW/dispatches" -d "$payload")"
          test "$code" = 204
          echo CONTROLLED_DEPLOY_DISPATCHED=PASS
      - name: Wait deploy success
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL/repos/$REPOSITORY/commits/$TARGET_SHA/status")"
            state="$(STATUS_JSON="$json" python3 - <<'PY'
import json, os
for s in json.loads(os.environ['STATUS_JSON']).get('statuses',[]):
    if s.get('context') == 'erpv2/deploy':
        print(s.get('state','')); break
PY
)"
            echo "deploy_status=${state:-none}"
            [ "$state" = success ] && break
            [ "$state" != failure ] && [ "$state" != error ] || exit 1
            test "$attempt" -lt 90 || exit 1
            sleep 10
          done
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Verify live production structural fit-width contract
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt")"
          echo "live_marker=$marker"
          test "$marker" = "$TARGET_SHA"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'set -euo pipefail
            f=/home/s/spugovxsim/planexp/public_html/erpv2/app/View/pages/company_finance_closing_documents.php
            grep -q "closing-documents-table-frame" "$f"
            grep -q "white-space:normal!important" "$f"
            ! grep -q "class=\"table-scroll\"" "$f"
            echo LIVE_CLOSING_V2_STRUCTURAL_NO_SCROLL=PASS'
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/key" 2>/dev/null || true
