name: Roles Access Production Functional Acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current canonical SHA already deployed to /erpv2
        required: true
        type: string
  push:
    branches:
      - qa/roles-access-functional-agent

permissions:
  contents: read
  statuses: write

concurrency:
  group: roles-access-production-functional-acceptance
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  QA_TRIGGER_BRANCH: qa/roles-access-functional-agent
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
  RESULT_DIR: roles_access_functional_acceptance_result
  LIVE_PARENT: /home/s/spugovxsim/planexp/public_html
  APP_DIR: erpv2

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Require exact canonical and exact deployed SHA
        shell: bash
        env:
          SHA: ${{ env.SOURCE_SHA }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$EVENT_NAME" = push ]; then
            test "$REF_NAME" = "$QA_TRIGGER_BRANCH"
          else
            test "$EVENT_NAME" = workflow_dispatch
          fi
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')" = "$SHA"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/roles_functional"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/roles_functional" "$HOME/.ssh/known_hosts"
          marker="$(ssh -p "$PORT" -i "$HOME/.ssh/roles_functional" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$marker" = "$SHA"
          echo "EXACT_CANONICAL_DEPLOYED_SHA=$SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Provision isolated temporary QA owner identity and responsibility fixture
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/tmp/roles_access_func_identity_${GITHUB_RUN_ID}.php"
          scp -P "$PORT" -i "$HOME/.ssh/roles_functional" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            .github/roles-access/qa_identity.php "$USER@$HOST:$remote"
          provision="$(ssh -p "$PORT" -i "$HOME/.ssh/roles_functional" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "PLANEX_ROOT='$LIVE_PARENT/$APP_DIR' QA_RUN_ID='$GITHUB_RUN_ID' /usr/bin/php8.5 '$remote' create")"
          cred="$(printf '%s\n' "$provision" | sed -n 's/^QA_CREDENTIALS_B64=//p')"
          foreign="$(printf '%s\n' "$provision" | sed -n 's/^QA_FOREIGN_MEMBERSHIP_ID=//p')"
          owner_user="$(printf '%s\n' "$provision" | sed -n 's/^QA_OWNER_TENANT_USER_ID=//p')"
          dynamic_membership="$(printf '%s\n' "$provision" | sed -n 's/^QA_DYNAMIC_MEMBERSHIP_ID=//p')"
          dynamic_user="$(printf '%s\n' "$provision" | sed -n 's/^QA_DYNAMIC_TENANT_USER_ID=//p')"
          contractor_id="$(printf '%s\n' "$provision" | sed -n 's/^QA_CONTRACTOR_ID=//p')"
          test -n "$cred"
          [[ "$foreign" =~ ^[1-9][0-9]*$ ]]
          [[ "$owner_user" =~ ^[1-9][0-9]*$ ]]
          [[ "$dynamic_membership" =~ ^[1-9][0-9]*$ ]]
          [[ "$dynamic_user" =~ ^[1-9][0-9]*$ ]]
          [[ "$contractor_id" =~ ^[1-9][0-9]*$ ]]
          printf '%s\n' "$provision" | grep -q '^QA_IDENTITY_CREATED=YES$'
          printf '%s\n' "$provision" | grep -q '^QA_DYNAMIC_RECIPIENT_READY=YES$'
          printf '%s\n' "$provision" | grep -q '^QA_TENANT_PROJECTIONS_READY=YES$'
          printf '%s\n' "$provision" | grep -q '^QA_CONTRACTOR_FIXTURE_READY=YES$'
          printf '%s\n' "$provision" | grep -q '^QA_RESPONSIBILITY_FIXTURE_READY=YES$'
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
          echo "QA_FOREIGN_MEMBERSHIP_ID=$foreign" >> "$GITHUB_ENV"
          echo "QA_OWNER_TENANT_USER_ID=$owner_user" >> "$GITHUB_ENV"
          echo "QA_DYNAMIC_MEMBERSHIP_ID=$dynamic_membership" >> "$GITHUB_ENV"
          echo "QA_DYNAMIC_TENANT_USER_ID=$dynamic_user" >> "$GITHUB_ENV"
          echo "QA_CONTRACTOR_ID=$contractor_id" >> "$GITHUB_ENV"
          echo 'QA_TEMP_OWNER_PROVISIONED=YES'

      - name: Run authenticated reversible production acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -n "${P12_CREDENTIALS_B64:-}"
          [[ "${QA_FOREIGN_MEMBERSHIP_ID:-}" =~ ^[1-9][0-9]*$ ]]
          [[ "${QA_OWNER_TENANT_USER_ID:-}" =~ ^[1-9][0-9]*$ ]]
          [[ "${QA_DYNAMIC_MEMBERSHIP_ID:-}" =~ ^[1-9][0-9]*$ ]]
          [[ "${QA_DYNAMIC_TENANT_USER_ID:-}" =~ ^[1-9][0-9]*$ ]]
          [[ "${QA_CONTRACTOR_ID:-}" =~ ^[1-9][0-9]*$ ]]
          node .github/roles-access/production_functional_acceptance.js | tee roles_access_production_functional_acceptance.txt

      - name: Cleanup temporary QA owner identity and responsibility fixture
        if: always()
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/tmp/roles_access_func_identity_${GITHUB_RUN_ID}.php"
          scp -P "$PORT" -i "$HOME/.ssh/roles_functional" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            .github/roles-access/qa_identity.php "$USER@$HOST:$remote"
          ssh -p "$PORT" -i "$HOME/.ssh/roles_functional" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "PLANEX_ROOT='$LIVE_PARENT/$APP_DIR' QA_RUN_ID='$GITHUB_RUN_ID' /usr/bin/php8.5 '$remote' cleanup" | tee roles_access_identity_cleanup.txt
          grep -q '^QA_RESPONSIBILITY_FIXTURE_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_CONTRACTOR_FIXTURE_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_TENANT_PROJECTION_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_DYNAMIC_RECIPIENT_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_TEMP_ROLE_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_IDENTITY_RESIDUE=0$' roles_access_identity_cleanup.txt

      - name: Require complete functional evidence
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            REAL_LOGIN=PASS \
            DEFAULT_LANDING=PASS \
            EFFECTIVE_MENU=PASS \
            ROLES_ACCESS=PASS \
            ROLES_READBACK=PASS \
            PERSONAL_OVERRIDES_READBACK=PASS \
            PERSONAL_OVERRIDES_RESTORE=PASS \
            ASSIGNMENTS_TAB=PASS \
            RESPONSIBLE_ASSIGNMENTS=PASS \
            RESPONSIBILITY_RECIPIENT_SCOPE=PASS \
            DYNAMIC_RESPONSIBILITY_RECIPIENT=PASS \
            RESPONSIBILITY_TRANSFER=PASS \
            RESPONSIBILITY_BACKEND_READBACK=PASS \
            RESPONSIBILITY_RESTORE=PASS \
            QA_RESIDUE=0 \
            CROSS_COMPANY_LEAKAGE=NO \
            PRODUCTION_FUNCTIONAL_ACCEPTANCE=PASS; do
            grep -q "^${marker}$" roles_access_production_functional_acceptance.txt
          done
          grep -q '^QA_RESPONSIBILITY_FIXTURE_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_CONTRACTOR_FIXTURE_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_TENANT_PROJECTION_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_DYNAMIC_RECIPIENT_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_TEMP_ROLE_RESIDUE=0$' roles_access_identity_cleanup.txt
          grep -q '^QA_IDENTITY_RESIDUE=0$' roles_access_identity_cleanup.txt

      - name: Publish exact-SHA functional acceptance status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ env.SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=success \
            -f context=erpv2/roles-access-functional \
            -f description='Production functional acceptance verified'

      - name: Cleanup SSH material
        if: always()
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          if [ -s "$HOME/.ssh/roles_functional" ]; then
            ssh -p "$PORT" -i "$HOME/.ssh/roles_functional" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "rm -f '/tmp/roles_access_func_identity_${GITHUB_RUN_ID}.php'" || true
          fi
          rm -f "$HOME/.ssh/roles_functional"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roles_access_functional_${{ env.SOURCE_SHA }}
          path: |
            roles_access_production_functional_acceptance.txt
            roles_access_functional_acceptance_result/
            roles_access_identity_cleanup.txt
          if-no-files-found: warn
          retention-days: 30
