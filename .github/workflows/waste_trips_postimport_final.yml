name: Waste Trips Post-Import Final Verification

on:
  push:
    branches:
      - qa/waste-trips-postimport-final-20260902
    paths:
      - '.github/waste-trips-postimport-final.php'
      - '.github/workflows/waste_trips_postimport_final.yml'

permissions:
  contents: read

env:
  EXPECTED_SHA: 0a72245c22164d0cfd88d5be45a5ff2327ee5d49
  LIVE_ROOT: /home/s/${{ secrets.ERPV2_SSH_USER }}/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/${{ secrets.ERPV2_SSH_USER }}/planexp/deploy/P07_erpv2_deployed_commit.txt

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate exact canonical and read-only probe
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/waste-trips-postimport-final.php
          grep -Fq 'SET SESSION TRANSACTION READ ONLY' .github/waste-trips-postimport-final.php
          grep -Fq 'START TRANSACTION READ ONLY' .github/waste-trips-postimport-final.php
          if grep -Eq '\b(INSERT|UPDATE|DELETE|REPLACE|TRUNCATE|ALTER|DROP|CREATE)\b' .github/waste-trips-postimport-final.php; then
            echo 'unexpected write SQL token in post-import probe' >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/chatgpt/production-stabilization-20260802:refs/remotes/origin/canonical"
          test "$(git rev-parse refs/remotes/origin/canonical)" = "$EXPECTED_SHA"
          echo "WASTE_POSTIMPORT_CANONICAL=PASS sha=$EXPECTED_SHA"

      - name: Public auth guard
        shell: bash
        run: |
          set -euo pipefail
          for path in /company/trips/departures /company/trips/departures/import; do
            safe="$(printf '%s' "$path" | tr '/' '_')"
            code="$(curl -sS -o "/tmp/${safe}.html" -D "/tmp/${safe}.headers" -w '%{http_code}' --max-time 30 "https://plan-ex.ru/erpv2${path}")"
            test "$code" = 302
            grep -Eqi '^location: .*/erpv2/login([?[:space:]]|$)' "/tmp/${safe}.headers"
          done
          echo 'WASTE_POSTIMPORT_AUTH_GUARD=PASS'

      - name: Configure SSH
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Run independent read-only production verification
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/waste_postimport_final_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes .github/waste-trips-postimport-final.php "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' EXPECTED_SHA='$EXPECTED_SHA' DEPLOY_MARKER='$DEPLOY_MARKER' /usr/bin/php8.5 '$remote'" | tee postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_COUNTS=PASS trips=75 links=961 import_audits=75 audit_log=75' postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_CLIENT=PASS id=6 inn=4714004270' postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_IDENTITY=PASS legacy_flights=75 distinct_feo=828' postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_DISTRIBUTIONS=PASS statuses=65/1/3/6 destinations=68/7 planning=6/69' postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_PARTIAL_PLAN=PASS normalized=15 complete_ranges=6 invalid_unspecified=0' postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_MASS_EVIDENCE=PASS flight257=-145.000 flight258=-152.000' postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_AUDIT=PASS rows=75 snapshot_links=961 payloads=75' postimport-final.txt
          grep -Eq '^WASTE_POSTIMPORT_SERVICE_RUNTIME=PASS fetchTrips=75 historical_labels=[1-9][0-9]*$' postimport-final.txt
          grep -Eq '^WASTE_POSTIMPORT_OPERATIONAL_ISOLATION=PASS sample=.+$' postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_ACTOR_AUDIT=PASS imports=75 user=1 role=logist' postimport-final.txt
          grep -Fqx "WASTE_POSTIMPORT_MARKER=PASS sha=$EXPECTED_SHA" postimport-final.txt
          grep -Fqx 'WASTE_POSTIMPORT_FINAL=PASS' postimport-final.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waste-trips-postimport-final-${{ env.EXPECTED_SHA }}
          path: postimport-final.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup
        if: always()
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '/tmp/waste_postimport_final_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/key"
