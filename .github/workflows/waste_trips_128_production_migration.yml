name: Waste Trips 128 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing Waste Trips migration 128 tooling'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_WASTE_TRIPS_128 to authorize production migration 128'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: waste-trips-128-production-migration
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2

jobs:
  migrate-128:
    if: ${{ inputs.confirm_migration == 'APPLY_WASTE_TRIPS_128' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Validate exact source and tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          php -l scripts/waste_trips_apply_128.php
          php -l scripts/waste_trips_verify_128.php
          php tests/waste_trips_128_production_migration_contract_test.php
          php tests/agent_db_migration_request_contract_test.php
          test -s database/migrations-local/128_create_waste_trips.sql

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - > /tmp/payload.json <<'PY'
          import json
          print(json.dumps({'state':'pending','context':'erpv2/migration128','description':'Waste Trips migration 128 in progress'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Upload isolated migration tooling
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/waste_trips_verify_128.php "$SSH_USER@$SSH_HOST:/tmp/waste_verify128_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/waste_trips_apply_128.php "$SSH_USER@$SSH_HOST:/tmp/waste_apply128_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            database/migrations-local/128_create_waste_trips.sql "$SSH_USER@$SSH_HOST:/tmp/waste_128_${GITHUB_RUN_ID}.sql"

      - name: Snapshot before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/waste_verify128_${GITHUB_RUN_ID}.php'" | tee waste128_before.txt
          grep -q 'WASTE_128_READ_ONLY_OK' waste128_before.txt

      - name: Apply tenant migration 128
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TENANT_MIGRATION_PATH='/tmp/waste_128_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/waste_apply128_${GITHUB_RUN_ID}.php'" | tee waste128_migration.txt
          grep -q 'WASTE_128_OK' waste128_migration.txt

      - name: Snapshot after and verify invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/waste_verify128_${GITHUB_RUN_ID}.php'" | tee waste128_after.txt
          grep -q 'WASTE_128_READ_ONLY_OK' waste128_after.txt
          python3 - "$(sed -n 's/^WASTE_128_SNAPSHOT=//p' waste128_before.txt)" "$(sed -n 's/^WASTE_128_SNAPSHOT=//p' waste128_after.txt)" <<'PY'
          import json, sys
          before, after = map(json.loads, sys.argv[1:3])
          if before['central'] != after['central']:
              raise SystemExit('control-plane snapshot changed during tenant migration')
          b = {x['company_id']: x for x in before['tenants']}
          a = {x['company_id']: x for x in after['tenants']}
          if set(b) != set(a):
              raise SystemExit('active tenant set changed during migration')
          stable = ('db','clients','users','crews','feo_requests','feo_utilizers','migration_127')
          flags = ('waste_trips_table','waste_trip_requests_table','waste_trip_legacy_import_audits_table','waste_trip_audit_log_table')
          counts = ('waste_trips','waste_trip_requests','waste_trip_legacy_import_audits','waste_trip_audit_log')
          for cid, row in a.items():
              old = b[cid]
              if old['migration_127'] != 1 or row['migration_127'] != 1:
                  raise SystemExit(f'company {cid}: migration 127 prerequisite missing')
              if row['migration_128'] != 1:
                  raise SystemExit(f'company {cid}: migration 128 journal missing')
              for key in stable:
                  if row[key] != old[key]:
                      raise SystemExit(f'company {cid}: stable value changed for {key}')
              for key in flags:
                  if row[key] != 1:
                      raise SystemExit(f'company {cid}: Waste Trips schema missing for {key}')
              if old['migration_128'] == 1:
                  for key in counts:
                      if row[key] != old[key]:
                          raise SystemExit(f'company {cid}: idempotent rerun changed {key}')
              else:
                  for key in flags:
                      if old[key] != 0:
                          raise SystemExit(f'company {cid}: unjournaled Waste Trips schema existed before migration')
                  for key in counts:
                      if old[key] != 0 or row[key] != 0:
                          raise SystemExit(f'company {cid}: migration unexpectedly created business rows in {key}')
          print('WASTE_128_INVARIANTS_OK')
          PY

      - name: HTTP acceptance
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waste_trips_128_production_migration_${{ inputs.source_sha }}
          path: |
            waste128_before.txt
            waste128_migration.txt
            waste128_after.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Waste Trips migration 128 verified'; else state=failure; desc='Waste Trips migration 128 failed'; fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json, sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/migration128','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/waste_verify128_${GITHUB_RUN_ID}.php' '/tmp/waste_apply128_${GITHUB_RUN_ID}.php' '/tmp/waste_128_${GITHUB_RUN_ID}.sql'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/key"
