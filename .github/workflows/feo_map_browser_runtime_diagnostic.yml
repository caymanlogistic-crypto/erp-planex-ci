name: FEO Map Browser Runtime Diagnostic

on:
  push:
    branches:
      - agent/feo-map-runtime-diagnostic-20260830
    paths:
      - .github/workflows/feo_map_browser_runtime_diagnostic.yml

permissions:
  contents: read

jobs:
  browser-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Create temporary logist QA session
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          REMOTE="/tmp/feo_map_browser_diag_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes .github/feo-map-stage1/qa_session.php "$SSH_USER@$SSH_HOST:$REMOTE"
          OUT=$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT=\"\$HOME/planexp/public_html/erpv2\" /usr/bin/php8.5 '$REMOTE' create logist")
          JSON=${OUT#QA_SESSION=}
          python3 - "$JSON" "$GITHUB_ENV" <<'PY'
          import json,sys
          obj=json.loads(sys.argv[1])
          for key in ('sid','csrf'):
              print(f'::add-mask::{obj[key]}')
          with open(sys.argv[2],'a') as f:
              f.write(f"QA_COOKIE_NAME={obj['cookie']}\nQA_SESSION_ID={obj['sid']}\n")
          PY
      - name: Inspect production marker overlay DOM
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1920,height:1080}});
            await c.addCookies([{name:process.env.QA_COOKIE_NAME,value:process.env.QA_SESSION_ID,domain:'plan-ex.ru',path:'/',secure:true,httpOnly:true,sameSite:'Lax'}]);
            const p=await c.newPage();
            const res=await p.goto('https://plan-ex.ru/erpv2/company/feo/requests/map',{waitUntil:'domcontentloaded',timeout:60000});
            if(!res||res.status()!==200) throw new Error('map HTTP != 200');
            await p.locator('#feo-map-page[data-map-ready="1"][data-map-engine="yandex"]').waitFor({state:'attached',timeout:60000});
            await p.waitForTimeout(500);
            const out=await p.evaluate(()=>{
              const root=document.getElementById('feo-map');
              const all=[...root.querySelectorAll('*')];
              const svgLike=all.filter(el=>{
                const s=(el.getAttribute('style')||'')+' '+(el.getAttribute('src')||'')+' '+(el.getAttribute('href')||'');
                const cs=getComputedStyle(el);
                return /data:image\/svg\+xml/i.test(s)||/data:image\/svg\+xml/i.test(cs.backgroundImage||'');
              });
              const markerish=all.filter(el=>{
                const cls=String(el.className||'');
                const s=(el.getAttribute('style')||'')+' '+(getComputedStyle(el).backgroundImage||'');
                return /placemark|image-with-content|overlay|icon/i.test(cls)||/data:image\/svg\+xml/i.test(s);
              });
              const sample=markerish.slice(0,25).map(el=>({tag:el.tagName,cls:String(el.className||''),src:(el.getAttribute('src')||'').slice(0,180),style:(el.getAttribute('style')||'').slice(0,260),bg:(getComputedStyle(el).backgroundImage||'').slice(0,260),html:el.outerHTML.slice(0,420)}));
              const snap=window.__FEO_MAP_STAGE1__?.snapshot?.();
              return {
                imgDataSvg:root.querySelectorAll('img[src^="data:image/svg+xml"]').length,
                imgAll:root.querySelectorAll('img').length,
                inlineSvg:root.querySelectorAll('svg').length,
                svgLike:svgLike.length,
                markerish:markerish.length,
                snapMarkers:snap?.markers?.length||0,
                visible:snap?.markers?.filter(x=>x.visible).length||0,
                sample
              };
            });
            console.log('MARKER_DOM='+JSON.stringify(out));
            await b.close();
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          NODE
      - name: Cleanup temporary QA session and SSH material
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -u
          REMOTE="/tmp/feo_map_browser_diag_${GITHUB_RUN_ID}.php"
          if [ -n "${QA_SESSION_ID:-}" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT=\"\$HOME/planexp/public_html/erpv2\" /usr/bin/php8.5 '$REMOTE' delete '$QA_SESSION_ID'" || true
          fi
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE'" || true
          rm -f "$HOME/.ssh/key"
