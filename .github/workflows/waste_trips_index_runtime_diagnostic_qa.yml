name: Waste Trips Index Runtime Diagnostic QA

on:
  push:
    branches:
      - qa/waste-trips-index-diagnostic-20260912

permissions:
  contents: read

env:
  BASE_SHA: 3777ff4d607f7ca6c4d059f392be21a7e94820d1
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate diagnostic lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD

      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/waste_index_diag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/waste_index_diag" "$HOME/.ssh/known_hosts"

      - name: Isolate exact read-only registry stage
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_index_diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          marker="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$marker" = "$BASE_SHA"
          cat <<'PHP' | "${SSH[@]}" "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5" | tee waste_index_runtime.txt
          <?php
          declare(strict_types=1);
          $root=rtrim((string)getenv('PLANEX_ROOT'),'/');
          if($root===''||!is_file($root.'/bootstrap/app.php')) throw new RuntimeException('PLANEX_ROOT invalid');
          $config=require $root.'/bootstrap/app.php';
          require_once $root.'/app/Support/crypto_helper.php';
          require_once $root.'/app/Support/company_database.php';
          $opt=[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,PDO::ATTR_EMULATE_PREPARES=>false];
          $cc=$config['database'];
          $central=new PDO('mysql:host='.$cc['host'].';port='.($cc['port']??3306).';dbname='.$cc['database'].';charset=utf8mb4',$cc['username'],$cc['password'],$opt);
          $central->exec('SET SESSION TRANSACTION READ ONLY');
          $q=$central->prepare("SELECT id,name,status,db_identifier,db_host,db_port,db_username,db_password FROM companies WHERE id=25 AND status='active' LIMIT 1");
          $q->execute(); $company=$q->fetch(); if(!is_array($company)) throw new RuntimeException('company 25 unavailable');
          $tc=companyDatabaseConfig($config,$company);
          $tenant=new PDO('mysql:host='.$tc['host'].';port='.($tc['port']??3306).';dbname='.$tc['database'].';charset=utf8mb4',$tc['username'],$tc['password'],$opt);
          $tenant->exec('SET SESSION TRANSACTION READ ONLY');
          $_SESSION=['role_code'=>'company_owner','user_id'=>1,'company_id'=>25];
          $sessionUser=['role_code'=>'company_owner','user_id'=>1];
          echo "WASTE_INDEX_STAGE_DIAGNOSTIC_BEGIN\n";
          $run=static function(string $name, callable $fn): mixed {
              try { $v=$fn(); $count=is_array($v)?count($v):(is_bool($v)?($v?1:0):$v); echo 'STAGE='.$name.' PASS='.json_encode($count,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL; return $v; }
              catch(Throwable $e){ echo 'STAGE='.$name.' FAIL_CLASS='.get_class($e).' FAIL_CODE='.(string)$e->getCode().' FAIL_MESSAGE='.str_replace(["\r","\n"],' ',(string)$e->getMessage()).PHP_EOL; return null; }
          };
          $run('schema_ready',fn()=>App\Service\WasteTripService::schemaReady($tenant));
          $trips=$run('fetch_trips_finance',fn()=>App\Service\WasteTripService::fetchTrips($tenant,[],true));
          $run('customer_payment_count',fn()=>(int)$tenant->query('SELECT COUNT(*) FROM waste_trip_customer_payments')->fetchColumn());
          if(is_array($trips)) $run('customer_payment_batch',fn()=>App\Service\WasteTripCustomerPaymentService::fetchForTrips($tenant,array_column($trips,'id')));
          $run('visible_clients',fn()=>App\Service\LinearRouteService::fetchVisibleClients($tenant,$sessionUser));
          $run('visible_executors',fn()=>App\Service\LinearRouteService::fetchVisibleRouteExecutors($tenant,$sessionUser));
          $run('responsible_recipients',fn()=>App\Service\EntityResponsibilityService::eligibleRecipients($central,$tenant,25));
          $run('active_utilizers',fn()=>App\Service\WasteTripService::fetchActiveUtilizers($tenant));
          echo "WASTE_INDEX_STAGE_DIAGNOSTIC_END\n";
          PHP
          grep -q '^WASTE_INDEX_STAGE_DIAGNOSTIC_BEGIN$' waste_index_runtime.txt
          grep -q '^WASTE_INDEX_STAGE_DIAGNOSTIC_END$' waste_index_runtime.txt
          if grep -q ' FAIL_' waste_index_runtime.txt; then
            grep ' FAIL_' waste_index_runtime.txt
            exit 2
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waste-index-runtime-${{ env.BASE_SHA }}
          path: waste_index_runtime.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup local SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/waste_index_diag"
