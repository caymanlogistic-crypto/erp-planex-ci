name: FEO Placement Author Backfill Production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA already deployed to /erpv2'
        required: true
        type: string
      confirm_backfill:
        description: 'Type APPLY_FEO_PLACEMENT_AUTHOR_BACKFILL to authorize existing-block attribution to Spugov'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: erpv2-controlled-deploy
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802

jobs:
  backfill:
    if: ${{ inputs.confirm_backfill == 'APPLY_FEO_PLACEMENT_AUTHOR_BACKFILL' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate exact canonical source and task tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')" = "$SOURCE_SHA"
          php -l scripts/feo_placement_author_backfill.php
          php -l scripts/feo_placement_author_verify.php
          php -l tests/feo_placement_author_backfill_contract_test.php
          php tests/feo_placement_author_backfill_contract_test.php

      - name: Require successful exact canonical ERP PLANEX CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" > /tmp/ci-runs.json
          SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json,os
          rows=[r for r in json.load(open('/tmp/ci-runs.json')).get('workflow_runs',[]) if r.get('head_sha')==os.environ['SOURCE_SHA'] and r.get('event')=='push']
          if not rows: raise SystemExit('exact canonical ERP PLANEX CI run missing')
          run=max(rows,key=lambda r:r.get('run_number',0))
          if run.get('status')!='completed' or run.get('conclusion')!='success': raise SystemExit(f"exact canonical ERP PLANEX CI not successful: {run.get('id')} {run.get('status')} {run.get('conclusion')}")
          print(f"FEO_AUTHOR_CANONICAL_CI_PASS run={run.get('id')}")
          PY

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - > /tmp/payload.json <<'PY'
          import json
          print(json.dumps({'state':'pending','context':'erpv2/feo-placement-author-backfill','description':'FEO placement author backfill in progress'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Configure isolated SSH transport
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/feo_author_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/feo_author_key" "$HOME/.ssh/known_hosts"
          SSH_CONTROL_DIR="/tmp/feo_author_mux_${GITHUB_RUN_ID}"
          install -d -m 700 "$SSH_CONTROL_DIR"
          SSH_CONTROL_PATH="$SSH_CONTROL_DIR/%C"
          test "${#SSH_CONTROL_PATH}" -lt 90
          printf 'SSH_CONTROL_DIR=%s\nSSH_CONTROL_PATH=%s\n' "$SSH_CONTROL_DIR" "$SSH_CONTROL_PATH" >> "$GITHUB_ENV"

      - name: Require exact deployed SHA and upload task tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/feo_author_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          SCP=(scp -P "$SSH_PORT" -i "$HOME/.ssh/feo_author_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          DEPLOYED="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$DEPLOYED" = "$SOURCE_SHA"
          printf 'DEPLOYED_BEFORE=%s\n' "$DEPLOYED" >> "$GITHUB_ENV"
          "${SCP[@]}" scripts/feo_placement_author_backfill.php "$SSH_USER@$SSH_HOST:/tmp/feo_author_backfill_${GITHUB_RUN_ID}.php"
          "${SCP[@]}" scripts/feo_placement_author_verify.php "$SSH_USER@$SSH_HOST:/tmp/feo_author_verify_${GITHUB_RUN_ID}.php"
          echo 'FEO_AUTHOR_EXACT_DEPLOYED_SHA_PASS=YES'

      - name: Snapshot BEFORE
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/feo_author_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/feo_author_verify_${GITHUB_RUN_ID}.php'" | tee feo_author_before.txt
          grep -q '^FEO_AUTHOR_BACKFILL_READ_ONLY_OK$' feo_author_before.txt

      - name: Apply one-time existing-block backfill
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/feo_author_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/feo_author_backfill_${GITHUB_RUN_ID}.php'" | tee feo_author_apply.txt
          grep -q '^FEO_AUTHOR_BACKFILL_OK ' feo_author_apply.txt
          grep -qi ' login=spugov ' feo_author_apply.txt

      - name: Snapshot AFTER and verify invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/feo_author_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/feo_author_verify_${GITHUB_RUN_ID}.php'" | tee feo_author_after.txt
          grep -q '^FEO_AUTHOR_BACKFILL_READ_ONLY_OK$' feo_author_after.txt
          python3 - <<'PY'
          import json,re
          def snap(path):
              m=re.search(r'^FEO_AUTHOR_BACKFILL_SNAPSHOT=(.+)$',open(path,encoding='utf-8').read(),re.M)
              if not m: raise SystemExit(path+' snapshot missing')
              return json.loads(m.group(1))
          before,after=snap('feo_author_before.txt'),snap('feo_author_after.txt')
          stable=['target_company_id','target_db','spugov_user_id','spugov_identity_type','spugov_display_name','spugov_login','spugov_role','block_count','historical_boundary','block_request_count','current_request_count','placement_semantic_hash']
          for key in stable:
              if before[key]!=after[key]: raise SystemExit(f'invariant changed: {key}: {before[key]} -> {after[key]}')
          if after['spugov_login'].lower()!='spugov': raise SystemExit('resolved creator is not Spugov')
          if after['spugov_identity_type']!='central_company_user': raise SystemExit('Spugov identity is not central company user')
          if after['spugov_role']!='company_owner': raise SystemExit('Spugov role is not company_owner')
          if after['spugov_display_name']!='Владимир С.': raise SystemExit('Spugov display name mismatch')
          if not after['marker'] or after['marker_checksum_ok'] is not True: raise SystemExit('corrective backfill marker missing or invalid')
          if not isinstance(after['marker_boundary'],int) or after['marker_boundary']<=0: raise SystemExit('invalid corrective backfill boundary')
          if after['marker_boundary']!=after['historical_boundary']: raise SystemExit('corrective boundary changed historical scope')
          if after['historical_author_mismatch_count']!=0: raise SystemExit('historical blocks are not fully attributed to central Spugov')
          if after['ui_author_mismatch_count']!=0: raise SystemExit('historical blocks do not render as Spugov / Владимир С.')
          print('FEO_AUTHOR_BACKFILL_INVARIANTS_PASS=YES')
          print('FEO_AUTHOR_BACKFILL_SCOPE=CREATOR_FIELDS_ONLY')
          PY

      - name: HTTP acceptance and deploy marker unchanged
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
          CURRENT="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/feo_author_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$CURRENT" = "$DEPLOYED_BEFORE"
          echo 'FEO_AUTHOR_BACKFILL_HTTP_PASS=YES'
          echo 'FEO_AUTHOR_BACKFILL_DEPLOY_MARKER_UNCHANGED=YES'

      - name: Upload backfill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feo_placement_author_backfill_${{ inputs.source_sha }}
          path: |
            feo_author_before.txt
            feo_author_apply.txt
            feo_author_after.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish final backfill status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; desc='FEO placement author backfill verified'; else state=failure; desc='FEO placement author backfill failed'; fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/feo-placement-author-backfill','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -u
          if [ -f "$HOME/.ssh/feo_author_key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/feo_author_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/feo_author_backfill_${GITHUB_RUN_ID}.php' '/tmp/feo_author_verify_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/feo_author_key"
          rm -rf "${SSH_CONTROL_DIR:-}"
