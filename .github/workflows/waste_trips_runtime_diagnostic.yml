name: Waste Trips Runtime Diagnostic

on:
  push:
    branches:
      - qa/waste-trips-runtime-diagnostic-agent
      - chatgpt/waste-trips-legacy-create-runtime-fix-20260909
  workflow_dispatch:
    inputs:
      incident_id:
        description: Optional exact WT incident id
        required: false
        type: string

permissions:
  contents: read

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  SERVER_ROOT: /home/s/spugovxsim/planexp
  LIVE_DIR: public_html
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
  TASK_DIAGNOSTIC_BASE_SHA: a211573f385d1ac19bdebef0bc1e807fc8132187

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require exact diagnostic source and deployed base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME" --depth=50
          git fetch origin "$CANONICAL_BRANCH" --depth=1
          canonical="$(git rev-parse FETCH_HEAD)"
          head="$(git rev-parse HEAD)"
          case "$GITHUB_REF_NAME" in
            qa/waste-trips-runtime-diagnostic-agent)
              test "$head" = "$canonical"
              expected_deployed="$head"
              ;;
            chatgpt/waste-trips-legacy-create-runtime-fix-20260909)
              test "$canonical" = "$TASK_DIAGNOSTIC_BASE_SHA"
              git merge-base --is-ancestor "$TASK_DIAGNOSTIC_BASE_SHA" "$head"
              expected_deployed="$TASK_DIAGNOSTIC_BASE_SHA"
              ;;
            *)
              echo "UNAPPROVED_DIAGNOSTIC_REF=$GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          echo "EXPECTED_DEPLOYED_SHA=$expected_deployed" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_HEAD=$head"
          echo "EXACT_CANONICAL_SHA=$canonical"

      - name: Configure isolated read-only SSH channel
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/waste_runtime_diag"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/waste_runtime_diag" "$HOME/.ssh/known_hosts"

      - name: Require exact deployed marker and collect bounded read-only evidence
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_runtime_diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$marker" = "$EXPECTED_DEPLOYED_SHA"
          LIVE_ROOT="$SERVER_ROOT/$LIVE_DIR/erpv2"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_runtime_diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "LIVE_ROOT='$LIVE_ROOT' bash -se" <<'REMOTE' | tee waste_trips_runtime_diagnostic.txt
          set -euo pipefail
          ACCOUNT_ROOT=/home/s/spugovxsim
          echo 'WASTE_TRIPS_RUNTIME_DIAGNOSTIC_BEGIN'
          printf 'deployed_marker='; cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
          echo '--- waste schema snapshot ---'
          PLANEX_ROOT="$LIVE_ROOT" /usr/bin/php8.5 "$LIVE_ROOT/scripts/waste_trips_verify_130.php" 2>&1 || true
          echo '--- durable Waste Trips incident evidence ---'
          incident_log="$LIVE_ROOT/logs/waste_trip_incidents.jsonl"
          printf 'WASTE_INCIDENT_LOG=%s\n' "$incident_log"
          if [ -r "$incident_log" ]; then
            tail -n 250 "$incident_log" | grep -E '"incident_id":"WT-[0-9]{6}-[0-9]{6}-[A-F0-9]{6}"' | tail -n 80 || true
          else
            echo 'WASTE_INCIDENT_LOG_READABLE=NO'
          fi
          echo 'WASTE_TRIPS_RUNTIME_DIAGNOSTIC_END'
          REMOTE
          grep -q '^WASTE_TRIPS_RUNTIME_DIAGNOSTIC_BEGIN$' waste_trips_runtime_diagnostic.txt
          grep -q '^WASTE_TRIPS_RUNTIME_DIAGNOSTIC_END$' waste_trips_runtime_diagnostic.txt
          requested='${{ inputs.incident_id || '' }}'
          if [ -n "$requested" ]; then
            printf '%s' "$requested" | grep -Eq '^WT-[0-9]{6}-[0-9]{6}-[A-F0-9]{6}$'
            grep -F "\"incident_id\":\"$requested\"" waste_trips_runtime_diagnostic.txt > waste_trip_requested_incident.txt
            test -s waste_trip_requested_incident.txt
          fi

      - name: Run Legacy 244 read-only production precondition probe
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_runtime_diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$marker" = "$EXPECTED_DEPLOYED_SHA"
          LIVE_ROOT="$SERVER_ROOT/$LIVE_DIR/erpv2"
          cat scripts/waste_trip_244_readonly_probe.php | \
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_runtime_diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5" | tee waste_trip_244_readonly.txt
          grep -q '^WASTE_TRIP_244_READ_ONLY=' waste_trip_244_readonly.txt
          grep -q '^WASTE_TRIP_244_READ_ONLY_PASS$' waste_trip_244_readonly.txt

      - name: Run exact Legacy read-only production probe
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_runtime_diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$marker" = "$EXPECTED_DEPLOYED_SHA"
          LIVE_ROOT="$SERVER_ROOT/$LIVE_DIR/erpv2"
          cat scripts/waste_trip_legacy_readonly_probe.php |             ssh -p "$SSH_PORT" -i "$HOME/.ssh/waste_runtime_diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST"               "PLANEX_ROOT='$LIVE_ROOT' PLANEX_WASTE_TRIP_LEGACY_ID='246' PLANEX_WASTE_TRIP_COMPANY_ID='25' /usr/bin/php8.5" | tee waste_trip_legacy_readonly.txt
          grep -q '^WASTE_TRIP_LEGACY_READ_ONLY=' waste_trip_legacy_readonly.txt
          grep -q '^WASTE_TRIP_LEGACY_READ_ONLY_PASS$' waste_trip_legacy_readonly.txt

      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: waste-trips-runtime-diagnostic-${{ github.sha }}
          path: |
            waste_trips_runtime_diagnostic.txt
            waste_trip_244_readonly.txt
            waste_trip_legacy_readonly.txt
            waste_trip_requested_incident.txt
          retention-days: 14

      - name: Cleanup local SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/waste_runtime_diag"
