name: FEO Utilizer Aliases 126 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing migration 126 tooling'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_FEO_126 to authorize production migration 126'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: feo-126-production-migration
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2

jobs:
  migrate-126:
    if: ${{ inputs.confirm_migration == 'APPLY_FEO_126' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Validate exact source and tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          php -l scripts/feo_apply_126.php
          php -l scripts/feo_verify_126.php
          php tests/feo_utilizer_alias_migration_contract_test.php
          test -s database/migrations-local/126_create_feo_utilizer_aliases.sql

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - > /tmp/payload.json <<'PY'
          import json
          print(json.dumps({'state':'pending','context':'erpv2/migration126','description':'FEO utilizer aliases migration 126 in progress'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Upload isolated migration tooling
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/feo_verify_126.php "$SSH_USER@$SSH_HOST:/tmp/feo_verify126_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/feo_apply_126.php "$SSH_USER@$SSH_HOST:/tmp/feo_apply126_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes database/migrations-local/126_create_feo_utilizer_aliases.sql "$SSH_USER@$SSH_HOST:/tmp/feo_126_${GITHUB_RUN_ID}.sql"

      - name: Snapshot before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/feo_verify126_${GITHUB_RUN_ID}.php'" | tee feo126_before.txt
          grep -q 'FEO_126_READ_ONLY_OK' feo126_before.txt

      - name: Apply migration 126 to active tenant databases
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_MIGRATION_PATH='/tmp/feo_126_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/feo_apply126_${GITHUB_RUN_ID}.php'" | tee feo126_migration.txt
          grep -q 'FEO_126_OK' feo126_migration.txt

      - name: Snapshot after and verify invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/feo_verify126_${GITHUB_RUN_ID}.php'" | tee feo126_after.txt
          grep -q 'FEO_126_READ_ONLY_OK' feo126_after.txt
          python3 - "$(sed -n 's/^FEO_126_SNAPSHOT=//p' feo126_before.txt)" "$(sed -n 's/^FEO_126_SNAPSHOT=//p' feo126_after.txt)" <<'PY'
          import json,sys
          before,after=map(json.loads,sys.argv[1:3])
          b={x['company_id']:x for x in before}; a={x['company_id']:x for x in after}
          if set(b)!=set(a): raise SystemExit('active tenant set changed during migration')
          stable=('feo_requests','feo_imports','feo_changes','placement_blocks','placement_members','placement_current','cost_blocks','cost_members','utilizers','legacy_rules','legacy_overrides')
          for cid,row in a.items():
              old=b[cid]
              if old['migration_125'] != 1 or row['migration_125'] != 1:
                  raise SystemExit(f'company {cid}: migration 125 prerequisite missing')
              if row['alias_table'] != 1 or row['migration_126'] != 1:
                  raise SystemExit(f'company {cid}: migration 126 schema/journal incomplete')
              for key in stable:
                  if row[key] != old[key]:
                      raise SystemExit(f'company {cid}: existing business rows changed for {key}')
              if old['migration_126'] == 1:
                  if old['alias_table'] != 1 or row['aliases'] != old['aliases']:
                      raise SystemExit(f'company {cid}: idempotent rerun changed aliases')
              elif old['alias_table'] != 0 or old['aliases'] != 0:
                  raise SystemExit(f'company {cid}: unjournaled alias schema/data existed before migration')
          print('FEO_126_INVARIANTS_OK')
          PY

      - name: HTTP acceptance
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feo_126_production_migration_${{ inputs.source_sha }}
          path: |
            feo126_before.txt
            feo126_migration.txt
            feo126_after.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; desc='FEO utilizer aliases migration 126 verified'; else state=failure; desc='FEO utilizer aliases migration 126 failed'; fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/migration126','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/feo_verify126_${GITHUB_RUN_ID}.php' '/tmp/feo_apply126_${GITHUB_RUN_ID}.php' '/tmp/feo_126_${GITHUB_RUN_ID}.sql'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/key"
