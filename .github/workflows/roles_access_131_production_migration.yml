name: Roles Access 131 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing Roles & Access migration tooling'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_ROLES_ACCESS_131 to authorize production migration/readiness/activation'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: roles-access-131-production-migration
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  PROJECT_ROOT: /home/s/spugovxsim/planexp
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  RESULT_DIR: roles_access_131_result

jobs:
  migrate-roles-access:
    if: ${{ inputs.confirm_migration == 'APPLY_ROLES_ACCESS_131' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Validate exact canonical source and task contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          CANONICAL_SHA="$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')"
          test -n "$CANONICAL_SHA"
          test "$CANONICAL_SHA" = "$SOURCE_SHA"
          php -l scripts/roles_access_production_migrate.php
          php -l tests/roles_access_131_production_migration_contract_test.php
          php tests/roles_access_131_production_migration_contract_test.php
          php tests/agent_db_migration_request_contract_test.php
          test -s database/migrations/013_create_roles_access.sql
          test -s database/migrations-local/131_create_roles_access_projection.sql

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - > /tmp/payload.json <<'PY'
          import json
          print(json.dumps({'state':'pending','context':'erpv2/roles-access-migration131','description':'Roles & Access migration 131 in progress'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Configure isolated SSH transport
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/roles_access_131_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/roles_access_131_key" "$HOME/.ssh/known_hosts"
          SSH_CONTROL_DIR="/tmp/roles131_mux_${GITHUB_RUN_ID}"
          install -d -m 700 "$SSH_CONTROL_DIR"
          SSH_CONTROL_PATH="$SSH_CONTROL_DIR/%C"
          test "${#SSH_CONTROL_PATH}" -lt 90
          printf 'SSH_CONTROL_DIR=%s\nSSH_CONTROL_PATH=%s\n' "$SSH_CONTROL_DIR" "$SSH_CONTROL_PATH" >> "$GITHUB_ENV"

      - name: Upload exact migration tooling
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SCP=(scp -P "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          "${SCP[@]}" scripts/roles_access_production_migrate.php "$SSH_USER@$SSH_HOST:/tmp/roles_access_production_${GITHUB_RUN_ID}.php"
          "${SCP[@]}" database/migrations/013_create_roles_access.sql "$SSH_USER@$SSH_HOST:/tmp/roles_access_013_${GITHUB_RUN_ID}.sql"
          "${SCP[@]}" database/migrations-local/131_create_roles_access_projection.sql "$SSH_USER@$SSH_HOST:/tmp/roles_access_131_${GITHUB_RUN_ID}.sql"
          "${SCP[@]}" .github/roles-access/qa_session.php "$SSH_USER@$SSH_HOST:/tmp/roles_access_qa_session_${GITHUB_RUN_ID}.php"

      - name: BACKUP and BEFORE snapshot and identity preflight
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$PROJECT_ROOT/deploy_backups/roles_access_${SOURCE_SHA}_${GITHUB_RUN_ID}"
          printf 'ROLES_ACCESS_EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_SOURCE_SHA='$SOURCE_SHA' PLANEX_EVIDENCE_DIR='$EVIDENCE_DIR' PLANEX_CENTRAL_MIGRATION_PATH='/tmp/roles_access_013_${GITHUB_RUN_ID}.sql' PLANEX_TENANT_MIGRATION_PATH='/tmp/roles_access_131_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/roles_access_production_${GITHUB_RUN_ID}.php' prepare" | tee roles_access_prepare.txt
          grep -q '^ROLES_ACCESS_BACKUP_PASS=YES$' roles_access_prepare.txt
          grep -q '^ROLES_ACCESS_BEFORE_PASS=YES$' roles_access_prepare.txt
          grep -q '^ROLES_ACCESS_IDENTITY_PREFLIGHT_PASS=YES$' roles_access_prepare.txt

      - name: Apply CENTRAL 013 and TENANT 131 factual migration
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_SOURCE_SHA='$SOURCE_SHA' PLANEX_EVIDENCE_DIR='$ROLES_ACCESS_EVIDENCE_DIR' PLANEX_CENTRAL_MIGRATION_PATH='/tmp/roles_access_013_${GITHUB_RUN_ID}.sql' PLANEX_TENANT_MIGRATION_PATH='/tmp/roles_access_131_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/roles_access_production_${GITHUB_RUN_ID}.php' apply" | tee roles_access_migration.txt
          grep -q '^ROLES_ACCESS_CENTRAL_013_PASS=YES$' roles_access_migration.txt
          grep -q '^ROLES_ACCESS_TENANT_131_PASS=YES$' roles_access_migration.txt
          grep -q '^ROLES_ACCESS_MIGRATION_PASS=YES$' roles_access_migration.txt

      - name: AFTER snapshot and strict BEFORE AFTER parity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_SOURCE_SHA='$SOURCE_SHA' PLANEX_EVIDENCE_DIR='$ROLES_ACCESS_EVIDENCE_DIR' PLANEX_CENTRAL_MIGRATION_PATH='/tmp/roles_access_013_${GITHUB_RUN_ID}.sql' PLANEX_TENANT_MIGRATION_PATH='/tmp/roles_access_131_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/roles_access_production_${GITHUB_RUN_ID}.php' after" | tee roles_access_after.txt
          grep -q '^ROLES_ACCESS_AFTER_PASS=YES$' roles_access_after.txt
          grep -q '^ROLES_ACCESS_PARITY_PASS=YES$' roles_access_after.txt
          grep -q '^ROLES_ACCESS_MULTI_COMPANY_PASS=YES$' roles_access_after.txt

      - name: Independent Roles Access regression after parity
        shell: bash
        run: |
          set -euo pipefail
          php tests/roles_access_core_test.php
          php tests/roles_access_identity_membership_contract_test.php
          php tests/roles_access_migration_proof_test.php
          php tests/roles_access_snapshot_collector_test.php
          php tests/roles_access_data_scope_test.php
          php tests/roles_access_assignment_endpoint_test.php
          php tests/roles_access_endpoint_integration_test.php
          php tests/roles_access_ui_contract_test.php
          python3 tests/roles_access_route_registry_test.py
          echo 'ROLES_ACCESS_INDEPENDENT_REGRESSION_PASS=YES'

      - name: READINESS gate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_SOURCE_SHA='$SOURCE_SHA' PLANEX_EVIDENCE_DIR='$ROLES_ACCESS_EVIDENCE_DIR' PLANEX_CENTRAL_MIGRATION_PATH='/tmp/roles_access_013_${GITHUB_RUN_ID}.sql' PLANEX_TENANT_MIGRATION_PATH='/tmp/roles_access_131_${GITHUB_RUN_ID}.sql' PLANEX_REGRESSION_PASS='YES' /usr/bin/php8.5 '/tmp/roles_access_production_${GITHUB_RUN_ID}.php' ready" | tee roles_access_readiness.txt
          grep -q '^ROLES_ACCESS_READINESS_PASS=YES$' roles_access_readiness.txt

      - name: FEATURE ACTIVATION only after readiness
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_SOURCE_SHA='$SOURCE_SHA' PLANEX_EVIDENCE_DIR='$ROLES_ACCESS_EVIDENCE_DIR' /usr/bin/php8.5 '/tmp/roles_access_production_${GITHUB_RUN_ID}.php' activate" | tee roles_access_activation.txt
          grep -q '^ROLES_ACCESS_FEATURE_ACTIVATION_PASS=YES$' roles_access_activation.txt

      - name: Production ACL and projection acceptance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_SOURCE_SHA='$SOURCE_SHA' PLANEX_EVIDENCE_DIR='$ROLES_ACCESS_EVIDENCE_DIR' /usr/bin/php8.5 '/tmp/roles_access_production_${GITHUB_RUN_ID}.php' accept" | tee roles_access_accept.txt
          grep -q '^ROLES_ACCESS_PRODUCTION_ACL_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_MULTI_COMPANY_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_FINANCE_PROFILE_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_ASSIGNMENTS_TRIPS_PROJECTION_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_DYNAMIC_ROLE_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_PAGE_OVERRIDE_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_DATA_SCOPE_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_MANY_TO_MANY_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_AUTO_ASSIGN_CREATOR_PASS=YES$' roles_access_accept.txt
          grep -q '^ROLES_ACCESS_LAST_LEADER_PASS=YES$' roles_access_accept.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium for production UI acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Resolve OWNER runtime credentials for real login QA
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            printf '%s\n' "$KEY" > /tmp/roles_access_qa_key
            chmod 600 /tmp/roles_access_qa_key
            cred="$(python .github/p11/P11_decrypt_credentials.py --key /tmp/roles_access_qa_key --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"

      - name: Create valid and invalid pre-activation browser sessions
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          make_session() {
            mode="$1"
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
              "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/roles_access_qa_session_${GITHUB_RUN_ID}.php' '$mode'"
          }
          LEGACY_JSON="$(make_session create-legacy-owner)"; LEGACY_JSON="${LEGACY_JSON#ROLES_QA_SESSION=}"
          INVALID_JSON="$(make_session create-invalid-owner)"; INVALID_JSON="${INVALID_JSON#ROLES_QA_SESSION=}"
          python3 - "$LEGACY_JSON" "$INVALID_JSON" "$GITHUB_ENV" <<'PY'
          import json,sys
          legacy=json.loads(sys.argv[1]); invalid=json.loads(sys.argv[2])
          for value in (legacy['cookie'],legacy['sid'],invalid['sid']):
              print(f'::add-mask::{value}')
          with open(sys.argv[3],'a') as f:
              f.write(f"QA_COOKIE_NAME={legacy['cookie']}\n")
              f.write(f"QA_LEGACY_SESSION_ID={legacy['sid']}\n")
              f.write(f"QA_INVALID_SESSION_ID={invalid['sid']}\n")
          PY

      - name: Production browser UI acceptance
        shell: bash
        run: |
          set -euo pipefail
          node .github/roles-access/production_browser_qa.js | tee roles_access_browser.txt
          grep -q '^ROLES_ACCESS_REAL_LOGIN_PASS=YES$' roles_access_browser.txt
          grep -q '^ROLES_ACCESS_DASHBOARD_HTTP_STATUS=200$' roles_access_browser.txt
          grep -q '^ROLES_ACCESS_PROTECTED_PAGE_HTTP_STATUS=200$' roles_access_browser.txt
          grep -q '^ROLES_ACCESS_LEGACY_SESSION_UPGRADE_PASS=YES$' roles_access_browser.txt
          grep -q '^ROLES_ACCESS_INVALID_LEGACY_RELOGIN_PASS=YES$' roles_access_browser.txt
          grep -q '^ROLES_ACCESS_BROWSER_UI_PASS=YES$' roles_access_browser.txt

      - name: Cleanup temporary browser sessions
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -u -o pipefail
          STATUS=0
          for sid in "${QA_LEGACY_SESSION_ID:-}" "${QA_INVALID_SESSION_ID:-}" "${QA_UPGRADED_SESSION_ID:-}" "${QA_REAL_LOGIN_SESSION_ID:-}"; do
            if [ -n "$sid" ] && [ -f "$HOME/.ssh/roles_access_131_key" ]; then
              OUT=$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
                "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/roles_access_qa_session_${GITHUB_RUN_ID}.php' delete '$sid'") || STATUS=1
              [ "$OUT" = 'ROLES_QA_SESSION_DELETED' ] || STATUS=1
            fi
          done
          rm -f /tmp/roles_access_qa_key
          exit "$STATUS"

      - name: Fail-closed feature rollback after post-activation failure
        if: failure()
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ROLES_ACCESS_EVIDENCE_DIR:-}" ] || [ ! -f "$HOME/.ssh/roles_access_131_key" ]; then
            echo 'ROLES_ACCESS_FEATURE_ROLLBACK_NOT_REQUIRED=YES'
            exit 0
          fi
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST"             "PLANEX_ROOT='$LIVE_ROOT' PLANEX_SOURCE_SHA='$SOURCE_SHA' PLANEX_EVIDENCE_DIR='$ROLES_ACCESS_EVIDENCE_DIR' /usr/bin/php8.5 '/tmp/roles_access_production_${GITHUB_RUN_ID}.php' deactivate" | tee roles_access_rollback.txt
          grep -Eq '^ROLES_ACCESS_FEATURE_ROLLBACK_(PASS|NOT_REQUIRED)=YES$' roles_access_rollback.txt

      - name: Download sanitized migration evidence
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p "$RESULT_DIR"
          cp roles_access_*.txt "$RESULT_DIR/" 2>/dev/null || true
          if [ -n "${ROLES_ACCESS_EVIDENCE_DIR:-}" ] && [ -f "$HOME/.ssh/roles_access_131_key" ]; then
            for name in before_access.json before_context.json prepare_meta.json migration_result.json after_access.json parity.json readiness.json activation.json production_acceptance.json; do
              scp -P "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" \
                "$SSH_USER@$SSH_HOST:${ROLES_ACCESS_EVIDENCE_DIR}/${name}" "$RESULT_DIR/${name}" 2>/dev/null || true
            done
          fi

      - name: Upload production migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roles_access_131_production_migration_${{ inputs.source_sha }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Roles & Access migration/readiness/activation verified'; else state=failure; desc='Roles & Access migration/readiness/activation failed'; fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json, sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/roles-access-migration131','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Cleanup temporary migration tooling
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -u
          if [ -f "$HOME/.ssh/roles_access_131_key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/roles_access_production_${GITHUB_RUN_ID}.php' '/tmp/roles_access_013_${GITHUB_RUN_ID}.sql' '/tmp/roles_access_131_${GITHUB_RUN_ID}.sql' '/tmp/roles_access_qa_session_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/roles_access_131_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" -O exit "$SSH_USER@$SSH_HOST" 2>/dev/null || true
          fi
          rm -rf "${SSH_CONTROL_DIR:-}" 2>/dev/null || true
          rm -f "$HOME/.ssh/roles_access_131_key"
