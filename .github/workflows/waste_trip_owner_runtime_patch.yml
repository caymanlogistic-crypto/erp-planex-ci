name: Waste Trip Owner Runtime Patch

on:
  push:
    branches:
      - fix/waste-trips-owner-runtime-20260901
    paths:
      - '.github/workflows/waste_trip_owner_runtime_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded controller patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/Http/Controllers/Company/WasteTripController.php')
          s=p.read_text(encoding='utf-8')
          old="""        $content = (string) ob_get_clean();
        require base_path('app/View/layouts/main.php');
"""
          new="""        $content = (string) ob_get_clean();
        $config = $this->config;
        $db = $this->db;
        require base_path('app/View/layouts/main.php');
"""
          count=s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 Waste Trip layout tails, found {count}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          php -l app/Http/Controllers/Company/WasteTripController.php
          test "$(grep -Fc '$config = $this->config;' app/Http/Controllers/Company/WasteTripController.php)" = 2
          test "$(grep -Fc '$db = $this->db;' app/Http/Controllers/Company/WasteTripController.php)" = 2
          echo WASTE_TRIP_OWNER_LAYOUT_PATCH=PASS
      - name: Commit controller and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PLANEX CI'
          git config user.email 'info@plan-ex.ru'
          git add app/Http/Controllers/Company/WasteTripController.php
          git commit -m 'fix: pass Waste Trips layout runtime dependencies'
          git push origin HEAD:fix/waste-trips-owner-runtime-20260901
          rm .github/workflows/waste_trip_owner_runtime_patch.yml
          git add -u .github/workflows/waste_trip_owner_runtime_patch.yml
          git commit -m 'chore: remove one-shot Waste Trips patch workflow'
          git push origin HEAD:fix/waste-trips-owner-runtime-20260901
