name: Roles Access Production Browser QA

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA already deployed to /erpv2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: roles-access-production-browser-qa
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  RESULT_DIR: roles_access_session_qa_result

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Validate exact canonical and deployed SHA
        env:
          SHA: ${{ inputs.source_sha }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')" = "$SHA"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/roles_session_qa"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/roles_session_qa" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/roles_session_qa" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$got" = "$SHA"
          scp -P "$PORT" -i "$HOME/.ssh/roles_session_qa" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes .github/roles-access/qa_session.php "$USER@$HOST:/tmp/roles_access_session_qa_${GITHUB_RUN_ID}.php"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER runtime credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            printf '%s\n' "$KEY" > /tmp/roles_session_qa_key
            chmod 600 /tmp/roles_session_qa_key
            cred="$(python .github/p11/P11_decrypt_credentials.py --key /tmp/roles_session_qa_key --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Create valid and invalid pre-activation sessions
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          make_session() {
            mode="$1"
            ssh -p "$PORT" -i "$HOME/.ssh/roles_session_qa" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/roles_access_session_qa_${GITHUB_RUN_ID}.php' '$mode'"
          }
          LEGACY_JSON="$(make_session create-legacy-owner)"; LEGACY_JSON="${LEGACY_JSON#ROLES_QA_SESSION=}"
          INVALID_JSON="$(make_session create-invalid-owner)"; INVALID_JSON="${INVALID_JSON#ROLES_QA_SESSION=}"
          python3 - "$LEGACY_JSON" "$INVALID_JSON" "$GITHUB_ENV" <<'PY'
          import json,sys
          legacy=json.loads(sys.argv[1]); invalid=json.loads(sys.argv[2])
          for value in (legacy['cookie'],legacy['sid'],invalid['sid']): print(f'::add-mask::{value}')
          with open(sys.argv[3],'a') as f:
              f.write(f"QA_COOKIE_NAME={legacy['cookie']}\nQA_LEGACY_SESSION_ID={legacy['sid']}\nQA_INVALID_SESSION_ID={invalid['sid']}\n")
          PY
      - name: Real login and legacy-session production browser acceptance
        run: |
          set -euo pipefail
          node .github/roles-access/production_browser_qa.js | tee roles_access_session_browser.txt
          grep -q '^ROLES_ACCESS_REAL_LOGIN_PASS=YES$' roles_access_session_browser.txt
          grep -q '^ROLES_ACCESS_DASHBOARD_HTTP_STATUS=200$' roles_access_session_browser.txt
          grep -q '^ROLES_ACCESS_PROTECTED_PAGE_HTTP_STATUS=200$' roles_access_session_browser.txt
          grep -q '^ROLES_ACCESS_LEGACY_SESSION_UPGRADE_PASS=YES$' roles_access_session_browser.txt
          grep -q '^ROLES_ACCESS_INVALID_LEGACY_RELOGIN_PASS=YES$' roles_access_session_browser.txt
      - name: Cleanup QA sessions/tooling
        if: always()
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -u
          for sid in "${QA_LEGACY_SESSION_ID:-}" "${QA_INVALID_SESSION_ID:-}" "${QA_UPGRADED_SESSION_ID:-}" "${QA_REAL_LOGIN_SESSION_ID:-}"; do
            if [ -n "$sid" ] && [ -f "$HOME/.ssh/roles_session_qa" ]; then
              ssh -p "$PORT" -i "$HOME/.ssh/roles_session_qa" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
                "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/roles_access_session_qa_${GITHUB_RUN_ID}.php' delete '$sid'" >/dev/null 2>&1 || true
            fi
          done
          if [ -f "$HOME/.ssh/roles_session_qa" ]; then
            ssh -p "$PORT" -i "$HOME/.ssh/roles_session_qa" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "rm -f '/tmp/roles_access_session_qa_${GITHUB_RUN_ID}.php'" >/dev/null 2>&1 || true
          fi
          rm -f "$HOME/.ssh/roles_session_qa" /tmp/roles_session_qa_key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roles_access_session_browser_${{ inputs.source_sha }}
          path: |
            roles_access_session_browser.txt
            roles_access_session_qa_result/
          if-no-files-found: warn
          retention-days: 30
