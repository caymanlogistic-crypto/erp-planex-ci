name: Finance Closing 121 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing migration 121 tooling'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_FINANCE_CLOSING_121 to authorize production migration 121'
        required: true
        type: string
permissions:
  contents: read
  statuses: write
concurrency:
  group: finance-closing-121-production-migration
  cancel-in-progress: false
env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
jobs:
  migrate-121:
    if: ${{ inputs.confirm_migration == 'APPLY_FINANCE_CLOSING_121' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Validate exact source and tooling
        env: { SOURCE_SHA: "${{ inputs.source_sha }}" }
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          php -l scripts/finance_closing_apply_121.php
          php -l scripts/finance_closing_verify_121.php
          test -s database/migrations-local/121_closing_document_evidence_overrides.sql
      - name: Publish pending status
        env: { GH_TOKEN: "${{ github.token }}", SOURCE_SHA: "${{ inputs.source_sha }}", REPOSITORY: "${{ github.repository }}", API_URL: "${{ github.api_url }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" -d '{"state":"pending","context":"erpv2/migration121","description":"Closing documents migration 121 in progress"}' >/dev/null
      - name: Configure SSH
        env: { PRIVATE_KEY: "${{ secrets.ERPV2_SSH_PRIVATE_KEY }}", KNOWN_HOSTS: "${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}" }
        run: |
          install -d -m 700 "$HOME/.ssh"; printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"; printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Upload isolated tooling
        env: { SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}" }
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/finance_closing_verify_121.php "$SSH_USER@$SSH_HOST:/tmp/verify121_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/finance_closing_apply_121.php "$SSH_USER@$SSH_HOST:/tmp/apply121_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes database/migrations-local/121_closing_document_evidence_overrides.sql "$SSH_USER@$SSH_HOST:/tmp/121_${GITHUB_RUN_ID}.sql"
      - name: Snapshot before
        env: { SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}" }
        run: ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/verify121_${GITHUB_RUN_ID}.php'" | tee closing121_before.txt
      - name: Apply only migration 121
        env: { SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}" }
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' PLANEX_MIGRATION_PATH='/tmp/121_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/apply121_${GITHUB_RUN_ID}.php'" | tee closing121_migration.txt
          grep -q 'FINANCE_CLOSING_121_OK' closing121_migration.txt
      - name: Snapshot after and verify invariants
        env: { SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}" }
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/verify121_${GITHUB_RUN_ID}.php'" | tee closing121_after.txt
          python3 - "$(sed -n 's/^FINANCE_CLOSING_121_SNAPSHOT=//p' closing121_before.txt)" "$(sed -n 's/^FINANCE_CLOSING_121_SNAPSHOT=//p' closing121_after.txt)" <<'PY'
          import json,sys
          b,a=map(json.loads,sys.argv[1:3])
          for k in ('bank_transactions','documents','closing_links'):
              if b[k]!=a[k]: raise SystemExit(f'business invariant changed: {k}')
          if a['manual_table']!=1 or a['requirement_exception_table']!=1 or a['is_edo_column']!=1 or a['migration_121_applied']!=1: raise SystemExit('121 schema incomplete')
          if b['manual_table']==0 and (a['manual_rows']!=0 or a['requirement_exception_rows']!=0): raise SystemExit('migration created business overrides')
          print('FINANCE_CLOSING_121_INVARIANTS_OK')
          PY
      - name: HTTP acceptance
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
      - name: Publish final migration status
        if: always()
        env: { GH_TOKEN: "${{ github.token }}", SOURCE_SHA: "${{ inputs.source_sha }}", REPOSITORY: "${{ github.repository }}", API_URL: "${{ github.api_url }}", JOB_STATUS: "${{ job.status }}" }
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Closing documents migration 121 verified'; else state=failure; desc='Closing documents migration 121 failed'; fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/migration121','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null
      - name: Cleanup
        if: always()
        env: { SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}" }
        run: ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '/tmp/verify121_${GITHUB_RUN_ID}.php' '/tmp/apply121_${GITHUB_RUN_ID}.php' '/tmp/121_${GITHUB_RUN_ID}.sql'" 2>/dev/null || true
