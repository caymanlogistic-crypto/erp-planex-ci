name: Agent DB Migration Request Contract

on:
  pull_request:
    paths:
      - '.github/workflows/erpv2_agent_db_migration_request.yml'
      - '.github/agent_db_migration_request.json'
      - '.github/workflows/feo_124_production_migration.yml'
      - 'scripts/feo_apply_124.php'
      - 'scripts/feo_verify_124.php'
      - 'tests/feo_124_production_migration_contract_test.php'
      - 'database/migrations-local/124_create_feo_request_costs.sql'
      - '.github/workflows/feo_125_production_migration.yml'
      - 'scripts/feo_apply_125.php'
      - 'scripts/feo_verify_125.php'
      - 'tests/feo_125_production_migration_contract_test.php'
      - 'database/migrations-local/125_create_feo_map_utilizers.sql'
      - '.github/workflows/waste_trips_134_production_migration.yml'
      - 'scripts/waste_trips_apply_134.php'
      - 'scripts/waste_trips_verify_134.php'
      - 'tests/waste_trips_134_production_migration_contract_test.php'
      - 'database/migrations-local/134_create_waste_trip_customer_payments.sql'
      - '.github/workflows/waste_trips_135_production_migration.yml'
      - 'scripts/waste_trips_apply_135.php'
      - 'scripts/waste_trips_verify_135.php'
      - 'tests/waste_trips_135_production_migration_contract_test.php'
      - 'database/migrations-local/135_create_waste_trip_carrier_payments.sql'
      - 'tests/agent_db_migration_request_contract_test.php'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: php -l tests/agent_db_migration_request_contract_test.php
      - run: php tests/agent_db_migration_request_contract_test.php
      - run: php -l scripts/feo_apply_124.php
      - run: php -l scripts/feo_verify_124.php
      - run: php -l tests/feo_124_production_migration_contract_test.php
      - run: php tests/feo_124_production_migration_contract_test.php
      - run: php -l scripts/feo_apply_125.php
      - run: php -l scripts/feo_verify_125.php
      - run: php -l tests/feo_125_production_migration_contract_test.php
      - run: php tests/feo_125_production_migration_contract_test.php
      - run: php -l scripts/waste_trips_apply_134.php
      - run: php -l scripts/waste_trips_verify_134.php
      - run: php -l tests/waste_trips_134_production_migration_contract_test.php
      - run: php tests/waste_trips_134_production_migration_contract_test.php
      - run: php -l scripts/waste_trips_apply_135.php
      - run: php -l scripts/waste_trips_verify_135.php
      - run: php -l tests/waste_trips_135_production_migration_contract_test.php
      - run: php tests/waste_trips_135_production_migration_contract_test.php
