name: Bank 2026-10-14 Balance Reconcile Production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current canonical SHA
        required: true
        type: string
      confirm_reconcile:
        description: Type APPLY_BANK_20261014_BALANCE
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: erpv2-controlled-deploy
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802

jobs:
  reconcile:
    if: ${{ inputs.confirm_reconcile == 'APPLY_BANK_20261014_BALANCE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact canonical source and CI
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/${CANONICAL_BRANCH} | awk '{print $1}')" = "$SOURCE_SHA"
          php -l scripts/bank_20261014_balance_reconcile.php
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" > /tmp/ci-runs.json
          SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json, os
          rows=[r for r in json.load(open('/tmp/ci-runs.json')).get('workflow_runs',[]) if r.get('head_sha')==os.environ['SOURCE_SHA'] and r.get('event')=='push']
          if not rows: raise SystemExit('Exact canonical CI missing')
          run=max(rows,key=lambda r:r.get('run_number',0))
          if run.get('status')!='completed' or run.get('conclusion')!='success': raise SystemExit('Exact canonical CI did not pass')
          print(f"BANK_BALANCE_CANONICAL_CI_PASS run={run['id']}")
          PY

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/bank_balance_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/bank_balance_key" "$HOME/.ssh/known_hosts"
          SSH_CONTROL_DIR="/tmp/bank_balance_mux_${GITHUB_RUN_ID}"
          install -d -m 700 "$SSH_CONTROL_DIR"
          printf 'SSH_CONTROL_DIR=%s\nSSH_CONTROL_PATH=%s\n' "$SSH_CONTROL_DIR" "$SSH_CONTROL_DIR/%C" >> "$GITHUB_ENV"

      - name: Verify deployed code and upload exact correction
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$HOME/.ssh/bank_balance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          SCP=(scp -P "$SSH_PORT" -i "$HOME/.ssh/bank_balance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH")
          DEPLOYED="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          [[ "$DEPLOYED" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$DEPLOYED^{commit}"
          git merge-base --is-ancestor "$DEPLOYED" "$SOURCE_SHA"
          git diff --quiet "$DEPLOYED" "$SOURCE_SHA" -- bootstrap/app.php app/Support/crypto_helper.php app/Support/company_database.php app/Service/FinanceBankReconciliationService.php app/Service/FinanceBankReconciliationCutoffService.php
          printf 'DEPLOYED_BEFORE=%s\n' "$DEPLOYED" >> "$GITHUB_ENV"
          "${SCP[@]}" scripts/bank_20261014_balance_reconcile.php "$SSH_USER@$SSH_HOST:/tmp/bank_balance_reconcile_${GITHUB_RUN_ID}.php"
          echo 'BANK_BALANCE_RUNTIME_COMPATIBILITY_PASS'

      - name: Verify BEFORE
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/bank_balance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' BANK_BALANCE_MODE=verify /usr/bin/php8.5 '/tmp/bank_balance_reconcile_${GITHUB_RUN_ID}.php'" | tee bank_balance_before.txt
          grep -q '^BANK_BALANCE_STATE=NEEDS_CORRECTION$' bank_balance_before.txt
          grep -q '^BANK_BALANCE_VERIFY_OK$' bank_balance_before.txt

      - name: Apply guarded correction with private backup
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/bank_balance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "umask 077; mkdir -p '/home/s/spugovxsim/planexp/deploy/backups'; PLANEX_ROOT='$LIVE_ROOT' BANK_BALANCE_MODE=apply BANK_BALANCE_CONFIRM='APPLY_BANK_20261014_BALANCE' BANK_BALANCE_BACKUP_DIR='/home/s/spugovxsim/planexp/deploy/backups' /usr/bin/php8.5 '/tmp/bank_balance_reconcile_${GITHUB_RUN_ID}.php'" | tee bank_balance_apply.txt
          grep -q '^BANK_BALANCE_APPLIED backup=' bank_balance_apply.txt
          grep -q '^BANK_BALANCE_STATE=CORRECTED$' bank_balance_apply.txt
          grep -q '^BANK_BALANCE_VERIFY_OK$' bank_balance_apply.txt

      - name: Independently verify AFTER and health
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/bank_balance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' BANK_BALANCE_MODE=verify /usr/bin/php8.5 '/tmp/bank_balance_reconcile_${GITHUB_RUN_ID}.php'" | tee bank_balance_after.txt
          grep -q '^BANK_BALANCE_STATE=CORRECTED$' bank_balance_after.txt
          grep -q '^BANK_BALANCE_VERIFY_OK$' bank_balance_after.txt
          grep -q '"target_arithmetic":"OK"' bank_balance_after.txt
          grep -q '"target_continuity":"OK"' bank_balance_after.txt
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
          CURRENT="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/bank_balance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$CURRENT" = "$DEPLOYED_BEFORE"
          echo 'BANK_BALANCE_PRODUCTION_VERIFICATION_PASS'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank_balance_20261014_${{ inputs.source_sha }}
          path: |
            bank_balance_before.txt
            bank_balance_apply.txt
            bank_balance_after.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup temporary script
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          if [ -f "$HOME/.ssh/bank_balance_key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/bank_balance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath="$SSH_CONTROL_PATH" "$SSH_USER@$SSH_HOST" "rm -f '/tmp/bank_balance_reconcile_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/bank_balance_key"
          if [ -n "${SSH_CONTROL_DIR:-}" ]; then rm -rf "$SSH_CONTROL_DIR"; fi
