name: Waste Trip Fixture Patch TMP

on:
  push:
    branches:
      - chatgpt/waste-trips-audit-fix-20260901
    paths:
      - '.github/workflows/waste_trip_fixture_patch_tmp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/waste-trips-audit-fix-20260901
          fetch-depth: 1
      - name: Expand canonical FEO test fixture and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/waste_trip_regression_test.php')
          s=p.read_text()
          old="mno_adres_pogruzki VARCHAR(500) NULL) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4"
          new="mno_adres_pogruzki VARCHAR(500) NULL, naim_otkhoda_fkko VARCHAR(255) NULL, nomer_opasnogo_gr VARCHAR(255) NULL) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4"
          if s.count(old) != 1:
              raise SystemExit(f'expected one FEO fixture target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          php -l tests/waste_trip_regression_test.php
          grep -Fq 'naim_otkhoda_fkko VARCHAR(255) NULL, nomer_opasnogo_gr VARCHAR(255) NULL' tests/waste_trip_regression_test.php
          git rm .github/workflows/waste_trip_fixture_patch_tmp.yml
          git config user.name planexerp
          git config user.email info@plan-ex.ru
          git add tests/waste_trip_regression_test.php
          git diff --cached --check
          git commit -m 'Align Waste Trips MySQL fixture with FEO request contract'
          git push origin HEAD:chatgpt/waste-trips-audit-fix-20260901
