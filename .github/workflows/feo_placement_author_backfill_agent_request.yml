name: FEO Placement Author Backfill Agent Request

on:
  push:
    branches:
      - backfill/feo-placement-author-agent

permissions:
  actions: write
  contents: read
  statuses: read

concurrency:
  group: feo-placement-author-backfill-agent-request
  cancel-in-progress: false

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  REPOSITORY_OWNER: ${{ github.repository_owner }}

jobs:
  authorize-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve exact canonical and deployment evidence
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${GITHUB_API_URL}/repos/${REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          branch_json="$(curl -fsS "${auth[@]}" "$base_url/branches/$CANONICAL_BRANCH")"
          canonical_sha="$(printf '%s' "$branch_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          [[ "$canonical_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$canonical_sha"

          case "$GITHUB_ACTOR" in
            "$REPOSITORY_OWNER"|chatgpt-codex-connector|chatgpt-connector) ;;
            *) echo "::error::Unauthorized actor: $GITHUB_ACTOR"; exit 1 ;;
          esac

          curl -fsS "${auth[@]}" "$base_url/actions/workflows/ci.yml/runs?head_sha=$canonical_sha&event=push&per_page=20" -o /tmp/erp-ci-runs.json
          CANONICAL_SHA="$canonical_sha" python3 - <<'PY'
          import json, os
          with open('/tmp/erp-ci-runs.json', encoding='utf-8') as fh:
              rows=[r for r in json.load(fh).get('workflow_runs',[]) if r.get('head_sha')==os.environ['CANONICAL_SHA'] and r.get('event')=='push']
          if not rows: raise SystemExit('exact canonical ERP PLANEX CI run missing')
          run=max(rows,key=lambda r:r.get('run_number',0))
          if run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit(f"exact canonical ERP PLANEX CI not successful: {run.get('id')} {run.get('status')} {run.get('conclusion')}")
          print(f"FEO_BACKFILL_REQUEST_CANONICAL_CI_PASS run={run.get('id')}")
          PY

          curl -fsS "${auth[@]}" "$base_url/commits/$canonical_sha/status" -o /tmp/commit-status.json
          CANONICAL_SHA="$canonical_sha" python3 - <<'PY'
          import json
          data=json.load(open('/tmp/commit-status.json',encoding='utf-8'))
          states={row.get('context'):row.get('state') for row in data.get('statuses',[])}
          if states.get('erpv2/deploy')!='success':
              raise SystemExit(f"exact canonical deploy status missing: {states.get('erpv2/deploy')}")
          print('FEO_BACKFILL_REQUEST_DEPLOY_STATUS_PASS=YES')
          PY

          echo "source_sha=$canonical_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch guarded FEO author backfill
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_SHA" > /tmp/feo-author-backfill-dispatch.json <<'PY'
          import json, sys
          print(json.dumps({
              'ref': 'chatgpt/production-stabilization-20260802',
              'inputs': {
                  'source_sha': sys.argv[1],
                  'confirm_backfill': 'APPLY_FEO_PLACEMENT_AUTHOR_BACKFILL',
              },
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$REPOSITORY/actions/workflows/feo_placement_author_backfill_production.yml/dispatches" \
            --data-binary @/tmp/feo-author-backfill-dispatch.json
          echo "FEO_AUTHOR_BACKFILL_AGENT_REQUEST_ACCEPTED=YES source=$SOURCE_SHA"
