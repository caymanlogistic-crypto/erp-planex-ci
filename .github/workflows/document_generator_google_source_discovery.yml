name: Document Generator Google Source Discovery

on:
  push:
    branches:
      - chatgpt/document-generator-google-contacts-vehicle-vin-20260904

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Locate and classify Google Sheets helper read-only
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          REMOTE="/tmp/document_generator_google_discovery_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            .github/document-generator/discover_google_source.php "$SSH_USER@$SSH_HOST:$REMOTE"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'set -euo pipefail; FOUND=$(find "$HOME" -maxdepth 8 -type f \( -name googleSheetsHelper.php -o -name timeline.php \) -print 2>/dev/null); printf "%s\n" "$FOUND" | sed "s#^$HOME/#DISCOVERED_RELATIVE=#"; HELPER=$(printf "%s\n" "$FOUND" | grep "/googleSheetsHelper.php$" | head -1 || true); test -n "$HELPER"; PLANEX_GOOGLE_HELPER="$HELPER" /usr/bin/php8.5 '"'$REMOTE'"'; rm -f '"'$REMOTE'"'; test ! -e '"'$REMOTE'"''

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/key"
