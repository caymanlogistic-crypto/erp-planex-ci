name: Waste Trips Apply Historical Import Patch

on:
  push:
    branches:
      - fix/waste-trips-historical-import-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'historical-import-bootstrap-v3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/waste-trips-historical-import-20260901
          fetch-depth: 0
      - name: Apply guarded patch and executable preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/waste-trips-historical-import/apply_patch.py
          git checkout -- .github/workflows/waste_trips_regression.yml
          php -l app/Service/WasteTripService.php
          php -l app/Service/WasteTripLegacyImportService.php
          php -l app/View/pages/company_waste_trips.php
          php -l app/View/partials/company_waste_trip_modal_view.php
          php -l tests/waste_trip_historical_import_contract_test.php
          php tests/waste_trip_historical_import_contract_test.php | tee /tmp/historical.out
          grep -Fqx 'WASTE_TRIP_HISTORICAL_IMPORT=PASS' /tmp/historical.out
          php tests/waste_trip_owner_layout_contract_test.php
          echo 'WASTE_HISTORICAL_LOCAL_PREFLIGHT=PASS'
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/waste-trips-historical-import/apply_patch.py
          git config user.name planexerp
          git config user.email info@plan-ex.ru
          git add app/Service/WasteTripService.php app/Service/WasteTripLegacyImportService.php app/View/pages/company_waste_trips.php app/View/partials/company_waste_trip_modal_view.php tests/waste_trip_historical_import_contract_test.php
          git commit -m 'fix(waste-trips): preserve historical legacy executor truth'
          git push origin HEAD:fix/waste-trips-historical-import-20260901
