name: DIAG Dispatch Exact ERPv2 Deploy

on:
  push:
    branches:
      - diag/closing-no-scroll-live-20260823

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate canonical HEAD and dispatch controlled deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          TARGET_SHA: ba71512df4dfa375bd483b883546d032393a27b1
          CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CANONICAL_BRANCH}:refs/remotes/origin/${CANONICAL_BRANCH}"
          test "$TARGET_SHA" = "$(git rev-parse refs/remotes/origin/${CANONICAL_BRANCH})"
          payload="$(TARGET_SHA="$TARGET_SHA" CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY'
          import json, os
          print(json.dumps({'ref': os.environ['CANONICAL_BRANCH'], 'inputs': {'source_sha': os.environ['TARGET_SHA'], 'confirm_deploy': 'DEPLOY_ERPV2'}}))
          PY
          )"
          code="$(curl -fsS -o /tmp/response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/workflows/erpv2_controlled_deploy.yml/dispatches" \
            -d "$payload")"
          test "$code" = 204
          echo "CONTROLLED_DEPLOY_DISPATCHED=$TARGET_SHA"
