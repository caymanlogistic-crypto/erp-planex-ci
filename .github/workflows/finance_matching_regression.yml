name: Finance Matching Regression

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/Service/FinanceMatchingRule*'
      - 'app/Service/FinanceEmployee*'
      - 'app/Service/FinanceCash*'
      - 'app/Service/FinanceBank*'
      - 'app/Service/FinanceCarrierBankAutoSettlementService.php'
      - 'app/Service/NavigationCounterService.php'
      - 'app/Http/Controllers/Company/BankFinance*'
      - 'app/Http/Controllers/Company/FinanceMatchingRule*'
      - 'app/Http/Controllers/Company/FinanceEmployee*'
      - 'app/Http/Controllers/Company/FinanceCash*'
      - 'app/Http/Routes/company_finance_cash.php'
      - 'app/Http/Routes/company_finance_employee_payments.php'
      - 'app/View/pages/company_finance_matching_rules.php'
      - 'app/View/pages/company_finance_cash.php'
      - 'app/View/pages/company_finance_employee_payments.php'
      - 'app/View/partials/company_finance_matching_rule_form.php'
      - 'app/View/partials/company_finance_employee*'
      - 'app/View/partials/company_bank_transaction_classify_form.php'
      - 'database/migrations-local/063_*'
      - 'database/migrations-local/065_*'
      - 'database/migrations-local/066_*'
      - 'database/migrations-local/067_*'
      - 'database/migrations-local/069_*'
      - 'scripts/p41_*'
      - 'scripts/p80_*'
      - 'tests/finance_matching*'
      - 'tests/finance_employee*'
      - 'tests/finance_bank_register_filters_test.php'
      - 'tests/finance_cash*'
      - 'tests/navigation_counter_isolation_test.php'
      - 'tests/cash_dispatch_opcache_route_test.php'
      - '.github/workflows/finance_matching_regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-matching-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_employee_payments_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Matching semantics
        run: php tests/finance_matching_classification_test.php
      - name: OPCache-safe cash dispatch route
        run: php tests/cash_dispatch_opcache_route_test.php
      - name: Employee settlement behavioral regression
        env: &db_env
          EMPLOYEE_PAYMENTS_DB_HOST: 127.0.0.1
          EMPLOYEE_PAYMENTS_DB_PORT: 3306
          EMPLOYEE_PAYMENTS_DB_NAME: erp_employee_payments_test
          EMPLOYEE_PAYMENTS_DB_USER: root
          EMPLOYEE_PAYMENTS_DB_PASSWORD: root
        run: php tests/finance_employee_payments_test.php
      - name: Employee transfer behavioral regression
        env: *db_env
        run: php tests/finance_employee_transfer_behavioral_test.php
      - name: Bank register filter behavioral regression
        env: *db_env
        run: php tests/finance_bank_register_filters_test.php
      - name: Navigation counter isolation regression
        env: *db_env
        run: php tests/navigation_counter_isolation_test.php
      - name: Classification plus bank-to-cash behavioral regression
        env: *db_env
        run: php tests/finance_matching_cash_transfer_test.php
      - name: Human cash ledger behavioral regression
        env: *db_env
        run: php tests/finance_cash_ledger_test.php
      - name: Technical cash employee resolution regression
        env: *db_env
        run: php tests/finance_cash_resolution_test.php
      - name: Employee rule lifecycle backfill regression
        env: *db_env
        run: php tests/finance_employee_rule_cash_resolution_backfill_test.php
      - name: Migration shape
        run: |
          set -euo pipefail
          grep -q 'finance_cash_flow_centers' database/migrations-local/063_finance_matching_classification.sql
          grep -q 'finance_employee_movements' database/migrations-local/065_finance_employee_movements.sql
          grep -q 'employee_identity_type' database/migrations-local/066_finance_employee_identity.sql
          grep -q 'finance_cash_resolutions' database/migrations-local/067_finance_cash_resolutions.sql
          grep -q 'PAYMENT' database/migrations-local/069_backfill_employee_rule_cash_resolutions.sql
