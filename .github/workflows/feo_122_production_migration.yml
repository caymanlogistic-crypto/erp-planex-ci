name: FEO Requests 122 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing migration 122 tooling'
        required: true
        type: string
      confirm_migration:
        description: 'Type APPLY_FEO_122 to authorize production migration 122'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: feo-122-production-migration
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2

jobs:
  migrate-122:
    if: ${{ inputs.confirm_migration == 'APPLY_FEO_122' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Validate exact source and tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          php -l scripts/feo_apply_122.php
          php -l scripts/feo_verify_122.php
          test -s database/migrations-local/122_create_feo_requests.sql

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d '{"state":"pending","context":"erpv2/migration122","description":"FEO tenant migration 122 in progress"}' >/dev/null

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Upload isolated migration tooling
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/feo_verify_122.php "$SSH_USER@$SSH_HOST:/tmp/feo_verify122_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/feo_apply_122.php "$SSH_USER@$SSH_HOST:/tmp/feo_apply122_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes database/migrations-local/122_create_feo_requests.sql "$SSH_USER@$SSH_HOST:/tmp/feo_122_${GITHUB_RUN_ID}.sql"

      - name: Snapshot before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/feo_verify122_${GITHUB_RUN_ID}.php'" | tee feo122_before.txt
          grep -q 'FEO_122_READ_ONLY_OK' feo122_before.txt

      - name: Apply migration 122 to active tenant databases
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_MIGRATION_PATH='/tmp/feo_122_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/feo_apply122_${GITHUB_RUN_ID}.php'" | tee feo122_migration.txt
          grep -q 'FEO_122_OK' feo122_migration.txt

      - name: Snapshot after and verify invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/feo_verify122_${GITHUB_RUN_ID}.php'" | tee feo122_after.txt
          python3 - "$(sed -n 's/^FEO_122_SNAPSHOT=//p' feo122_before.txt)" "$(sed -n 's/^FEO_122_SNAPSHOT=//p' feo122_after.txt)" <<'PY'
          import json,sys
          before,after=map(json.loads,sys.argv[1:3])
          b={x['company_id']:x for x in before}; a={x['company_id']:x for x in after}
          if set(b)!=set(a): raise SystemExit('active tenant set changed during migration')
          for cid,row in a.items():
              if row['tables']!=3 or row['migration_122']!=1: raise SystemExit(f'company {cid}: migration 122 incomplete')
              for key in ('requests','imports','changes'):
                  if row[key]!=b[cid][key]: raise SystemExit(f'company {cid}: business rows changed for {key}')
          print('FEO_122_INVARIANTS_OK')
          PY

      - name: HTTP acceptance
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200

      - name: Publish final migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; desc='FEO tenant migration 122 verified'; else state=failure; desc='FEO tenant migration 122 failed'; fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/migration122','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "rm -f '/tmp/feo_verify122_${GITHUB_RUN_ID}.php' '/tmp/feo_apply122_${GITHUB_RUN_ID}.php' '/tmp/feo_122_${GITHUB_RUN_ID}.sql'" 2>/dev/null || true
