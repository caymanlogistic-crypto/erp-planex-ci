name: ERP PLANEX CI

on:
  push:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'database/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'docs/GITHUB_CONTROL_PLANE.md'
      - '.github/pull_request_template.md'
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'database/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'docs/GITHUB_CONTROL_PLANE.md'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-planex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config public scripts tests tools -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l >/tmp/php-lint.log
          cat /tmp/php-lint.log

      - name: Linear route point dual-operation regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/linear_route_point_dual_operation_test.php

      - name: Manual finance facts regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/finance_manual_facts_regression_test.php

      - name: Linked employee personal expense regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/finance_employee_personal_expense_event_regression_test.php

      - name: Invoice cash employee regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/finance_invoice_cash_employee_regression_test.php

      - name: Employee invoice cash lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/finance_cash_employee_invoice_lifecycle_regression_test.php

      - name: Carrier payables regression
        shell: bash
        run: |
          set -euo pipefail
          php tests/finance_carrier_payables_regression_test.php
          node --check .github/p93/P93_carrier_payables_visual.js

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py

      - name: Migration numbering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          failed = False
          for d in (Path('database/migrations'), Path('database/migrations-local')):
              rows = []
              if d.exists():
                  for p in d.glob('*.sql'):
                      m = re.match(r'(\d+)_', p.name)
                      if m:
                          rows.append((int(m.group(1)), p.name))
              counts = Counter(n for n, _ in rows)
              duplicates = {n: [f for nn, f in rows if nn == n] for n, c in counts.items() if c > 1}
              print(f'{d}: migrations={len(rows)} duplicates={duplicates}')
              if duplicates:
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Migration normalization regression
        shell: bash
        run: |
          set -euo pipefail
          test -f database/migrations-local/057_create_crew_drivers.sql
          test -f database/migrations-local/058_create_linear_route_points.sql
          test ! -f database/migrations-local/029_create_crew_drivers.sql
          test ! -f database/migrations-local/052_create_linear_route_points.sql
          grep -q "029_create_crew_drivers.sql.*057_create_crew_drivers.sql" scripts/p40_reconcile_migration_names.php
          grep -q "052_create_linear_route_points.sql.*058_create_linear_route_points.sql" scripts/p40_reconcile_migration_names.php

      - name: Dynamic identifier safety audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dynamic_table_safety_audit.py

      - name: Architecture guard
        shell: bash
        run: |
          set -euo pipefail
          php tools/architecture_guard.php

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find public/assets/js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Control-plane guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          deploy_engine = 'P07_' + 'deploy_erpv2.sh'
          violations = []
          production_write = []

          for p in Path('.github/workflows').glob('*.y*ml'):
              if p.name == 'ci.yml':
                  continue
              text = p.read_text(encoding='utf-8')
              mutating = any(token in text for token in [
                  deploy_engine,
                  'public_html/erpv2',
                  'deploy_backups',
                  'git push origin',
              ])
              if not mutating:
                  continue

              production_write.append(str(p))
              manual = '\n  workflow_dispatch:' in text
              automatic = any(trigger in text for trigger in [
                  '\n  workflow_run:',
                  '\n  push:',
                  '\n  pull_request:',
                  '\n  schedule:',
              ])
              if not manual or automatic:
                  violations.append(str(p))

          print('production-write workflows=', production_write)
          print('automatic production-write violations=', violations)
          raise SystemExit(1 if violations else 0)
          PY

      - name: Canonical manual deploy policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflows = Path('.github/workflows')
          deploy_files = []
          for p in workflows.glob('*.y*ml'):
              if p.name == 'ci.yml':
                  continue
              text = p.read_text(encoding='utf-8')
              if 'P07_deploy_erpv2.sh' in text:
                  deploy_files.append((p, text))

          assert len(deploy_files) == 1, f'expected exactly one deploy workflow, found {len(deploy_files)}'
          p, text = deploy_files[0]
          assert p.name == 'erpv2_controlled_deploy.yml', f'unexpected deploy workflow: {p}'

          on_match = re.search(r'(?ms)^on:\s*\n(.*?)(?=^[A-Za-z_][A-Za-z0-9_-]*:\s*$)', text)
          assert on_match, 'deploy workflow on: block not found'
          on_block = on_match.group(1)
          events = re.findall(r'^  ([A-Za-z_][A-Za-z0-9_-]*):', on_block, flags=re.M)
          assert sorted(set(events)) == ['workflow_dispatch'], f'deploy triggers must be workflow_dispatch only, got {events}'

          for required in [
              'source_sha:',
              'confirm_deploy:',
              'required: true',
              'DEPLOY_ERPV2',
              '^[0-9a-f]{40}$',
              'git cat-file -e "${SOURCE_SHA}^{commit}"',
              'git checkout --detach "$SOURCE_SHA"',
              'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"',
              'P07_erpv2_deployed_commit.txt',
          ]:
              assert required in text, f'missing deploy safety contract: {required}'

          forbidden_auto = ['workflow_run:', '\n  push:', '\n  pull_request:', '\n  schedule:']
          for token in forbidden_auto:
              assert token not in on_block, f'forbidden deploy trigger: {token.strip()}'

          migration_patterns = [
              r'php\s+artisan\s+migrate',
              r'doctrine:migrations',
              r'\bLocalMigrationService\b',
              r'\bmigrate\.php\b',
              r'\bmysql\b[^\n]*(?:database/migrations|migration)',
          ]
          for pattern in migration_patterns:
              assert re.search(pattern, text, re.I) is None, f'migration command found in standard deploy: {pattern}'

          old_erp_write = re.compile(r'(?:rsync|cp|mv|install|tar\s+[^\n]*-C)\b[^\n]*(?:public_html/erp)(?:\s|/|$)(?!v2)', re.I)
          assert old_erp_write.search(text) is None, 'legacy /erp write detected in deploy workflow'

          print('CANONICAL_MANUAL_DEPLOY_POLICY=PASS')
          PY
