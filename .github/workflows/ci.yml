name: ERP PLANEX CI

on:
  push:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'database/**'
      - 'docs/database/**'
      - 'docs/ui/**'
      - '.agents/skills/planex-ui-standard/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'docs/GITHUB_CONTROL_PLANE.md'
      - '.github/pull_request_template.md'
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'database/**'
      - 'docs/database/**'
      - 'docs/ui/**'
      - '.agents/skills/planex-ui-standard/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'docs/GITHUB_CONTROL_PLANE.md'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-planex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    if: >-
      !(
        github.event_name == 'pull_request' &&
        startsWith(github.head_ref, 'fast/') &&
        startsWith(github.event.pull_request.title, 'FAST:')
      ) && !(
        github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'FAST:')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Approved registry component contract
        run: |
          python3 tests/registry_component_contract_test.py
          python3 tests/ui_standard_catalog_test.py
          python3 tools/ui_standard.py check
          python3 tests/ui_style_guard_test.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/ui_style_guard.py --base "${{ github.event.pull_request.base.sha }}" --head HEAD
          elif [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/ui_style_guard.py --base HEAD^ --head HEAD
          fi

      - name: Detect changed scope
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 tools/ci_scope.py --full-scan --github-output "$GITHUB_OUTPUT" --format json
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/ci_scope.py --base HEAD^1 --head HEAD --github-output "$GITHUB_OUTPUT" --format json
          else
            python3 tools/ci_scope.py --base HEAD^ --head HEAD --github-output "$GITHUB_OUTPUT" --format json
          fi
          echo 'Changed files:'
          cat /tmp/changed_files

      - name: Production bootstrap before approved UI browser QA
        if: steps.changes.outputs.approved_ui == 'true'
        run: php tests/entrypoint_service_load_test.php

      - name: Setup Node for approved UI browser QA
        if: steps.changes.outputs.approved_ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium for approved UI browser QA
        if: steps.changes.outputs.approved_ui == 'true'
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Registered approved UI browser QA
        if: steps.changes.outputs.approved_ui == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tests/ui_standard_gallery_browser_test.mjs
          node tests/ui_standard_lab_browser_test.mjs
          node tests/registry_visual_gate_test.mjs
          node tools/registry_visual_gate.mjs

      - name: Registered registry runtime and own-scope browser QA
        if: steps.changes.outputs.approved_ui == 'true'
        run: bash tools/ci_registry_runtime.sh

      - name: Changed PHP syntax
        if: steps.changes.outputs.php == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.full_scan }}" = "true" ]; then
            find app bootstrap config public scripts tests tools -type f -name '*.php' -print0 \
              | xargs -0 -r -n1 php -l >/tmp/php-lint.log
          else
            grep -E '\.php$' /tmp/changed_files | while IFS= read -r f; do
              [ -f "$f" ] || continue
              php -l "$f"
            done >/tmp/php-lint.log
          fi
          cat /tmp/php-lint.log

      - name: Targeted finance regressions
        if: steps.changes.outputs.finance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php tests/finance_invoice_ui_contract_test.php
          php tests/finance_manual_facts_regression_test.php
          php tests/finance_employee_personal_expense_event_regression_test.php
          php tests/finance_invoice_cash_employee_regression_test.php
          php tests/finance_cash_employee_invoice_lifecycle_regression_test.php
          php tests/finance_carrier_payables_regression_test.php
          node --check .github/p93/P93_carrier_payables_visual.js

      - name: Targeted linear-route regression
        if: steps.changes.outputs.linear == 'true'
        run: php tests/linear_route_point_dual_operation_test.php

      - name: Targeted UI Pattern Lab contract
        if: steps.changes.outputs.ui_lab == 'true'
        run: php tests/ui_pattern_lab_contract_test.php

      - name: FEO request costs behavioral regression
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          GRANT ALL PRIVILEGES ON *.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
          php tests/feo_request_costs_regression_test.php

      - name: Roles Access session recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/roles_access_legacy_session_upgrade_test.php
          php tests/roles_access_session_recovery_contract_test.php
          php tests/roles_access_131_production_migration_contract_test.php
          if [ "${{ steps.changes.outputs.approved_ui }}" != "true" ]; then
            php tests/entrypoint_service_load_test.php
          fi
          php tests/roles_access_core_test.php
          php tests/roles_access_identity_membership_contract_test.php
          php tests/roles_access_assignment_endpoint_test.php
          php tests/roles_access_data_scope_test.php
          php tests/roles_access_endpoint_integration_test.php
          php tests/roles_access_ui_contract_test.php
          python3 tests/roles_access_route_registry_test.py
          node tests/roles_access_viewport_test.mjs
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          CREATE DATABASE IF NOT EXISTS `spugovxsim_test2` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL PRIVILEGES ON `spugovxsim_test2`.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
          PLANEX_SCHEMA_DB_HOST=127.0.0.1 \
          PLANEX_SCHEMA_DB_PORT=3306 \
          PLANEX_SCHEMA_DB_USER=planex_ci \
          PLANEX_SCHEMA_DB_PASSWORD=planex_ci \
          PLANEX_TEST_FIXED_DB=spugovxsim_test2 \
          PLANEX_TEST_FIXED_DB_ALLOWLIST=spugovxsim_test2 \
            php tests/roles_access_session_auth_mysql_test.php
          PLANEX_SCHEMA_DB_HOST=127.0.0.1 \
          PLANEX_SCHEMA_DB_PORT=3306 \
          PLANEX_SCHEMA_DB_USER=planex_ci \
          PLANEX_SCHEMA_DB_PASSWORD=planex_ci \
          PLANEX_TEST_FIXED_DB=spugovxsim_test2 \
          PLANEX_TEST_FIXED_DB_ALLOWLIST=spugovxsim_test2 \
            php tests/roles_access_write_path_mysql_test.php

      - name: MAX messaging regressions
        shell: bash
        env:
          APP_ENV: test
        run: |
          set -euo pipefail
          php tests/max_integration_contract_test.php
          php tests/max_messaging_133_production_migration_contract_test.php
          php tests/max_messaging_production_acceptance_contract_test.php
          php tests/agent_db_migration_request_contract_test.php
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          CREATE DATABASE IF NOT EXISTS `spugovxsim_test2` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL PRIVILEGES ON `spugovxsim_test2`.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
          PLANEX_SCHEMA_DB_HOST=127.0.0.1 \
          PLANEX_SCHEMA_DB_PORT=3306 \
          PLANEX_SCHEMA_DB_USER=planex_ci \
          PLANEX_SCHEMA_DB_PASSWORD=planex_ci \
          PLANEX_TEST_FIXED_DB=spugovxsim_test2 \
          PLANEX_TEST_FIXED_DB_ALLOWLIST=spugovxsim_test2 \
            php tests/max_integration_mysql_test.php

      - name: FEO transfers and access regressions
        shell: bash
        env:
          APP_ENV: test
          PLANEX_SCHEMA_DB_HOST: 127.0.0.1
          PLANEX_SCHEMA_DB_PORT: 3306
          PLANEX_SCHEMA_DB_USER: planex_ci
          PLANEX_SCHEMA_DB_PASSWORD: planex_ci
          PLANEX_TEST_FIXED_DB: spugovxsim_test2
          PLANEX_TEST_FIXED_DB_ALLOWLIST: spugovxsim_test2
        run: |
          set -euo pipefail
          php tests/feo_transfers_contract_test.php
          php tests/feo_legacy_import_sync_mysql_test.php
          php tests/feo_legacy_xa_mysql_test.php
          php tests/feo_legacy_weight_bridge_xa_mysql_test.php
          php tests/feo_legacy_sync_configuration_test.php
          php tests/feo_xlsx_parser_format_test.php
          php tests/feo_import_modal_regression_test.php
          php tests/feo_requests_contract_test.php
          php tests/feo_transfers_mysql_test.php
          php tests/feo_legacy_transfer_mirror_mysql_test.php
          php tests/feo_transfers_access_mysql_test.php
          php tests/feo_transfers_139_production_migration_contract_test.php
          php tests/feo_weights_160_production_migration_contract_test.php
          php tests/feo_transfers_139_migration_mysql_test.php
          php tests/feo_transfers_activation_contract_test.php
          php tests/feo_transfers_activation_mysql_test.php
          php tests/feo_share_statistics_contract_test.php
          php tests/feo_share_statistics_mysql_test.php
          php tests/cargo_balance_statistics_contract_test.php
          php tests/cargo_balance_statistics_mysql_test.php

      - name: Changed Python syntax checks
        if: steps.changes.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.full_scan }}" = "true" ]; then
            python3 -m py_compile tools/*.py
          else
            grep -E '^tools/.*\.py$' /tmp/changed_files | while IFS= read -r f; do
              [ -f "$f" ] || continue
              python3 -m py_compile "$f"
            done
          fi

      - name: Control-plane preflight regression contracts
        if: steps.changes.outputs.control_plane == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ci_scope_test.py
          python3 tests/agent_preflight_test.py
          python3 tests/runner_helpers_contract_test.py
          python3 tests/sentinelx_hardening_test.py

      - name: Migration checks when relevant
        if: steps.changes.outputs.migrations == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          failed = False
          for d in (Path('database/migrations'), Path('database/migrations-local')):
              rows = []
              if d.exists():
                  for p in d.glob('*.sql'):
                      m = re.match(r'(\d+)_', p.name)
                      if m:
                          rows.append((int(m.group(1)), p.name))
              counts = Counter(n for n, _ in rows)
              duplicates = {n: [f for nn, f in rows if nn == n] for n, c in counts.items() if c > 1}
              print(f'{d}: migrations={len(rows)} duplicates={duplicates}')
              if duplicates:
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Migration normalization regression
        if: steps.changes.outputs.migration_normalization == 'true'
        run: |
          set -euo pipefail
          test -f database/migrations-local/057_create_crew_drivers.sql
          test -f database/migrations-local/058_create_linear_route_points.sql
          test ! -f database/migrations-local/029_create_crew_drivers.sql
          test ! -f database/migrations-local/052_create_linear_route_points.sql
          grep -q "029_create_crew_drivers.sql.*057_create_crew_drivers.sql" scripts/p40_reconcile_migration_names.php
          grep -q "052_create_linear_route_points.sql.*058_create_linear_route_points.sql" scripts/p40_reconcile_migration_names.php

      - name: Tenant provisioning and schema contract
        if: steps.changes.outputs.tenant_schema == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          mysql -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          ALTER USER 'planex_ci'@'127.0.0.1' IDENTIFIED BY 'planex_ci';
          GRANT ALL PRIVILEGES ON *.* TO 'planex_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
          php tests/tenant_schema_provisioning_contract_test.php
          PLANEX_SCHEMA_CANDIDATE_DIR=/tmp/planex-tenant-schema-docs php tools/database/generate_schema_docs.php --check

      - name: Upload tenant schema drift candidate
        if: always() && steps.changes.outputs.tenant_schema == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tenant-schema-docs-candidate
          path: /tmp/planex-tenant-schema-docs
          if-no-files-found: ignore
          retention-days: 3

      - name: Dynamic identifier safety audit
        run: python3 tools/dynamic_table_safety_audit.py

      - name: Architecture guard
        run: php tools/architecture_guard.php

      - name: Changed JavaScript syntax
        if: steps.changes.outputs.js == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.full_scan }}" = "true" ]; then
            while IFS= read -r -d '' f; do node --check "$f"; done < <(find public/assets/js tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          else
            grep -E '\.(js|mjs)$' /tmp/changed_files | while IFS= read -r f; do
              [ -f "$f" ] || continue
              node --check "$f"
            done
          fi

      - name: Setup Node for UI Pattern Lab visual QA
        if: steps.changes.outputs.ui_lab == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium for UI Pattern Lab visual QA
        if: steps.changes.outputs.ui_lab == 'true'
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: UI Pattern Lab browser QA
        if: steps.changes.outputs.ui_lab == 'true'
        shell: bash
        run: |
          set -euo pipefail
          session_dir=/tmp/erp-ui-pattern-lab-sessions
          cookie_name=ERPUI
          mkdir -p "$session_dir" artifacts

          SESSION_SAVE_PATH="$session_dir" SESSION_COOKIE_NAME="$cookie_name" php -r '
            session_name(getenv("SESSION_COOKIE_NAME"));
            session_save_path(getenv("SESSION_SAVE_PATH"));
            session_id("uiadmin");
            session_start();
            $_SESSION = ["user_id" => 1, "user_name" => "UI Reviewer", "role_code" => "superadmin", "company_id" => 0];
            session_write_close();
          '
          SESSION_SAVE_PATH="$session_dir" SESSION_COOKIE_NAME="$cookie_name" php -r '
            session_name(getenv("SESSION_COOKIE_NAME"));
            session_save_path(getenv("SESSION_SAVE_PATH"));
            session_id("uilogist");
            session_start();
            $_SESSION = ["user_id" => 2, "user_name" => "UI Restricted", "role_code" => "logist", "company_id" => 0];
            session_write_close();
          '

          SESSION_SAVE_PATH="$session_dir" SESSION_COOKIE_NAME="$cookie_name" APP_BASE_PATH="" \
            php -S 127.0.0.1:8016 -t public public/index.php >/tmp/ui-pattern-lab-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8016/login >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/ui-pattern-lab-server.log
            exit 1
          fi

          UI_LAB_BASE_URL=http://127.0.0.1:8016 UI_LAB_SESSION_COOKIE="$cookie_name" \
            node .github/ui-pattern-lab/ui_pattern_lab_visual.js

      - name: Upload UI Pattern Lab screenshot artifact
        if: always() && steps.changes.outputs.ui_lab == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-pattern-lab-v0-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Control-plane guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          deploy_engine = 'P07_' + 'deploy_erpv2.sh'
          violations = []
          production_write = []
          for p in Path('.github/workflows').glob('*.y*ml'):
              if p.name == 'ci.yml': continue
              text = p.read_text(encoding='utf-8')
              mutating = any(token in text for token in [deploy_engine,'public_html/erpv2','deploy_backups','git push origin'])
              if not mutating: continue
              production_write.append(str(p))
              manual = '\n  workflow_dispatch:' in text
              automatic = any(trigger in text for trigger in ['\n  workflow_run:','\n  push:','\n  pull_request:','\n  schedule:'])
              if not manual or automatic:
                  violations.append(str(p))
          print('production-write workflows=', production_write)
          print('automatic production-write violations=', violations)
          raise SystemExit(1 if violations else 0)
          PY

      - name: Canonical manual deploy policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          workflows = Path('.github/workflows')
          deploy_files = []
          for p in workflows.glob('*.y*ml'):
              if p.name == 'ci.yml': continue
              text = p.read_text(encoding='utf-8')
              if 'P07_deploy_erpv2.sh' in text: deploy_files.append((p, text))
          assert len(deploy_files) == 1, f'expected exactly one deploy workflow, found {len(deploy_files)}'
          p, text = deploy_files[0]
          assert p.name == 'erpv2_controlled_deploy.yml', f'unexpected deploy workflow: {p}'
          on_match = re.search(r'(?ms)^on:\s*\n(.*?)(?=^[A-Za-z_][A-Za-z0-9_-]*:\s*$)', text)
          assert on_match, 'deploy workflow on: block not found'
          on_block = on_match.group(1)
          events = re.findall(r'^  ([A-Za-z_][A-Za-z0-9_-]*):', on_block, flags=re.M)
          assert sorted(set(events)) == ['workflow_dispatch'], f'deploy triggers must be workflow_dispatch only, got {events}'
          for required in ['source_sha:','confirm_deploy:','required: true','DEPLOY_ERPV2','^[0-9a-f]{40}$','git cat-file -e "${SOURCE_SHA}^{commit}"','git checkout --detach "$SOURCE_SHA"','test "$(git rev-parse HEAD)" = "$SOURCE_SHA"','P07_erpv2_deployed_commit.txt']:
              assert required in text, f'missing deploy safety contract: {required}'
          for token in ['workflow_run:','\n  push:','\n  pull_request:','\n  schedule:']:
              assert token not in on_block, f'forbidden deploy trigger: {token.strip()}'
          for pattern in [r'php\s+artisan\s+migrate',r'doctrine:migrations',r'\bLocalMigrationService\b',r'\bmigrate\.php\b',r'\bmysql\b[^\n]*(?:database/migrations|migration)']:
              assert re.search(pattern, text, re.I) is None, f'migration command found in standard deploy: {pattern}'
          old_erp_write = re.compile(r'(?:rsync|cp|mv|install|tar\s+[^\n]*-C)\b[^\n]*(?:public_html/erp)(?:\s|/|$)(?!v2)', re.I)
          assert old_erp_write.search(text) is None, 'legacy /erp write detected in deploy workflow'
          print('CANONICAL_MANUAL_DEPLOY_POLICY=PASS')
          PY
