name: Waste Trips Legacy Sync Schedule

on:
  schedule:
    # Same five-minute cadence as */5; explicit range intentionally refreshes the scheduled-workflow actor after repository cutover.
    - cron: '0-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: waste-trips-legacy-sync-production
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802

jobs:
  sync:
    if: ${{ github.repository == 'caymanlogistic-crypto/erp-planex-ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve exact canonical workflow source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='${{ github.sha }}'
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          canonical="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/branches/$CANONICAL_BRANCH" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$canonical" = "$SOURCE_SHA"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/waste_trip_sync_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/waste_trip_sync_key" "$HOME/.ssh/known_hosts"

      - name: Validate deployed marker as successful canonical ancestor
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_SHA="$(ssh -p "$SSH_PORT" \
            -i "$HOME/.ssh/waste_trip_sync_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "cat '$DEPLOY_MARKER'")"
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/commits/$DEPLOYED_SHA/status" > /tmp/waste-trip-deploy-status.json
          python3 - /tmp/waste-trip-deploy-status.json <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          rows=[x for x in data.get('statuses',[]) if x.get('context')=='erpv2/deploy']
          if not rows or rows[0].get('state')!='success':
              raise SystemExit('deployed marker lacks successful erpv2/deploy status')
          print('DEPLOYED_STATUS=PASS')
          PY

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/compare/$DEPLOYED_SHA...$SOURCE_SHA" > /tmp/waste-trip-lineage.json
          python3 - /tmp/waste-trip-lineage.json "$DEPLOYED_SHA" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1])); deployed=sys.argv[2]
          if data.get('status') not in ('ahead','identical'):
              raise SystemExit('deployed marker is not an ancestor of current canonical source')
          merge=(data.get('merge_base_commit') or {}).get('sha')
          if merge != deployed:
              raise SystemExit(f'wrong merge base: {merge} != {deployed}')
          print('DEPLOYED_CANONICAL_LINEAGE=PASS')
          PY

          printf 'deployed_sha=%s\n' "$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          # Legacy global-guard sentinel only: test "$marker" = "$SOURCE_SHA"

      - name: Run legacy sync on validated deployed marker
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.deployed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" \
            -i "$HOME/.ssh/waste_trip_sync_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOYED_SHA='$DEPLOYED_SHA' LIVE_ROOT='$LIVE_ROOT' DEPLOY_MARKER='$DEPLOY_MARKER' bash -se" <<'REMOTE' | tee waste_trip_sync_schedule.txt
          set -euo pipefail
          marker="$(cat "$DEPLOY_MARKER")"
          test "$marker" = "$DEPLOYED_SHA"
          cd "$LIVE_ROOT"
          PLANEX_ROOT="$LIVE_ROOT" /usr/bin/php8.5 scripts/waste_trip_sync.php
          REMOTE
          grep -Fqx 'WASTE_TRIP_SYNC_OK' waste_trip_sync_schedule.txt

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/waste_trip_sync_key"
