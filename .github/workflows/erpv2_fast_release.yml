name: ERPv2 FAST Release

on:
  pull_request_target:
    branches:
      - chatgpt/production-stabilization-20260802
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

concurrency:
  group: erpv2-fast-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802
  CONTROLLED_DEPLOY_WORKFLOW: erpv2_controlled_deploy.yml

jobs:
  fast-gate-merge-dispatch:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'fast/') &&
      startsWith(github.event.pull_request.title, 'FAST:')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact base and FAST scope before checkout
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current_base="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/git/ref/heads/$CANONICAL_BRANCH" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$EVENT_BASE_SHA" = "$current_base"

          files_json="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"

          FILES_JSON="$files_json" python3 - <<'PY'
          import json, os, re
          files = json.loads(os.environ['FILES_JSON'])
          assert 1 <= len(files) <= 6, f'FAST requires 1..6 changed files, got {len(files)}'
          allowed = re.compile(r'^(?:app/View/pages/[A-Za-z0-9_./-]+\.php|public/assets/(?:css|js)/[A-Za-z0-9_./-]+|tests/[A-Za-z0-9_]+_ui_contract_test\.php)$')
          names = []
          changed_lines = 0
          has_ui = False
          for row in files:
              name = row['filename']
              assert allowed.fullmatch(name), f'non-FAST path: {name}'
              assert row.get('status') != 'removed', f'FAST may not delete files: {name}'
              changed_lines += int(row.get('additions', 0)) + int(row.get('deletions', 0))
              has_ui = has_ui or name.startswith('app/View/pages/') or name.startswith('public/assets/')
              names.append(name)
          assert has_ui, 'FAST requires at least one UI file'
          assert changed_lines <= 120, f'FAST change too large: {changed_lines} changed lines'
          with open('/tmp/erpv2_fast_files.txt', 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(names) + '\n')
          print('FAST_SCOPE=PASS')
          print(f'FAST_FILES={len(names)}')
          print(f'FAST_CHANGED_LINES={changed_lines}')
          PY
          printf 'head_sha=%s\nbase_sha=%s\n' "$EVENT_HEAD_SHA" "$current_base" >> "$GITHUB_OUTPUT"

      - name: Checkout exact FAST head after scope validation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.scope.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Approved registry component contract
        run: |
          python3 tests/registry_component_contract_test.py
          python3 tests/ui_standard_catalog_test.py
          python3 tools/ui_standard.py check
          python3 tests/ui_style_guard_test.py
          python3 tools/ui_style_guard.py --base "${{ steps.scope.outputs.base_sha }}" --head "${{ steps.scope.outputs.head_sha }}"

      - name: Production bootstrap before approved UI browser QA
        run: php tests/entrypoint_service_load_test.php

      - name: Setup Node for approved UI browser QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Approved UI browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
          node tests/ui_standard_gallery_browser_test.mjs
          node tests/ui_standard_lab_browser_test.mjs
          node tests/registry_visual_gate_test.mjs
          node tools/registry_visual_gate.mjs

      - name: Registered registry runtime and own-scope browser QA
        run: bash tools/ci_registry_runtime.sh

      - name: Changed PHP syntax only
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            case "$f" in *.php) php -l "$f" >/dev/null ;; esac
          done < /tmp/erpv2_fast_files.txt

      - name: Changed JavaScript syntax only
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            case "$f" in *.js|*.mjs) node --check "$f" ;; esac
          done < /tmp/erpv2_fast_files.txt

      - name: Cheap UI contracts
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for f in tests/*_ui_contract_test.php; do
            [ -f "$f" ] || continue
            found=1
            php "$f"
          done
          test "$found" = 1

      - name: Reconfirm base has not drifted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          EXPECTED_BASE: ${{ steps.scope.outputs.base_sha }}
        run: |
          set -euo pipefail
          current_base="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/git/ref/heads/$CANONICAL_BRANCH" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$current_base" = "$EXPECTED_BASE"

      - name: Squash merge exact FAST PR
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EXPECTED_HEAD: ${{ steps.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          payload="$(PR_TITLE="$PR_TITLE" EXPECTED_HEAD="$EXPECTED_HEAD" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'merge_method': 'squash',
              'sha': os.environ['EXPECTED_HEAD'],
              'commit_title': os.environ['PR_TITLE'],
              'commit_message': 'Guarded ERPv2 FAST release',
          }))
          PY
          )"
          response="$(curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -d "$payload")"
          merge_sha="$(RESPONSE="$response" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          assert data.get('merged') is True, data
          sha = data.get('sha', '')
          assert len(sha) == 40
          print(sha)
          PY
          )"
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Verify merge SHA is exact canonical HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          current="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/git/ref/heads/$CANONICAL_BRANCH" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$current" = "$MERGE_SHA"

      - name: Publish FAST release gate status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/statuses/$MERGE_SHA" \
            -d '{"state":"success","context":"erpv2/fast-release","description":"FAST scope and UI contracts passed; deploy dispatched"}' >/dev/null

      - name: Dispatch controlled deploy for exact merged SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          payload="$(MERGE_SHA="$MERGE_SHA" CANONICAL_BRANCH="$CANONICAL_BRANCH" python3 - <<'PY'
          import json, os
          print(json.dumps({
              'ref': os.environ['CANONICAL_BRANCH'],
              'inputs': {
                  'source_sha': os.environ['MERGE_SHA'],
                  'confirm_deploy': 'DEPLOY_ERPV2',
              },
          }))
          PY
          )"
          curl -fsS -o /dev/null -w '%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/workflows/$CONTROLLED_DEPLOY_WORKFLOW/dispatches" \
            -d "$payload" | grep -qx '204'
