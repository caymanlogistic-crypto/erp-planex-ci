name: FEO Warning Flow Fix Temporary

on:
  push:
    branches:
      - chatgpt/feo-warning-flow-fix-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact FEO warning flow fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          view = Path('app/View/pages/company_feo_requests.php')
          s = view.read_text()
          old = '.feo-table-card{min-width:0}'
          new = '.feo-table-card{display:block;min-width:0}'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one FEO card rule, got {s.count(old)}')
          view.write_text(s.replace(old, new, 1))

          test = Path('tests/feo_requests_contract_test.php')
          t = test.read_text()
          old_test = "str_contains($view, '.feo-table-card{min-width:0}')"
          new_test = "str_contains($view, '.feo-table-card{display:block;min-width:0}')"
          if t.count(old_test) != 1:
              raise SystemExit(f'expected exactly one workspace assertion, got {t.count(old_test)}')
          t = t.replace(old_test, new_test, 1)
          anchor = "$ok('table horizontal overflow is disabled', str_contains($view, 'overflow-x:hidden!important'));"
          insert = "$ok('FEO optional warning cannot consume the table grid row', str_contains($view, '.feo-table-card{display:block;min-width:0}') && str_contains($view, 'data-feo-search-message') && str_contains($view, 'data-feo-scroll'));\n"
          if t.count(anchor) != 1:
              raise SystemExit('table overflow test anchor not found exactly once')
          t = t.replace(anchor, insert + anchor, 1)
          test.write_text(t)
          PY
      - name: Remove temporary workflow from resulting tree
        run: git rm .github/workflows/feo_warning_flow_fix_tmp.yml
      - name: Validate FEO fix
        run: |
          set -euo pipefail
          php -l app/View/pages/company_feo_requests.php
          php -l tests/feo_requests_contract_test.php
          php tests/feo_requests_contract_test.php
          git diff --check
          grep -Fq '.feo-table-card{display:block;min-width:0}' app/View/pages/company_feo_requests.php
      - name: Commit exact FEO fix
        run: |
          set -euo pipefail
          git config user.name planexerp
          git config user.email info@plan-ex.ru
          git add -A
          git commit -m 'STANDARD: keep FEO rows visible under missing-ID warning'
          git push origin HEAD:chatgpt/feo-warning-flow-fix-20260825
