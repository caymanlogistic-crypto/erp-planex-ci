name: FEO Map Stage 1 Production Visual QA

on:
  push:
    branches:
      - qa/feo-map-stage1-production-20260828

permissions:
  contents: read
  statuses: read

env:
  SOURCE_SHA: ${{ github.sha }}
  LIVE_DIR: public_html

jobs:
  production-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact canonical and successful deploy status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          git fetch origin chatgpt/production-stabilization-20260802 --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPOSITORY/commits/$SOURCE_SHA/status" > /tmp/status.json
          python3 - /tmp/status.json <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          rows=[x for x in data.get('statuses',[]) if x.get('context')=='erpv2/deploy']
          if not rows or rows[0].get('state')!='success':
              raise SystemExit('exact source SHA does not have erpv2/deploy success')
          print('EXACT_DEPLOY_STATUS=PASS')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
      - name: Create temporary read-only QA sessions
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          REMOTE="/tmp/feo_map_stage1_qa_session_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes .github/feo-map-stage1/qa_session.php "$SSH_USER@$SSH_HOST:$REMOTE"
          OUT_LOGIST=$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT=\"\$HOME/planexp/${LIVE_DIR}/erpv2\" /usr/bin/php8.5 '$REMOTE' create logist")
          OUT_OWNER=$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT=\"\$HOME/planexp/${LIVE_DIR}/erpv2\" /usr/bin/php8.5 '$REMOTE' create company_owner")
          JSON_LOGIST=${OUT_LOGIST#QA_SESSION=}
          JSON_OWNER=${OUT_OWNER#QA_SESSION=}
          python3 - "$JSON_LOGIST" "$JSON_OWNER" "$GITHUB_ENV" <<'PY'
          import json,sys
          logist=json.loads(sys.argv[1]); owner=json.loads(sys.argv[2])
          if logist['cookie'] != owner['cookie']:
              raise SystemExit('QA cookie names differ')
          for obj in (logist,owner):
              for key in ('sid','csrf'):
                  print(f'::add-mask::{obj[key]}')
          with open(sys.argv[3],'a') as f:
              f.write(f"QA_COOKIE_NAME={logist['cookie']}\n")
              f.write(f"QA_LOGIST_SESSION_ID={logist['sid']}\nQA_LOGIST_CSRF_TOKEN={logist['csrf']}\n")
              f.write(f"QA_OWNER_SESSION_ID={owner['sid']}\n")
          PY
      - name: Browser QA on real production Stage 1
        run: node .github/feo-map-stage1/production_visual.js
      - name: Cleanup temporary QA sessions and prove old SIDs are unusable
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -u -o pipefail
          mkdir -p artifacts
          REMOTE="/tmp/feo_map_stage1_qa_session_${GITHUB_RUN_ID}.php"
          STATUS=0
          if [ -z "${QA_LOGIST_SESSION_ID:-}" ] || [ -z "${QA_OWNER_SESSION_ID:-}" ] || [ -z "${QA_COOKIE_NAME:-}" ]; then
            echo 'QA_SESSION_CLEANUP_FAIL=session env missing' | tee artifacts/qa-session-cleanup.txt
            STATUS=1
          else
            for ENTRY in "logist|${QA_LOGIST_SESSION_ID}|/company/feo/requests/map" "owner|${QA_OWNER_SESSION_ID}|/company/feo/utilizers"; do
              IFS='|' read -r ROLE SID PATH_PART <<< "$ENTRY"
              if OUT=$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
                "PLANEX_ROOT=\"\$HOME/planexp/${LIVE_DIR}/erpv2\" /usr/bin/php8.5 '$REMOTE' delete '$SID'"); then
                printf '%s=%s\n' "$ROLE" "$OUT" | tee -a artifacts/qa-session-cleanup.txt
                [ "$OUT" = 'QA_SESSION_DELETED' ] || STATUS=1
              else
                STATUS=1
              fi
              HTTP=$(curl -sS -D "artifacts/qa-${ROLE}-old-sid-headers.txt" -o /dev/null -w '%{http_code}' \
                -H "Cookie: ${QA_COOKIE_NAME}=${SID}" "https://plan-ex.ru/erpv2${PATH_PART}" || true)
              printf 'QA_%s_OLD_SID_HTTP=%s\n' "$ROLE" "$HTTP" | tee -a artifacts/qa-session-cleanup.txt
              if [ "$HTTP" = '200' ]; then STATUS=1; fi
            done
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$REMOTE' && test ! -e '$REMOTE'" || STATUS=1
          fi
          rm -f "$HOME/.ssh/key"
          [ "$STATUS" -eq 0 ] && echo 'QA_SESSION_CLEANUP=PASS' | tee -a artifacts/qa-session-cleanup.txt
          exit "$STATUS"
      - name: Upload real production Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feo-map-stage1-production-visual-${{ env.SOURCE_SHA }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
