name: Waste Trips 130 Production Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact canonical SHA already deployed to ERPv2
        required: true
        type: string
      confirm_migration:
        description: Type APPLY_WASTE_TRIPS_130
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: waste-trips-130-production-migration
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  DEPLOY_MARKER: /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt

jobs:
  migrate-130:
    if: ${{ inputs.confirm_migration == 'APPLY_WASTE_TRIPS_130' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Validate exact canonical source and tooling
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/chatgpt/production-stabilization-20260802 | awk '{print $1}')" = "$SOURCE_SHA"
          php -l scripts/waste_trips_apply_130.php
          php -l scripts/waste_trips_verify_130.php
          php -l scripts/waste_trip_sync.php
          php tests/waste_trips_130_production_migration_contract_test.php
          php tests/agent_db_migration_request_contract_test.php
          test -s database/migrations-local/130_waste_trip_legacy_linked_cutover.sql

      - name: Require successful canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100" > /tmp/runs.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/runs.json'))
          required={'ERP PLANEX CI','Waste Trips Regression'}
          ok={name:False for name in required}
          for run in data.get('workflow_runs',[]):
              if run.get('name') in required and run.get('status')=='completed' and run.get('conclusion')=='success':
                  ok[run['name']]=True
          missing=[name for name,passed in ok.items() if not passed]
          if missing:
              raise SystemExit('required successful canonical CI missing: '+', '.join(missing))
          print('WASTE_130_CI_GATE_OK')
          PY

      - name: Publish pending migration status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - > /tmp/payload.json <<'PY'
          import json
          print(json.dumps({'state':'pending','context':'erpv2/migration130','description':'Waste Trips migration 130 in progress'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Require deployed marker and upload isolated tooling
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$DEPLOY_MARKER'")"
          test "$DEPLOYED" = "$SOURCE_SHA"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/waste_trips_apply_130.php "$SSH_USER@$SSH_HOST:/tmp/waste_apply130_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/waste_trips_verify_130.php "$SSH_USER@$SSH_HOST:/tmp/waste_verify130_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            database/migrations-local/130_waste_trip_legacy_linked_cutover.sql "$SSH_USER@$SSH_HOST:/tmp/waste_130_${GITHUB_RUN_ID}.sql"

      - name: Read-only snapshot before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/waste_verify130_${GITHUB_RUN_ID}.php'" | tee waste130_before.txt
          grep -q 'WASTE_130_READ_ONLY_OK' waste130_before.txt

      - name: Cutover preview
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TENANT_MIGRATION_PATH='/tmp/waste_130_${GITHUB_RUN_ID}.sql' /usr/bin/php8.5 '/tmp/waste_apply130_${GITHUB_RUN_ID}.php' --preview" | tee waste130_preview.txt
          grep -q 'WASTE_130_PREVIEW_OK' waste130_preview.txt

      - name: Apply controlled cutover
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TENANT_MIGRATION_PATH='/tmp/waste_130_${GITHUB_RUN_ID}.sql' PLANEX_WASTE_TRIPS_130_CONFIRM='APPLY_WASTE_TRIPS_130' /usr/bin/php8.5 '/tmp/waste_apply130_${GITHUB_RUN_ID}.php' --apply" | tee waste130_apply.txt
          grep -q 'WASTE_130_OK' waste130_apply.txt

      - name: Read-only snapshot after and verify invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '/tmp/waste_verify130_${GITHUB_RUN_ID}.php'" | tee waste130_after.txt
          grep -q 'WASTE_130_READ_ONLY_OK' waste130_after.txt
          python3 - <<'PY'
          import json,re
          text=open('waste130_after.txt').read()
          m=re.search(r'^WASTE_130_SNAPSHOT=(.+)$',text,re.M)
          if not m:
              raise SystemExit('after snapshot missing')
          data=json.loads(m.group(1))
          for t in data['tenants']:
              if t['migration_128'] != 1 or t['migration_129'] != 1 or t['migration_130'] != 1:
                  raise SystemExit(f"company {t['company_id']}: migration journal incomplete")
              if t['legacy_snapshot_rows'] != 0 or t['business_id_null'] != 0:
                  raise SystemExit(f"company {t['company_id']}: cutover business rows incomplete")
              if t['business_id_column'] != 1 or t['business_id_nullable'] != 'NO' or t['business_id_unique'] != 1:
                  raise SystemExit(f"company {t['company_id']}: business ID schema incomplete")
              if t['namespace_state_table'] != 1 or not t['state'] or not t['state']['cutover_completed_at']:
                  raise SystemExit(f"company {t['company_id']}: namespace state incomplete")
              if t['import_audit_table'] != 0 or t['operational_audit_table'] != 1:
                  raise SystemExit(f"company {t['company_id']}: audit schema cleanup incomplete")
          print('WASTE_130_AFTER_INVARIANTS_OK')
          PY

      - name: HTTP acceptance before scheduler
        shell: bash
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200

      - name: Initial legacy sync acceptance
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' /usr/bin/php8.5 '$LIVE_ROOT/scripts/waste_trip_sync.php'" | tee waste130_initial_sync.txt
          grep -Fqx 'WASTE_TRIP_SYNC_OK' waste130_initial_sync.txt

      - name: Install and verify five-minute scheduler
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          CRON_LINE="*/5 * * * * cd $LIVE_ROOT && PLANEX_ROOT=$LIVE_ROOT /usr/bin/php8.5 scripts/waste_trip_sync.php >> logs/waste_trip_sync.log 2>&1 # ERP PLANEX waste_trip_sync"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "set -e; command -v crontab >/dev/null; tmp=\$(mktemp); (crontab -l 2>/dev/null || true) | grep -Fv '# ERP PLANEX waste_trip_sync' > \"\$tmp\" || true; printf '%s\\n' '$CRON_LINE' >> \"\$tmp\"; crontab \"\$tmp\"; rm -f \"\$tmp\"; crontab -l | grep -Fqx '$CRON_LINE'; crontab -l | grep -F '# ERP PLANEX waste_trip_sync'" | tee waste130_cron.txt
          grep -Fq '*/5 * * * *' waste130_cron.txt
          grep -Fq '# ERP PLANEX waste_trip_sync' waste130_cron.txt

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waste_trips_130_production_migration_${{ inputs.source_sha }}
          path: |
            waste130_before.txt
            waste130_preview.txt
            waste130_apply.txt
            waste130_after.txt
            waste130_initial_sync.txt
            waste130_cron.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = success ]; then
            state=success; desc='Waste Trips migration 130 verified'
          else
            state=failure; desc='Waste Trips migration 130 failed'
          fi
          python3 - "$state" "$desc" > /tmp/payload.json <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'erpv2/migration130','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/payload.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          if [ -f "$HOME/.ssh/key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/waste_apply130_${GITHUB_RUN_ID}.php' '/tmp/waste_verify130_${GITHUB_RUN_ID}.php' '/tmp/waste_130_${GITHUB_RUN_ID}.sql'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/key"
