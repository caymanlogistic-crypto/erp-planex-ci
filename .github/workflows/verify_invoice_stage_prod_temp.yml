name: Temporary Invoice Stage Production Verify

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.head_ref == 'chatgpt/verify-invoice-stage-prod-20260820' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Report current production marker and invoice UI source
        shell: bash
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: e6cfaeae6264d7f14105009c12a91135ad3186fd
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/verify_key"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/verify_key" "$HOME/.ssh/known_hosts"
          ssh -p "$PORT" -i "$HOME/.ssh/verify_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "EXPECTED_SHA='$EXPECTED_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          MARKER="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          FILE="$LIVE/app/View/pages/company_finance_invoices.php"
          printf 'PRODUCTION_MARKER=%s\nEXPECTED_SHA=%s\n' "$MARKER" "$EXPECTED_SHA"
          if [ "$MARKER" = "$EXPECTED_SHA" ]; then echo 'MARKER_MATCH=YES'; else echo 'MARKER_MATCH=NO'; fi
          if [ -f "$FILE" ] && ! grep -q 'Статус счёта' "$FILE" && grep -q 'invoice-stage-card.is-paid' "$FILE" && grep -q "\$statusText = 'Оплачен';" "$FILE" && ! grep -q 'Оплачен с просрочкой' "$FILE" && grep -q 'Частично · просрочка' "$FILE" && grep -q 'is-overdue-remaining' "$FILE" && grep -q 'var(--danger-text)' "$FILE"; then
            echo 'INVOICE_STAGE_UI_SOURCE=PASS'
          else
            echo 'INVOICE_STAGE_UI_SOURCE=OLD_OR_MISMATCH'
          fi
          REMOTE
          http="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          printf 'HTTP_LOGIN=%s\nREAD_ONLY_PRODUCTION_PROBE=PASS\n' "$http"

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/verify_key"