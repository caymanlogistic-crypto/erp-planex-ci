name: Patch Waste Scheduler Guard Once

on:
  push:
    branches:
      - chatgpt/waste-trip-sync-scheduler-20260903
    paths:
      - .github/workflows/zz_patch_waste_scheduler_guard_once.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/waste-trip-sync-scheduler-20260903
          fetch-depth: 1
      - name: Apply narrow automatic-write exception
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zz_patch_waste_scheduler_guard_once.py
          php tests/waste_trip_scheduler_contract_test.php
          git diff --check
          git status --short
          git config user.name planexerp
          git config user.email info@plan-ex.ru
          git add -A
          git commit -m 'Control plane: narrowly authorize Waste Trips scheduled sync'
          git push origin HEAD:chatgpt/waste-trip-sync-scheduler-20260903
