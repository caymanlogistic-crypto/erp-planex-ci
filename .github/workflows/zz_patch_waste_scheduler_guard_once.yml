name: Build Waste Scheduler Guard Patch Once

on:
  push:
    branches:
      - chatgpt/waste-trip-sync-scheduler-20260903
    paths:
      - .github/workflows/zz_patch_waste_scheduler_guard_once.yml

permissions:
  contents: read

jobs:
  patch:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/waste-trip-sync-scheduler-20260903
          fetch-depth: 1
      - name: Build narrow automatic-write exception
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zz_patch_waste_scheduler_guard_once.py
          php tests/waste_trip_scheduler_contract_test.php
          git diff --check
          mkdir -p /tmp/waste-scheduler-guard
          cp .github/workflows/ci.yml /tmp/waste-scheduler-guard/ci.yml
          git diff -- .github/workflows/ci.yml > /tmp/waste-scheduler-guard/ci.patch
      - name: Upload patched CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: waste-scheduler-guard-patch
          path: /tmp/waste-scheduler-guard
          if-no-files-found: error
          retention-days: 1
