name: P50 Finance Cashless UI

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/Support/runtime_ui_hotfixes.php'
      - 'app/Http/Routes/company_finance_cash.php'
      - '.github/p50/**'
      - '.github/workflows/p50_finance_cashless_ui.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact deployed SHA for optional runtime verification'
        required: false
        type: string
      run_runtime:
        description: 'Run expensive Playwright production acceptance'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: p50-cashless-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify cashless UI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Взаиморасчёты с сотрудниками" app/Support/runtime_ui_hotfixes.php
          grep -q "Движение средств сотрудника" app/Support/runtime_ui_hotfixes.php
          grep -q "Получено сотрудником" app/Support/runtime_ui_hotfixes.php
          grep -q "Передано сотрудником" app/Support/runtime_ui_hotfixes.php
          ! grep -q "Создание и изменение кассовых операций" app/Http/Routes/company_finance_cash.php
          grep -q "Этот устаревший способ операции отключён" app/Http/Routes/company_finance_cash.php
          echo P50_STATIC_CASHLESS_UI_OK

  runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate source SHA
        shell: bash
        env:
          SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify exact deployed marker
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p50"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p50" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/p50" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$got" = "$SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            printf '%s\n' "$KEY" > /tmp/p50_key
            chmod 600 /tmp/p50_key
            cred="$(python .github/p11/P11_decrypt_credentials.py --key /tmp/p50_key --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Cashless finance UI runtime acceptance
        run: node .github/p50/P50_finance_cashless_runtime.js | tee P50_RUNTIME.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P50_finance_cashless_ui_${{ inputs.source_sha }}
          path: P50_RUNTIME.txt
          if-no-files-found: warn
