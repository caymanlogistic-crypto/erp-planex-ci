name: ERPv2 Agent Deploy Policy

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/workflows/erpv2_agent_deploy_request.yml'
      - '.github/workflows/erpv2_controlled_deploy.yml'
      - '.github/workflows/erpv2_agent_deploy_policy.yml'
      - 'docs/GITHUB_CONTROL_PLANE.md'
      - 'AGENTS.md'
  push:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/workflows/erpv2_agent_deploy_request.yml'
      - '.github/workflows/erpv2_controlled_deploy.yml'
      - '.github/workflows/erpv2_agent_deploy_policy.yml'
      - 'docs/GITHUB_CONTROL_PLANE.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpv2-agent-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify agent-driven deploy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          controlled = Path('.github/workflows/erpv2_controlled_deploy.yml').read_text(encoding='utf-8')
          agent = Path('.github/workflows/erpv2_agent_deploy_request.yml').read_text(encoding='utf-8')
          docs = Path('docs/GITHUB_CONTROL_PLANE.md').read_text(encoding='utf-8')
          agents = Path('AGENTS.md').read_text(encoding='utf-8')

          def on_block(text: str) -> str:
              m = re.search(r'(?ms)^on:\s*\n(.*?)(?=^[A-Za-z_][A-Za-z0-9_-]*:\s*$)', text)
              assert m, 'on block not found'
              return m.group(1)

          controlled_events = re.findall(r'^  ([A-Za-z_][A-Za-z0-9_-]*):', on_block(controlled), flags=re.M)
          assert sorted(set(controlled_events)) == ['workflow_dispatch'], controlled_events
          for token in [
              'DEPLOY_ERPV2', 'source_sha:', 'confirm_deploy:', 'P07_' + 'deploy_erpv2.sh',
              'statuses: write', 'erpv2/deploy', 'Publish deploy pending status',
              'Publish final deploy status', 'JOB_STATUS:', 'state=success',
          ]:
              assert token in controlled, token

          agent_on = on_block(agent)
          agent_events = re.findall(r'^  ([A-Za-z_][A-Za-z0-9_-]*):', agent_on, flags=re.M)
          assert sorted(set(agent_events)) == ['push'], agent_events
          assert '      - deploy/erpv2-agent' in agent_on
          for forbidden in ['workflow_run:', 'pull_request:', 'schedule:', 'workflow_dispatch:']:
              assert forbidden not in agent_on, forbidden

          required = [
              'actions: write',
              'github.actor == github.repository_owner',
              'CANONICAL_BRANCH: chatgpt/production-stabilization-20260802',
              'DEPLOY_REQUEST_BRANCH: deploy/erpv2-agent',
              'test "$SOURCE_SHA" = "$canonical_sha"',
              'Wait for exact canonical ERP PLANEX CI',
              'for attempt in $(seq 1 72)',
              'actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push',
              "run.get('conclusion') == 'success'",
              'Reconfirm canonical HEAD immediately before dispatch',
              'actions/workflows/$CONTROLLED_DEPLOY_WORKFLOW/dispatches',
              "'confirm_deploy': 'DEPLOY_ERPV2'",
          ]
          for token in required:
              assert token in agent, f'missing safeguard: {token}'

          assert 'deploy/erpv2-agent' in docs
          assert 'erpv2/deploy' in docs
          assert 'Canonical changes only through PR merge' in docs
          assert 'Production migrations must never run automatically' in docs
          assert 'FAST' in agents and 'STANDARD' in agents and 'CRITICAL' in agents
          assert 'Никогда не вызывать `create_file`, `update_file`, `delete_file`' in agents
          assert 'FAST whitelist' in agents
          print('ERPV2_AGENT_DEPLOY_POLICY=PASS')
          PY
