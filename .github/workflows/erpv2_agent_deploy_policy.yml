name: ERPv2 Agent Deploy Policy

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/workflows/erpv2_agent_deploy_request.yml'
      - '.github/workflows/erpv2_controlled_deploy.yml'
      - '.github/workflows/erpv2_fast_release.yml'
      - '.github/workflows/erpv2_agent_deploy_policy.yml'
      - '.github/workflows/ci.yml'
      - 'docs/GITHUB_CONTROL_PLANE.md'
      - 'AGENTS.md'
  push:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/workflows/erpv2_agent_deploy_request.yml'
      - '.github/workflows/erpv2_controlled_deploy.yml'
      - '.github/workflows/erpv2_fast_release.yml'
      - '.github/workflows/erpv2_agent_deploy_policy.yml'
      - '.github/workflows/ci.yml'
      - 'docs/GITHUB_CONTROL_PLANE.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpv2-agent-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify agent-driven deploy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          controlled = Path('.github/workflows/erpv2_controlled_deploy.yml').read_text(encoding='utf-8')
          agent = Path('.github/workflows/erpv2_agent_deploy_request.yml').read_text(encoding='utf-8')
          fast = Path('.github/workflows/erpv2_fast_release.yml').read_text(encoding='utf-8')
          ci = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          docs = Path('docs/GITHUB_CONTROL_PLANE.md').read_text(encoding='utf-8')
          agents = Path('AGENTS.md').read_text(encoding='utf-8')

          def on_block(text: str) -> str:
              m = re.search(r'(?ms)^on:\s*\n(.*?)(?=^[A-Za-z_][A-Za-z0-9_-]*:\s*$)', text)
              assert m, 'on block not found'
              return m.group(1)

          controlled_events = re.findall(r'^  ([A-Za-z_][A-Za-z0-9_-]*):', on_block(controlled), flags=re.M)
          assert sorted(set(controlled_events)) == ['workflow_dispatch'], controlled_events
          for token in [
              'DEPLOY_ERPV2', 'source_sha:', 'confirm_deploy:', 'P07_' + 'deploy_erpv2.sh',
              'statuses: write', 'erpv2/deploy', 'Publish deploy pending status',
              'Publish final deploy status', 'JOB_STATUS:', 'state=success',
          ]:
              assert token in controlled, token

          agent_on = on_block(agent)
          agent_events = re.findall(r'^  ([A-Za-z_][A-Za-z0-9_-]*):', agent_on, flags=re.M)
          assert sorted(set(agent_events)) == ['push'], agent_events
          assert '      - deploy/erpv2-agent' in agent_on
          for forbidden in ['workflow_run:', 'pull_request:', 'schedule:', 'workflow_dispatch:']:
              assert forbidden not in agent_on, forbidden

          required = [
              'actions: write',
              "github.ref_name == 'deploy/erpv2-agent'",
              'CANONICAL_BRANCH: chatgpt/production-stabilization-20260802',
              'DEPLOY_REQUEST_BRANCH: deploy/erpv2-agent',
              'CANONICAL_CI_WORKFLOW: ci.yml',
              'test "$SOURCE_SHA" = "$canonical_sha"',
              'Ensure exact canonical ERP PLANEX CI PASS',
              'read_state push',
              'read_state workflow_dispatch',
              'actions/workflows/$CANONICAL_CI_WORKFLOW/dispatches',
              'AGENT_DEPLOY_CANONICAL_CI_DISPATCHED=YES',
              "run.get('conclusion') == 'success'",
              'Reconfirm canonical HEAD immediately before dispatch',
              'actions/workflows/$CONTROLLED_DEPLOY_WORKFLOW/dispatches',
              "'confirm_deploy': 'DEPLOY_ERPV2'",
          ]
          for token in required:
              assert token in agent, f'missing safeguard: {token}'
          assert 'github.actor == github.repository_owner' not in agent, 'agent deploy request must not depend on technical event actor'
          for forbidden in ['ERPV2_SSH_PRIVATE_KEY', 'P07_' + 'deploy_erpv2.sh', 'public_html/' + 'erpv2', 'deploy_' + 'backups']:
              assert forbidden not in agent, f'agent request must remain control-plane only: {forbidden}'

          fast_on = on_block(fast)
          fast_events = re.findall(r'^  ([A-Za-z_][A-Za-z0-9_-]*):', fast_on, flags=re.M)
          assert sorted(set(fast_events)) == ['pull_request_target'], fast_events
          fast_required = [
              'github.event.pull_request.user.login == github.repository_owner',
              'github.event.pull_request.head.repo.full_name == github.repository',
              "startsWith(github.event.pull_request.head.ref, 'fast/')",
              "startsWith(github.event.pull_request.title, 'FAST:')",
              "allowed = re.compile(r'^(?:app/View/pages/",
              "tests/[A-Za-z0-9_]+_ui_contract_test",
              "changed_lines <= 120",
              "len(files) <= 6",
              "persist-credentials: false",
              "php -l",
              "tests/*_ui_contract_test.php",
              "'merge_method': 'squash'",
              "'sha': os.environ['EXPECTED_HEAD']",
              'Verify merge SHA is exact canonical HEAD',
              'erpv2/fast-release',
              'actions/workflows/$CONTROLLED_DEPLOY_WORKFLOW/dispatches',
              "'confirm_deploy': 'DEPLOY_ERPV2'",
          ]
          for token in fast_required:
              assert token in fast, f'missing FAST safeguard: {token}'
          assert 'github.actor == github.repository_owner' not in fast, 'FAST must authorize repository-owner PR, not technical event actor'
          forbidden_fast = [
              'ERPV2_SSH_PRIVATE_KEY',
              'P07_' + 'deploy_erpv2.sh',
              'public_html/' + 'erpv2',
              'deploy_' + 'backups',
          ]
          for forbidden in forbidden_fast:
              assert forbidden not in fast, f'FAST workflow must not own production secret/write engine: {forbidden}'

          for token in [
              'fetch-depth: 2',
              'Detect changed scope',
              'python3 tools/ci_scope.py',
              '--github-output "$GITHUB_OUTPUT"',
              'Control-plane preflight regression contracts',
              'Changed PHP syntax',
              'Targeted finance regressions',
              'Targeted linear-route regression',
              'Migration checks when relevant',
              'Dynamic identifier safety audit',
              'Architecture guard',
              'Control-plane guard',
              'Canonical manual deploy policy',
          ]:
              assert token in ci, f'missing incremental CI safeguard: {token}'
          assert 'git diff --name-only --diff-filter=ACMR HEAD^1 HEAD' not in ci, 'scope classifier must remain centralized in tools/ci_scope.py'
          assert "startsWith(github.head_ref, 'fast/')" in ci
          assert "startsWith(github.event.pull_request.title, 'FAST:')" in ci
          assert "startsWith(github.event.head_commit.message, 'FAST:')" in ci

          for token in [
              'deploy/erpv2-agent',
              'ERPv2 FAST Release',
              'canonical changes enter through PR merge',
              'Production migrations never run automatically',
              'Technical integration actor identity is not the current standard request gate',
          ]:
              assert token in docs, f'missing current control-plane documentation contract: {token}'

          for token in [
              'FAST', 'STANDARD', 'CRITICAL',
              'START_HEAD → WORK_BRANCH → LOCAL_PREFLIGHT_PASS → LOCAL_PUBLISH_PASS → FEATURE_HEAD → PR_NUMBER → CI_AGGREGATE_RESULT → MERGED_SHA → LIVE_NOTION_MEMORY_PASS → optional DEPLOY_RESULT',
              'Do not re-fetch canonical HEAD after ordinary edits, tests or Notion writes',
              'Repeat search/fetch is forbidden without ambiguity, drift or a state-changing event',
              'No placeholder/probe/temp/dummy files, empty/checkpoint commits or temporary verification PRs',
              'Do not duplicate a regression already triggered by GitHub',
              'Observe all required workflows for one `FEATURE_HEAD` as one aggregate gate',
              'Normal development is LOCAL:',
              'SentinelX and the persistent remote runner are outside the normal PLANEX task route',
              'Parallel LOCAL agents / shared-machine safety',
              'MEMORY drift/integrity is checked before publication',
              'PREFLIGHT_COVERAGE_DEFECT',
              '21 — MEMORY GOVERNANCE & INTEGRITY CONTRACT',
              'Legacy `/erp`: never touch',
          ]:
              assert token in agents, f'missing current agent-governance contract: {token}'
          assert 'Technical integration actor identity is not the current standard request gate' in agents
          print('ERPV2_AGENT_DEPLOY_POLICY=PASS')
          PY
