name: Document Generator Contract Template v3 Production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact canonical SHA containing verified template-v3 tooling'
        required: true
        type: string
      confirm_template_update:
        description: 'Type APPLY_DOCUMENT_GENERATOR_TEMPLATE_V3 to authorize immutable production template versioning'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: document-generator-template-v3-production
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2
  SERVER_ROOT: /home/s/spugovxsim/planexp
  CANONICAL_BRANCH: chatgpt/production-stabilization-20260802

jobs:
  template-v3:
    if: ${{ inputs.confirm_template_update == 'APPLY_DOCUMENT_GENERATOR_TEMPLATE_V3' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Validate exact canonical source and contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/$CANONICAL_BRANCH | awk '{print $1}')" = "$SOURCE_SHA"
          php -l scripts/document_generator_template_v3.php
          php -l tests/document_generator_template_v3_production_contract_test.php
          php tests/document_generator_template_v3_production_contract_test.php

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - >/tmp/status.json <<'PY'
          import json; print(json.dumps({'state':'pending','context':'erpv2/template-v3','description':'Document generator contract template v3 in progress'}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/status.json >/dev/null

      - name: Configure isolated SSH credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"

      - name: Prove exact source is already deployed and upload isolated tool
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat '$SERVER_ROOT/deploy/P07_erpv2_deployed_commit.txt'")"
          test "$marker" = "$SOURCE_SHA"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/document_generator_template_v3.php "$SSH_USER@$SSH_HOST:/tmp/docgen_template_v3_${GITHUB_RUN_ID}.php"
          echo "DEPLOYED_SOURCE_SHA=$marker"

      - name: Snapshot before and bind planned SHA
        id: before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TEMPLATE_ACTION=snapshot /usr/bin/php8.5 '/tmp/docgen_template_v3_${GITHUB_RUN_ID}.php'" | tee template_v3_before.txt
          grep -q 'DOCGEN_TEMPLATE_V3_READ_ONLY_OK' template_v3_before.txt
          planned_sha="$(python3 - <<'PY'
          import json,re
          line=next((x for x in open('template_v3_before.txt',encoding='utf-8') if x.startswith('DOCGEN_TEMPLATE_V3_SNAPSHOT=')),None)
          if not line: raise SystemExit('snapshot JSON missing')
          data=json.loads(line.split('=',1)[1])
          planned=[]
          for tenant in data.get('tenants',[]):
              for template in tenant.get('templates',[]):
                  if template.get('needs_update')==1:
                      planned.append(template.get('planned_sha256',''))
          if len(planned)!=1: raise SystemExit(f'expected exactly one proven production-v2 transition, found {len(planned)}')
          sha=planned[0]
          if not re.fullmatch(r'[0-9a-f]{64}',sha): raise SystemExit('planned v3 SHA invalid')
          print(sha)
          PY
          )"
          echo "planned_sha=$planned_sha" >> "$GITHUB_OUTPUT"
          echo "PLANNED_PRODUCTION_V3_SHA=$planned_sha"

      - name: Create and activate immutable template v3
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          PLANNED_SHA: ${{ steps.before.outputs.planned_sha }}
        run: |
          set -euo pipefail
          [[ "$PLANNED_SHA" =~ ^[0-9a-f]{64}$ ]]
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TEMPLATE_ACTION=apply PLANEX_EXPECTED_V3_SHA='$PLANNED_SHA' /usr/bin/php8.5 '/tmp/docgen_template_v3_${GITHUB_RUN_ID}.php'" | tee template_v3_apply.txt
          grep -q 'DOCGEN_TEMPLATE_V3_APPLY_OK' template_v3_apply.txt
          grep -q "$PLANNED_SHA" template_v3_apply.txt

      - name: Snapshot after and verify immutable transition
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          PLANNED_SHA: ${{ steps.before.outputs.planned_sha }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PLANEX_ROOT='$LIVE_ROOT' PLANEX_TEMPLATE_ACTION=snapshot PLANEX_EXPECTED_V3_SHA='$PLANNED_SHA' /usr/bin/php8.5 '/tmp/docgen_template_v3_${GITHUB_RUN_ID}.php'" | tee template_v3_after.txt
          grep -q 'DOCGEN_TEMPLATE_V3_READ_ONLY_OK' template_v3_after.txt
          python3 - "$PLANNED_SHA" "$(sed -n 's/^DOCGEN_TEMPLATE_V3_SNAPSHOT=//p' template_v3_before.txt)" "$(sed -n 's/^DOCGEN_TEMPLATE_V3_SNAPSHOT=//p' template_v3_after.txt)" <<'PY'
          import json,re,sys
          planned,before_raw,after_raw=sys.argv[1:4]
          if not re.fullmatch(r'[0-9a-f]{64}',planned): raise SystemExit('planned SHA invalid')
          before,after=map(json.loads,[before_raw,after_raw])
          if before.get('central_db')!=after.get('central_db'): raise SystemExit('central DB identity changed')
          b={x['company_id']:x for x in before['tenants']}; a={x['company_id']:x for x in after['tenants']}
          if set(b)!=set(a): raise SystemExit('tenant set changed')
          total=updated=0
          for cid,row in a.items():
              ob={x['template_id']:x for x in b[cid]['templates']}; oa={x['template_id']:x for x in row['templates']}
              if set(ob)!=set(oa): raise SystemExit(f'company {cid}: template set changed')
              for tid,new in oa.items():
                  prev=ob[tid]; total+=1
                  if prev.get('needs_update')==1:
                      updated+=1
                      if prev.get('state')!='production_v2' or prev.get('sha256')!='7b3b86b00f49521a95a41a107dcdaf63e969c36264befcac372e83c2d53a8d56':
                          raise SystemExit(f'company {cid} template {tid}: predecessor is not proven production-v2')
                      if prev.get('planned_sha256')!=planned: raise SystemExit('before planned SHA drift')
                      if new.get('state')!='production_v3' or new.get('sha256')!=planned:
                          raise SystemExit(f'company {cid} template {tid}: active production-v3 SHA invalid')
                      if new.get('version_no')!=prev.get('version_no')+1: raise SystemExit('version did not increment exactly once')
                  else:
                      if new.get('sha256')!=prev.get('sha256') or new.get('version_no')!=prev.get('version_no'):
                          raise SystemExit(f'company {cid} template {tid}: unrelated template changed')
                  if new.get('has_vehicle_vin')!=1 or new.get('has_trailer_display')!=1 or new.get('has_request_contacts')!=1:
                      raise SystemExit(f'company {cid} template {tid}: required v3 placeholders missing')
          if total<1 or updated!=1: raise SystemExit(f'unexpected transition cardinality total={total} updated={updated}')
          print('DOCGEN_TEMPLATE_V3_INVARIANTS_OK')
          PY

      - name: HTTP acceptance
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document_generator_template_v3_${{ inputs.source_sha }}
          path: |
            template_v3_before.txt
            template_v3_apply.txt
            template_v3_after.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; desc='Document generator contract template v3 verified'; else state=failure; desc='Document generator contract template v3 failed'; fi
          python3 - "$state" "$desc" >/tmp/status.json <<'PY'
          import json,sys; print(json.dumps({'state':sys.argv[1],'context':'erpv2/template-v3','description':sys.argv[2]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$REPOSITORY/statuses/$SOURCE_SHA" --data-binary @/tmp/status.json >/dev/null

      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/key" ]; then ssh -p "$SSH_PORT" -i "$HOME/.ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '/tmp/docgen_template_v3_${GITHUB_RUN_ID}.php'" 2>/dev/null || true; fi
          rm -f "$HOME/.ssh/key"
