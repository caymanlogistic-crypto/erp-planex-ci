<div class="registry-ui-checkboxes" aria-label="Обычные фильтры">
  <label class="registry-ui-checkbox"><input type="checkbox" checked>Скрыть завершённые</label>
  <label class="registry-ui-checkbox"><input type="checkbox">Только мои</label>
  <label class="registry-ui-checkbox"><input type="checkbox" disabled>Недоступный фильтр</label>
</div>
<div class="registry-ui-checkboxes registry-ui-checkboxes--trip-status" aria-label="Статусы рейсов">
  <label class="registry-ui-checkbox" data-status="planned_route"><input type="checkbox" checked>Планируемый</label>
  <label class="registry-ui-checkbox" data-status="executor_assigned"><input type="checkbox" checked>Сформированный</label>
  <label class="registry-ui-checkbox" data-status="in_progress"><input type="checkbox" checked>Вывоз начался</label>
  <label class="registry-ui-checkbox" data-status="completed"><input type="checkbox" checked>Груз сдан</label>
</div>
